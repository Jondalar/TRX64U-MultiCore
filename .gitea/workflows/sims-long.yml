name: Sims (long)

# The benches of tier 3 in ci/sims.txt: too long for the pipeline (the Atari disk benches, 46-65 min each on
# the Mac). On demand only - no push, no schedule (Alex, 2026-10-17: "Raus. Wofür haben wir das NAS ? ...
# Nur auf Knopfdruck", translated: out of the pipeline, that is what the NAS is for, on demand only).
# Start it before an Atari release. It runs on the NAS, two benches at a time (the NAS gives a job three
# cores and also runs Gitea), and shares the per-bench PASS markers of /cache/sims-ok: sources that did not
# change since the last PASS are not simulated again.
on:
  workflow_dispatch:
    inputs:
      benches:
        description: 'Bench names, space separated; empty = every tier-3 bench'
        type: string
        default: ''
      force:
        description: 'Run even where a PASS for the same sources exists'
        type: boolean
        default: false

jobs:
  sims-long:
    name: Simulations (tier 3)
    runs-on: nas
    container:
      image: trx64-sim-env:4
      options: --init
      volumes:
        - /srv/trx64-build/cache:/cache
    timeout-minutes: 600
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the source
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          SERVER="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "http://actions:${TOKEN}@${SERVER}/${GITHUB_REPOSITORY}.git" src
          # the commit this run is for, not the branch head: a push during the run must not change what a later stage builds
          if [ -n "${GITHUB_SHA:-}" ] && [ "$(git -C src rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            git -C src fetch -q --depth 1 origin "$GITHUB_SHA"
            git -C src checkout -q --detach FETCH_HEAD
          fi
          git -C src log --oneline -1
      - name: Check the simulator
        # The Atari disk benches link C++ into the simulation (VHPIDIRECT, ghdl -m -Wl,...): that needs GHDL with
        # the llvm or gcc code generator. An mcode GHDL cannot link and would fail after the long import.
        run: |
          ghdl --version | head -3
          if ghdl --version | grep -qi mcode; then echo "GHDL here is mcode: it cannot link the benches' C++ (VHPIDIRECT)"; exit 1; fi
      - name: Run the tier-3 benches
        env:
          BENCHES: ${{ inputs.benches }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eu
          cd src
          names="${BENCHES:-$(awk -F'|' '$1 == 3 { print $2 }' ci/sims.txt | tr '\n' ' ')}"
          [ -n "${names// }" ] || { echo "no tier-3 bench in ci/sims.txt"; exit 0; }
          echo "benches: $names"
          ci/sims.sh -t 3 -j 2 ${FORCE:+$([ "$FORCE" = true ] && echo -f)} $names
