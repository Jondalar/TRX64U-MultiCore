name: Package

# T174 D4: a child of the push pipeline (ci/children.txt; the parent .gitea/workflows/pipeline.yml dispatches it with sha, parent, target and plan),
# also runnable alone (workflow_dispatch: everything is named). It checks out inputs.sha and runs ci/child.sh, which is red at once with its reason.
# Concern: the complete release package (ci/package.sh). Job collect first hands over the bitstream stages this parent did not build (ci/collect.sh).
run-name: "package ${{ inputs.target }} @${{ inputs.sha }} (parent ${{ inputs.parent }})"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'the commit (the parent passes its own; empty = the branch head)'
        type: string
        default: ''
      parent:
        description: 'run id of the parent pipeline (empty = run alone)'
        type: string
        default: ''
      target:
        description: 'unused'
        type: string
        default: ''
      plan:
        description: 'plan.json of the parent (ci/plan.py); empty = run alone: everything is named'
        type: string
        default: ''

jobs:
  collect:
    name: Collect the bitstreams of the cache
    runs-on: ${{ vars.CI_RUNNER || 'builder' }}
    container:
      image: vivado-env:2024.1
      options: --init
      volumes:
        - /srv/trx64-build/cache:/cache
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the commit
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -eu
          SERVER="${GITHUB_SERVER_URL#*://}"
          git init -q src
          git -C src remote add origin "http://actions:${TOKEN}@${SERVER}/${GITHUB_REPOSITORY}.git"
          git -C src fetch -q --depth 1 origin "$SHA"
          git -C src checkout -q --detach FETCH_HEAD
          git -C src log --oneline -1
      - name: Collect
        env:
          PARENT: ${{ inputs.parent }}
          PLAN_JSON: ${{ inputs.plan }}
          CI_SHA: ${{ inputs.sha || github.sha }}
          CI_STATUS_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          # the same build options as vivado.yml's Vivado step: they are part of the host and core keys, so without them collect computes other
          # keys, misses the entries the vivado children wrote and builds a different host (run 1306: c841... instead of 5580...)
          TRX_SID: redip2
          TRX_FEATURES: jtag
          T79_GREYBOX: "1"
          T79_FLOOR: B
          TRX_CORE: vc20,amiga,c264
        run: src/ci/child.sh collect "${{ inputs.target }}"

  package:
    name: Package
    needs: collect
    runs-on: ${{ vars.CI_RUNNER || 'builder' }}
    container:
      image: u64-build-env:ci
      options: --init
      volumes:
        - /srv/trx64-build/cache:/cache
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the commit
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -eu
          SERVER="${GITHUB_SERVER_URL#*://}"
          git init -q src
          git -C src remote add origin "http://actions:${TOKEN}@${SERVER}/${GITHUB_REPOSITORY}.git"
          git -C src fetch -q --depth 1 origin "$SHA"
          git -C src checkout -q --detach FETCH_HEAD
          git -C src log --oneline -1
      - name: Publish
        env:
          PARENT: ${{ inputs.parent }}
          PLAN_JSON: ${{ inputs.plan }}
          CI_SHA: ${{ inputs.sha || github.sha }}
          CI_STATUS_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: src/ci/child.sh package "${{ inputs.target }}"
