name: Vivado

# T174 D4: a child of the push pipeline (ci/children.txt; the parent .gitea/workflows/pipeline.yml dispatches it with sha, parent, target and plan),
# also runnable alone (workflow_dispatch: everything is named). It checks out inputs.sha and runs ci/child.sh, which is red at once with its reason.
# Concern: one Vivado target: host (routed with the reference core, plus the aux designs), core:<id> (a DFX partial against the host of the
# cache), large:<id> (a flat build), ue2 (the 100T host, asked for). The build options are the env of the step `Vivado` (ci/pack_one.sh reads them here).
run-name: "vivado ${{ inputs.target }} @${{ inputs.sha }} (parent ${{ inputs.parent }})"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'the commit (the parent passes its own; empty = the branch head)'
        type: string
        default: ''
      parent:
        description: 'run id of the parent pipeline (empty = run alone)'
        type: string
        default: ''
      target:
        description: 'host, core:<id>, large:<id> or ue2'
        type: string
        default: 'host'
      plan:
        description: 'plan.json of the parent (ci/plan.py); empty = run alone: everything is named'
        type: string
        default: ''

jobs:
  vivado:
    name: Vivado
    runs-on: ${{ vars.CI_RUNNER || 'builder' }}
    container:
      image: vivado-env:2024.1
      options: --init
      volumes:
        - /srv/trx64-build/cache:/cache
    timeout-minutes: 600
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the commit
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -eu
          SERVER="${GITHUB_SERVER_URL#*://}"
          git init -q src
          git -C src remote add origin "http://actions:${TOKEN}@${SERVER}/${GITHUB_REPOSITORY}.git"
          git -C src fetch -q --depth 1 origin "$SHA"
          git -C src checkout -q --detach FETCH_HEAD
          git -C src log --oneline -1
      - name: Vivado
        if: ${{ !startsWith(inputs.target, 'large:') }}
        env:
          PARENT: ${{ inputs.parent }}
          PLAN_JSON: ${{ inputs.plan }}
          CI_SHA: ${{ inputs.sha || github.sha }}
          CI_STATUS_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          TRX_SID: redip2   # T79 measurement: two-SID reDIP instead of reSID8
          TRX_FEATURES: jtag   # T79 debug build: JTAG debug on, UDP streams and the rest off (find the stop after the splash)
          T79_GREYBOX: "1"   # T79 PoC: also write the grey-box partial (swap core -> empty -> core)
          T79_FLOOR: B   # T79: compact core region instead of the L (run 719: conflicts in the L's waist)
          TRX_CORE: vc20,amiga,c264   # T83/T85/T90 (layout branch): also build the VC-20, Amiga and C264 modules and their partial bitstreams
        run: src/ci/child.sh vivado "${{ inputs.target }}"
      - name: Flat build
        if: ${{ startsWith(inputs.target, 'large:') }}
        env:
          PARENT: ${{ inputs.parent }}
          PLAN_JSON: ${{ inputs.plan }}
          CI_SHA: ${{ inputs.sha || github.sha }}
          CI_STATUS_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: src/ci/child.sh vivado "${{ inputs.target }}"
