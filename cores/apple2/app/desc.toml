# ---- the state block of the bug report (reads without side effects only)
[[report_reg]]
name = "ID"
reg = 0x000
bytes = 4

[[report_reg]]
name = "CAPS2"
reg = 0x005
bytes = 1

[[report_reg]]
name = "CTRL"
reg = 0x0A0
bytes = 1

[[report_reg]]
name = "CFG"
reg = 0x0A1
bytes = 1

[[report_reg]]
name = "CAPS"
reg = 0x0A2
bytes = 1

[[report_reg]]
name = "STATUS (b0 reset, b1 held, b2 cold)"
reg = 0x0A4
bytes = 1

[[report_reg]]
name = "FRAMES"
reg = 0x0A8
bytes = 2

[[report_reg]]
name = "FB_LATEST"
reg = 0x0C0
bytes = 1

[[report_reg]]
name = "FRAME_SEQ"
reg = 0x0C1
bytes = 1

[[report_reg]]
name = "WIN_SEL"
reg = 0x0D4
bytes = 1

# ---- hotkeys (hk_defaults.h hk_typing): CTRL is a typing key on this machine, so the modifier is C= + CTRL, which it has no function for; then RESTORE menu, "+" / "-"
# volume, R reset, J swap joystick ports, P picture mode. Keys as hotkeys.h: 0-63 = col * 8 + row, 64 = RESTORE, 255 = none
[hotkeys]
mod = [61, 58]
actions = [64, 40, 43, 17, 34, 41, 255]
pc_keys = true

# the slots of the core's own media engine; their three functions (spec, mount, eject) are code
[mount]
names = ["D1", "D2", "S7.1", "S7.2"]
