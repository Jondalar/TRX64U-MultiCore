# The ZX Spectrum Next core (T116): the original FPGA source (GPL v3 or later) of the ZX Spectrum Next in rtl/ (vendored unchanged by
# tools/vendor_zxnext.sh at b047011), built from gen/ (tools/zxnext_gen.py: GHDL conversion to Verilog, every clock an enable on cpu_clk),
# the memories written again in ip/, our glue in trx/ (the 2 MB address space in the DDR2 behind caches, the SD card served from the app's
# image, the frame writer, the clock enables, the register block, keys, the DS1307). GPL v3 (rtl/NOTICE).
id           = "zxnext"
name         = "ZX Spectrum Next"
version      = "0.0.1"
contract     = 2
app          = "blueprint"     # the T104 generic application (coreapp/cores/zxnext.cc)
delivery     = "cfw"           # a LARGE core since 2026-10-28 (run 1013: it did not route in layer 2, "4 signals failed to route due to routing congestion", 10,130 LUT;
                               # Alex 2026-10-27: "VC20 usw - was nicht mehr DFX sein kann wird large Core. Einfach bauen.", translated: "VC20 etc. - whatever can no longer
                               # be DFX becomes a large core. Just build."): this file is the only descriptor, no DFX lane; cores/zxnext/mono/build_mono.tcl, lane large-zxnext
order        = 13              # after the Amstrad CPC (12)
experimental = true            # built, benched, application written; no board test; the flag keeps the bench rows soft
mono_env     = ["TRX_FEATURES=jtag"]   # the host features are the DFX build's (jtag on, UCI and UDP streams off)
sources      = ["cores/zxnext", ":(exclude)cores/zxnext/sim", ":(exclude)cores/zxnext/rtl", "cores/zx/trx/zx_keys.v", "cores/zx/shared/zxcpc_keyeng.v", "cores/amiga1200/sd"]
                               # rtl/ is the pristine upstream copy; what is built is gen/ (tracked), which tools/zxnext_gen.py makes from it and
                               # ci/lint.sh checks. The C64 -> ZX Spectrum key table is the Spectrum core's (zx_keys.v and its engine): read, not copied.
                               # cores/amiga1200/sd: the SD interface with IOB flops (T149 D5), read in place; the flat builds of amiga1200 and zxnext only.
roms         = []              # the Next has none of its own: its boot ROM is in the source, its OS and ROMs are on the user's SD image
