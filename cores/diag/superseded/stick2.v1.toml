# A joystick with a second button (the Competition Pro with the 2-button mod) in port 2: which pin or comparator bit moves for each button.
kind = "test"

[test]
name = "2-button stick, port 2"
id = "stick2"
version = 1
needs = ["joystick with two buttons"]

[[prompt]]
id = "idle"
text = "Plug the stick into port 2 and touch nothing. Then press RETURN."
timeout_s = 120

[[prompt]]
id = "b1"
text = "HOLD button 1 (the normal fire button), then press RETURN."
timeout_s = 30

[[prompt]]
id = "b2"
text = "HOLD button 2 only, then press RETURN."
timeout_s = 30

[[prompt]]
id = "rel"
text = "Let go of everything. Then press RETURN."
timeout_s = 30

[[step]]
op = "padctl"
dis = 1
adj = 0

[[step]]
op = "wait_user"
prompt = "idle"

[[step]]
op = "sample"
into = "idle"

[[step]]
op = "wait_user"
prompt = "b1"

[[step]]
op = "sample"
into = "b1"

[[step]]
op = "wait_user"
prompt = "b2"

[[step]]
op = "sample"
into = "b2"

[[step]]
op = "wait_user"
prompt = "rel"

[[step]]
op = "sample"
into = "rel"

[[eval]]
id = "idle_high"
value = "idle.pins"
mask = 992
eq = 992
verdict = "port 2 lines idle high"
fail = "a port 2 line is low with nothing pressed"

[[eval]]
id = "b1_pin6"
value = "b1.pins"
mask = 512
eq = 0
verdict = "button 1 pulls pin 6 low"
fail = "button 1 does not pull pin 6 low (or was not held)"

[[eval]]
id = "b2_pins"
value = "b2.pins"
mask = 992
differs = "idle"
verdict = "button 2 moves a port 2 line (see the measurements for which)"
fail = "button 2 moves no port 2 line"

[[eval]]
id = "b2_cmp"
value = "b2.cmp"
differs = "idle"
verdict = "button 2 moves a comparator bit (see the measurements for which)"
fail = "button 2 moves no comparator bit"

[[eval]]
id = "rel_pins"
value = "rel.pins"
mask = 992
eq = 992
verdict = "released: port 2 lines high again"
fail = "a port 2 line stays low after the release"

[result]
format = "toml"
