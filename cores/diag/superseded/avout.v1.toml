# A/V output: find the settings that give a stable colour picture on the TV at the C64U's A/V port (T201, GitHub discussion #59).
# The core draws colour bars (white, yellow, cyan, green, magenta, red, blue, black), a grey ramp and a marker that moves along the bottom. Connect the TV to the A/V port
# (S-Video, or composite on its chroma/luma inputs). The walk sets one combination after the other and asks about the picture; answer YES or NO, ESC stops.
# A NO to the first question skips the other two. The walk ends at the first combination where all answers are YES - then save it: Save A/V preset in the task list
# (Settings of this core show the values), and upload results/avout_<date>.txt and .toml.
# The walk: three bit orders (MSB first before Reversed) x four standards x six group assignments x V sign (the first 48 steps keep every bit order MSB first;
# the walk stops at the first all-YES). Burst window and blank level follow the standard. No answer within 30 s counts as NO (MISSED) and the walk goes on.
kind = "avtest"

[test]
name = "A/V output walk"
id = "avout"
version = 1

[ask]
questions = ["Do you see colour bars (not black and white)?", "Does the picture stand still?", "Is the first coloured bar (after the white one) yellow?"]
timeout_s = 30
first_gate = true
stop_after_ok = true

[sweep]
bits_a = ["MSB first", "Reversed"]
bits_b = ["MSB first", "Reversed"]
bits_c = ["MSB first", "Reversed"]
standard = ["NTSC 60 Hz", "PAL 50 Hz", "PAL 60 Hz", "NTSC 50 Hz"]
groups = ["Y=C, C=B, CVBS=A", "Y=C, C=A, CVBS=B", "Y=B, C=C, CVBS=A", "Y=B, C=A, CVBS=C", "Y=A, C=B, CVBS=C", "Y=A, C=C, CVBS=B"]
v_sign = ["Inverted", "Normal"]
