# A/V RGB mode (T259 S2): the C64 palette as R, G and B words on the three DAC channels, for a C64U to SCART RGB cable. Part 2 of avout.toml; skip it without the cable.
# Each step lights ONE word as a ramp across the picture (dark at the left to bright at the right), the other two words are 0; the Groups row says which channel carries which word
# (Y = the R word, C = the G word, CVBS = the B word; the channels are A = R, B = G, C = B with the Names map). The fourth step of every group shows the palette's colour bars.
# Question: the colour of the ramp on the screen (red, green, blue, or none / other). With the Names map and Groups "Y=A, C=B, CVBS=C" the R ramp should be red, the G ramp green,
# the B ramp blue. SYNCn and FB are as the A/V page has them: set them to what your TV needs (SCART: SYNCn Csync, FB High) before the walk. GOOD has no meaning here:
# the answers are the measurement. Upload results/avrgb_<date>.txt and .toml.
kind = "avtest"

[test]
name = "A/V RGB mode"
id = "avrgb"
version = 1

[ask]
questions = ["Which colour is the ramp (or the picture)?"]
choices_1 = ["red", "green", "blue", "none/other"]
good = ["none/other"]
timeout_s = 30
first_gate = false
stop_after_ok = false

[base]
mode = "RGB"
map = "Names"

[sweep]
groups = ["Y=A, C=B, CVBS=C", "Y=A, C=C, CVBS=B", "Y=B, C=A, CVBS=C", "Y=C, C=A, CVBS=B", "Y=B, C=C, CVBS=A", "Y=C, C=B, CVBS=A"]
rgb_picture = ["R ramp", "G ramp", "B ramp", "Palette picture"]
