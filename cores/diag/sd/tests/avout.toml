# The A/V port walk, version 3 (T259 S5): a suite of three walks in this order - avprobe (which channel and bit order the TV's input reads; map Names and Scan groups),
# avrgb (the RGB mode, if you have a C64U to SCART RGB cable) and avsync (what SYNCn and FB do). Each writes its own results/<id>_<date>.txt and .toml; the .txt of
# avprobe ends with the channel and bit order the TV locked on. The old vsync walk (NTSC 60 Hz) is avvsync.toml. ESC stops the walk that is running; the suite goes on with the next.
kind = "suite"

[suite]
id = "avout"
name = "A/V port walk"
tests = ["avprobe.toml", "avrgb.toml", "avsync.toml"]
