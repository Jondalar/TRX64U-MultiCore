# Amiga CD32 pad in port 2, one button at a time: which port pin or comparator bit each button moves, with the pot lines left free
# (DIS = 1, as stick2). A CD32 pad that is not switched into its shift mode (pin 5 high) acts as a joystick: then only the directions,
# red (pin 6) and blue (pin 9) can move anything, and the other buttons show nothing. The samples in the result show which bit moved.
kind = "test"

[test]
name = "CD32 pad buttons one by one, port 2"
id = "cd32keys"
version = 2
menu_input = "keyboard"
needs = ["CD32 pad"]

[[prompt]]
id = "idle"
text = "Plug the CD32 pad into port 2 and touch nothing. Then press RETURN."
timeout_s = 120

[[prompt]]
id = "red"
text = "Let go of everything. HOLD the RED button only and keep holding it, also while you press RETURN."
timeout_s = 300

[[prompt]]
id = "blue"
text = "Let go of everything. HOLD the BLUE button only and keep holding it, also while you press RETURN."
timeout_s = 300

[[prompt]]
id = "yellow"
text = "Let go of everything. HOLD the YELLOW button only and keep holding it, also while you press RETURN."
timeout_s = 300

[[prompt]]
id = "green"
text = "Let go of everything. HOLD the GREEN button only and keep holding it, also while you press RETURN."
timeout_s = 300

[[prompt]]
id = "lf"
text = "Let go of everything. HOLD the LEFT FRONT (shoulder) button only and keep holding it, also while you press RETURN."
timeout_s = 300

[[prompt]]
id = "rf"
text = "Let go of everything. HOLD the RIGHT FRONT (shoulder) button only and keep holding it, also while you press RETURN."
timeout_s = 300

[[prompt]]
id = "play"
text = "Let go of everything. HOLD the PLAY/PAUSE button only and keep holding it, also while you press RETURN."
timeout_s = 300

[[prompt]]
id = "up"
text = "Let go of everything. HOLD the pad UP only and keep holding it, also while you press RETURN."
timeout_s = 300

[[prompt]]
id = "down"
text = "Let go of everything. HOLD the pad DOWN only and keep holding it, also while you press RETURN."
timeout_s = 300

[[prompt]]
id = "left"
text = "Let go of everything. HOLD the pad LEFT only and keep holding it, also while you press RETURN."
timeout_s = 300

[[prompt]]
id = "right"
text = "Let go of everything. HOLD the pad RIGHT only and keep holding it, also while you press RETURN."
timeout_s = 300

[[prompt]]
id = "rel"
text = "Let go of everything. Then press RETURN."
timeout_s = 300

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "high"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "wait_user"
prompt = "idle"

[[step]]
op = "sample"
into = "idle"

[[step]]
op = "wait_user"
prompt = "red"

[[step]]
op = "sample"
into = "red"

[[step]]
op = "wait_user"
prompt = "blue"

[[step]]
op = "sample"
into = "blue"

[[step]]
op = "wait_user"
prompt = "yellow"

[[step]]
op = "sample"
into = "yellow"

[[step]]
op = "wait_user"
prompt = "green"

[[step]]
op = "sample"
into = "green"

[[step]]
op = "wait_user"
prompt = "lf"

[[step]]
op = "sample"
into = "lf"

[[step]]
op = "wait_user"
prompt = "rf"

[[step]]
op = "sample"
into = "rf"

[[step]]
op = "wait_user"
prompt = "play"

[[step]]
op = "sample"
into = "play"

[[step]]
op = "wait_user"
prompt = "up"

[[step]]
op = "sample"
into = "up"

[[step]]
op = "wait_user"
prompt = "down"

[[step]]
op = "sample"
into = "down"

[[step]]
op = "wait_user"
prompt = "left"

[[step]]
op = "sample"
into = "left"

[[step]]
op = "wait_user"
prompt = "right"

[[step]]
op = "sample"
into = "right"

[[step]]
op = "wait_user"
prompt = "rel"

[[step]]
op = "sample"
into = "rel"

[[eval]]
id = "idle_high"
value = "idle.pins"
pins = ["KBJOY_2_JOY0", "KBJOY_2_JOY1", "KBJOY_2_JOY2", "KBJOY_2_JOY3", "KBJOY_2_JOY4"]
eq = 31
verdict = "port 2 lines idle high"
fail = "a port 2 line is low with nothing pressed"

[[eval]]
id = "red_moves"
value = "red.pins"
pins = ["PADDLE_CMP0", "PADDLE_CMP1", "PADDLE_CMP2", "PADDLE_CMP3", "KBJOY_2_JOY0", "KBJOY_2_JOY1", "KBJOY_2_JOY2", "KBJOY_2_JOY3", "KBJOY_2_JOY4"]
differs = "idle"
verdict = "RED button: a pin or comparator bit moved"
fail = "RED button: nothing moved"

