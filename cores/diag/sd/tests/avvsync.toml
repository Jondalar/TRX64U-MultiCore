# A/V vsync walk, version 1 (was avout.toml v2): find the vertical sync that makes the picture stand still at NTSC 60 Hz (T201, GitHub issue #73, discussion #59).
# The core draws colour bars (white, yellow, cyan, green, magenta, red, blue, black), a grey ramp and a marker along the bottom. Connect the TV to the A/V port
# (S-Video, or composite on its chroma/luma inputs). The base values are the preset an NTSC tester found by hand (colour correct, but at 60 Hz the picture does not lock
# vertically): NTSC 60 Hz, groups Y=A C=B CVBS=C, bits C reversed, V sign Normal, trim +60 Hz, burst 16 .. 90 at 100 %, chroma gain 50 %, sync 8, blank 88, white 9/16.
# The walk sets one vsync combination after the other: 262 or 263 lines per frame, equalizing pulses off / on, the vsync length (3, 2.5 or 6 lines; with equalizing each of
# the three blocks is that long) and its position (-4, 0, +4 lines): 2 x 2 x 3 x 3 = 36 combinations. It asks two questions every time: does the picture stand still
# (no rolling, no jumping; YES is good) and the colour of the bar right of the white one (yellow / blue / other; yellow is good). The marker stands still while a question
# is open; ESC stops the walk. No answer within 30 s counts as MISSED and the walk goes on.
# Afterwards save a good combination (Save A/V preset in the task list; Settings of this core show the values) and upload results/avvsync_<date>.txt and .toml.
# The .txt lists every combination whose first answer was YES, with all its answers (GOOD marks the good ones); the .toml has every step.
kind = "avtest"

[test]
name = "A/V vsync walk"
id = "avvsync"
version = 1

[ask]
questions = ["Does the picture stand still (no rolling, no jumping)?", "Which colour is the bar right of the white one?"]
choices_2 = ["yellow", "blue", "other"]
good = ["YES", "yellow"]
timeout_s = 30
first_gate = false
stop_after_ok = false

[base]
standard = "NTSC 60 Hz"
groups = "Y=A, C=B, CVBS=C"
bits_a = "MSB first"
bits_b = "MSB first"
bits_c = "Reversed"
v_sign = "Normal"
subcarrier_trim = "+60 Hz"
burst_start = "16"
burst_end = "90"
burst_level = "100 %"
chroma_gain = "50 %"
sync_level = "8"
blank_level = "88"
white_level = "9/16"

[sweep]
lines_60_hz = ["263", "262"]
equalizing = ["Off", "On"]
vsync_length = ["3 lines", "2.5 lines", "6 lines"]
vsync_position = ["0", "-4", "+4"]
