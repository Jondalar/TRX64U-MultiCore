# Paddle charge time per potentiometer line (X1, Y1, X2, Y2). Paddles in both ports; each end is measured per comparator bit.
# PADDLE_DIS high discharges the pot capacitors (T47 hypothesis H), so each measurement discharges (PADDLE_DIS high), waits, lets go (PADDLE_DIS low) and times the comparator edge.
# The comparator-to-pot mapping is a hypothesis (T47): this test measures it. The numbers in the evals are first guesses.
kind = "test"

[test]
name = "Paddle charge time"
id = "paddle"
version = 1
needs = ["paddle"]

[[prompt]]
id = "left"
text = "Plug paddles into port 1 and port 2 and turn all of them fully to the LEFT. Then press RETURN."
timeout_s = 120

[[prompt]]
id = "right"
text = "Turn all paddles fully to the RIGHT. Then press RETURN."
timeout_s = 120

[[step]]
op = "wait_user"
prompt = "left"

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "high"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "wait"
us = 2000

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "low"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "time_to_edge"
pin = "PADDLE_CMP0"
timeout_us = 40000
into = "t_left_x1"

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "high"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "wait"
us = 2000

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "low"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "time_to_edge"
pin = "PADDLE_CMP1"
timeout_us = 40000
into = "t_left_y1"

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "high"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "wait"
us = 2000

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "low"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "time_to_edge"
pin = "PADDLE_CMP2"
timeout_us = 40000
into = "t_left_x2"

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "high"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "wait"
us = 2000

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "low"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "time_to_edge"
pin = "PADDLE_CMP3"
timeout_us = 40000
into = "t_left_y2"

[[step]]
op = "wait_user"
prompt = "right"

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "high"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "wait"
us = 2000

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "low"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "time_to_edge"
pin = "PADDLE_CMP0"
timeout_us = 40000
into = "t_right_x1"

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "high"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "wait"
us = 2000

[[step]]
op = "drive"
