# Which of the ten joystick-port pins can the FPGA drive low, and does anything pull a pin low by itself? Nothing is to be plugged in.
kind = "test"

[test]
name = "Pin drive and read-back"
id = "pins"
version = 1
needs = []

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "high"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "high"

[[step]]
op = "wait"
us = 50

[[step]]
op = "sample"
into = "base"

[[step]]
op = "drive"
pins = ["KBJOY_1_JOY0"]
level = "low"

[[step]]
op = "wait"
us = 20

[[step]]
op = "sample"
into = "d_p1_up"

[[step]]
op = "drive"
pins = ["KBJOY_1_JOY0"]
level = "release"

[[step]]
op = "wait"
us = 20

[[step]]
op = "drive"
pins = ["KBJOY_1_JOY1"]
level = "low"

[[step]]
op = "wait"
us = 20

[[step]]
op = "sample"
into = "d_p1_down"

[[step]]
op = "drive"
pins = ["KBJOY_1_JOY1"]
level = "release"

[[step]]
op = "wait"
us = 20

[[step]]
op = "drive"
pins = ["KBJOY_1_JOY2"]
level = "low"

[[step]]
op = "wait"
us = 20

[[step]]
op = "sample"
into = "d_p1_left"

[[step]]
op = "drive"
pins = ["KBJOY_1_JOY2"]
level = "release"

[[step]]
op = "wait"
us = 20

[[step]]
op = "drive"
pins = ["KBJOY_1_JOY3"]
level = "low"

[[step]]
op = "wait"
us = 20

[[step]]
op = "sample"
into = "d_p1_right"

[[step]]
op = "drive"
pins = ["KBJOY_1_JOY3"]
level = "release"

[[step]]
op = "wait"
us = 20

[[step]]
op = "drive"
pins = ["KBJOY_1_JOY4"]
level = "low"

[[step]]
op = "wait"
us = 20

[[step]]
op = "sample"
into = "d_p1_fire"

[[step]]
op = "drive"
pins = ["KBJOY_1_JOY4"]
level = "release"

[[step]]
op = "wait"
us = 20

[[step]]
op = "drive"
pins = ["KBJOY_2_JOY0"]
level = "low"

[[step]]
op = "wait"
us = 20

[[step]]
op = "sample"
into = "d_p2_up"

[[step]]
op = "drive"
pins = ["KBJOY_2_JOY0"]
level = "release"

[[step]]
op = "wait"
us = 20

[[step]]
op = "drive"
pins = ["KBJOY_2_JOY1"]
level = "low"

[[step]]
op = "wait"
us = 20

[[step]]
op = "sample"
into = "d_p2_down"

[[step]]
op = "drive"
pins = ["KBJOY_2_JOY1"]
level = "release"

[[step]]
op = "wait"
us = 20

[[step]]
op = "drive"
pins = ["KBJOY_2_JOY2"]
level = "low"

[[step]]
op = "wait"
us = 20

[[step]]
op = "sample"
into = "d_p2_left"

[[step]]
op = "drive"
pins = ["KBJOY_2_JOY2"]
level = "release"

[[step]]
op = "wait"
us = 20

[[step]]
op = "drive"
pins = ["KBJOY_2_JOY3"]
level = "low"

[[step]]
op = "wait"
us = 20

[[step]]
op = "sample"
into = "d_p2_right"

[[step]]
op = "drive"
pins = ["KBJOY_2_JOY3"]
level = "release"

[[step]]
op = "wait"
us = 20

[[step]]
op = "drive"
pins = ["KBJOY_2_JOY4"]
level = "low"

[[step]]
op = "wait"
us = 20

[[step]]
op = "sample"
into = "d_p2_fire"

[[step]]
op = "drive"
pins = ["KBJOY_2_JOY4"]
level = "release"

[[step]]
op = "wait"
us = 20

[[step]]
op = "drive"
pins = ["PADDLE_DIS"]
level = "low"

[[step]]
op = "drive"
pins = ["PADDLE_ADJ"]
level = "low"

[[step]]
op = "wait"
us = 50

[[step]]
op = "sample"
into = "pad_low"

[[eval]]
id = "stuck_p1_up"
value = "base.pins"
pins = ["KBJOY_1_JOY0"]
eq = 1
verdict = "p1_up idles high"
fail = "p1_up reads low without being driven (stuck)"

[[eval]]
id = "drv_p1_up"
value = "d_p1_up.pins"
pins = ["KBJOY_1_JOY0"]
eq = 0
verdict = "p1_up follows the drive"
fail = "p1_up stays high when driven (not driven)"

[[eval]]
id = "ok_p1_up"
all = ["stuck_p1_up", "drv_p1_up"]
verdict = "p1_up can be driven"
fail = "p1_up cannot be driven"

[[eval]]
id = "stuck_p1_down"
value = "base.pins"
pins = ["KBJOY_1_JOY1"]
