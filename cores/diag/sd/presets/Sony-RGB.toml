# TRX64U Port Diagnostics A/V preset (T259 P4): RGB on a C64U to SCART RGB cable, measured on Alex's Sony on 2026-11-26 (T259 section 5): Names map, Groups "Y=A, C=B, CVBS=C",
# MSB first on all three channels, SYNCn Csync (the sync the TV takes), FB High (the TV's RGB switch); the other knobs as Sony-PAL. Load it with Load preset in the A/V panel.
kind = "avpreset"

[preset]
name = "Sony-RGB"
Standard = "PAL 50 Hz"
Groups = "Y=A, C=B, CVBS=C"
Bits A = "MSB first"
Bits B = "MSB first"
Bits C = "MSB first"
V sign = "Inverted"
Subcarrier trim = "0 Hz"
Burst start = "28"
Burst end = "99"
Burst level = "100 %"
Chroma gain = "100 %"
Sync level = "0"
Blank level = "77"
White level = "11/16"
Equalizing = "Off"
Vsync length = "3 lines"
Vsync position = "0"
Lines 60 Hz = "263"
Map = "Names"
Mode = "RGB"
Probe channel = "A or R"
RGB picture = "Palette picture"
SYNCn = "Csync"
FB = "High"
