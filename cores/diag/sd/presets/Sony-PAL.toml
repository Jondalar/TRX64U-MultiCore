# TRX64U Port Diagnostics A/V preset (T259 P4): The C128's values (PAL, CVBS on A, C on B, Y on C, V sign inverted) on the boundary-scan groups: what Alex's Sony shows a colour picture with through composite (T140, 2026-10-31).
# Load it with Load preset in the A/V panel (panels/avout.toml); a walk names it as [base] preset = "Sony-PAL".
kind = "avpreset"

[preset]
name = "Sony-PAL"
Standard = "PAL 50 Hz"
Groups = "Y=C, C=B, CVBS=A"
Bits A = "MSB first"
Bits B = "MSB first"
Bits C = "MSB first"
V sign = "Inverted"
Subcarrier trim = "0 Hz"
Burst start = "28"
Burst end = "99"
Burst level = "100 %"
Chroma gain = "100 %"
Sync level = "0"
Blank level = "77"
White level = "11/16"
Equalizing = "Off"
Vsync length = "3 lines"
Vsync position = "0"
Lines 60 Hz = "263"
Map = "Scan groups"
Mode = "Test picture"
Probe channel = "A or R"
RGB picture = "Palette picture"
SYNCn = "High"
FB = "Low"
