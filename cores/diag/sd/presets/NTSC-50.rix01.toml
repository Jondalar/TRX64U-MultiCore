# TRX64U Port Diagnostics A/V preset (T259 P4): Rick's working values for his NTSC Commodore 1702 on luma / chroma (GitHub issue #73, T201): groups Y=A C=B CVBS=C, bits C reversed, V sign normal, trim +60 Hz, burst 16 to 90 at 100 %, chroma gain 50 %, sync 8, blank 88, white 9/16. Found on the scan groups.
# Load it with Load preset in the A/V panel (panels/avout.toml); a walk names it as [base] preset = "NTSC-50.rix01".
kind = "avpreset"

[preset]
name = "NTSC-50.rix01"
Standard = "NTSC 50 Hz"
Groups = "Y=A, C=B, CVBS=C"
Bits A = "MSB first"
Bits B = "MSB first"
Bits C = "Reversed"
V sign = "Normal"
Subcarrier trim = "+60 Hz"
Burst start = "16"
Burst end = "90"
Burst level = "100 %"
Chroma gain = "50 %"
Sync level = "8"
Blank level = "88"
White level = "9/16"
Equalizing = "Off"
Vsync length = "3 lines"
Vsync position = "0"
Lines 60 Hz = "263"
Map = "Scan groups"
Mode = "Test picture"
Probe channel = "A or R"
RGB picture = "Palette picture"
SYNCn = "High"
FB = "Low"
