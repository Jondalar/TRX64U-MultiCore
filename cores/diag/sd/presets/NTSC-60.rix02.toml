# TRX64U Port Diagnostics A/V preset (T259 P4): Rick's later values (issue #73): rix01 with the vsync 6 lines long, 263 lines at 60 Hz, trim +120 Hz, white 16/16. Found on the scan groups.
# Load it with Load preset in the A/V panel (panels/avout.toml); a walk names it as [base] preset = "NTSC-60.rix02".
kind = "avpreset"

[preset]
name = "NTSC-60.rix02"
Standard = "NTSC 60 Hz"
Groups = "Y=A, C=B, CVBS=C"
Bits A = "MSB first"
Bits B = "MSB first"
Bits C = "Reversed"
V sign = "Normal"
Subcarrier trim = "+120 Hz"
Burst start = "16"
Burst end = "90"
Burst level = "100 %"
Chroma gain = "50 %"
Sync level = "8"
Blank level = "88"
White level = "16/16"
Equalizing = "Off"
Vsync length = "6 lines"
Vsync position = "0"
Lines 60 Hz = "263"
Map = "Scan groups"
Mode = "Test picture"
Probe channel = "A or R"
RGB picture = "Palette picture"
SYNCn = "High"
FB = "Low"
