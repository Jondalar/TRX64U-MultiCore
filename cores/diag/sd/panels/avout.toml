default = "77"

[[row]]
key = "White level"
reg = "av.white"
names = ["8/16", "9/16", "10/16", "11/16", "12/16", "13/16", "14/16", "15/16", "16/16"]
values = [8, 9, 10, 11, 12, 13, 14, 15, 16]
min = 0
max = 31
default = "11/16"

[[row]]
key = "Equalizing"
reg = "av.syncb.eq"
names = ["Off", "On"]
min = 0
max = 1
default = "Off"

[[row]]
key = "Vsync length"
reg = "av.vlen"
names = ["3 lines", "2.5 lines", "6 lines"]
values = [6, 5, 12]
min = 0
max = 31
default = "3 lines"

[[row]]
key = "Vsync position"
reg = "av.vpos"
signed = true
names = ["-8", "-4", "0", "+4", "+8"]
values = [-8, -4, 0, 4, 8]
min = -128
max = 127
default = "0"

[[row]]
key = "Lines 60 Hz"
reg = "av.syncb.l262"
names = ["263", "262"]
min = 0
max = 1
default = "263"

[[row]]
key = "Map"
reg = "av.map"
names = ["Scan groups", "Names"]
min = 0
max = 1
default = "Scan groups"

[[row]]
key = "Mode"
reg = "av.mode"
names = ["Test picture", "Channel probe", "RGB"]
min = 0
max = 2
default = "Test picture"

[[row]]
key = "Probe channel"
reg = "av.pch"
names = ["A or R", "B or G", "C or B"]
min = 0
max = 2
default = "A or R"

[[row]]
key = "RGB picture"
reg = "av.rch"
names = ["Palette picture", "R ramp", "G ramp", "B ramp"]
min = 0
max = 3
default = "Palette picture"

[[row]]
key = "SYNCn"
reg = "av.synm"
names = ["High", "Low", "Csync", "Inverted csync"]
min = 0
max = 3
default = "High"

[[row]]
key = "FB"
reg = "av.fbm"
names = ["Low", "High", "Window", "Inverted window"]
min = 0
max = 3
default = "Low"

[[row]]
key = "Load preset"
action = "load"

[[row]]
key = "Save preset"
action = "save"

[[row]]
key = "Defaults"
action = "defaults"
