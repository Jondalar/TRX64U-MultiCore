# The A/V output panel (T201, T259; a panel file since T260 D5): one row per knob of the A/V test encoder (cores/diag/rtl/diag_avout.v), live in the registers. LEFT / RIGHT change
# the row and write its register at once; Load preset / Save preset read and write <folder>/presets/<name>.toml; Defaults puts every row back. The first 24 rows are also the knobs
# of the A/V walks (tests/av*.toml): their order and keys are the walks' contract (diagtest.cc), so rows are added after them. The Standard also sets the System Mode (the clock the
# subcarrier constant is for) and the C64_VIDEOFORMAT byte, as the C128's page does. Registers are named as in gateware.toml (the core's TOML A): block.property[.field].
kind = "panel"

[panel]
name = "A/V output"
presets = "presets"
preset_kind = "avpreset"

[[row]]
key = "Standard"
reg = "av.std"
system = true
video_format = [0x00, 0x2B, 0x2A, 0x01]
names = ["PAL 50 Hz", "NTSC 60 Hz", "PAL 60 Hz", "NTSC 50 Hz"]
min = 0
max = 3
default = "PAL 50 Hz"

[[row]]
key = "Groups"
reg = "av.perm"
names = ["Y=A, C=B, CVBS=C", "Y=A, C=C, CVBS=B", "Y=B, C=A, CVBS=C", "Y=C, C=A, CVBS=B", "Y=B, C=C, CVBS=A", "Y=C, C=B, CVBS=A"]
min = 0
max = 5
default = "Y=C, C=B, CVBS=A"

[[row]]
key = "Bits A"
reg = "av.rev"
shift = 0
mask = 1
names = ["MSB first", "Reversed"]
min = 0
max = 1
default = "MSB first"

[[row]]
key = "Bits B"
reg = "av.rev"
shift = 1
mask = 1
names = ["MSB first", "Reversed"]
min = 0
max = 1
default = "MSB first"

[[row]]
key = "Bits C"
reg = "av.rev"
shift = 2
mask = 1
names = ["MSB first", "Reversed"]
min = 0
max = 1
default = "MSB first"

[[row]]
key = "V sign"
reg = "av.vinv.vinv"
names = ["Normal", "Inverted"]
min = 0
max = 1
default = "Inverted"

[[row]]
key = "Subcarrier trim"
reg = "av.trim"
signed = true
# labels are for NTSC's clock (32.725694 MHz, 3.90 Hz per unit); PAL's clock is 4 percent lower, so PAL's real steps are 4 percent smaller
names = ["-500 Hz", "-490 Hz", "-480 Hz", "-470 Hz", "-460 Hz", "-450 Hz", "-440 Hz", "-430 Hz", "-420 Hz", "-410 Hz", "-400 Hz", "-390 Hz", "-380 Hz", "-370 Hz", "-360 Hz", "-350 Hz", "-340 Hz", "-330 Hz", "-320 Hz", "-310 Hz", "-300 Hz", "-290 Hz", "-280 Hz", "-270 Hz", "-260 Hz", "-250 Hz", "-240 Hz", "-230 Hz", "-220 Hz", "-210 Hz", "-200 Hz", "-190 Hz", "-180 Hz", "-170 Hz", "-160 Hz", "-150 Hz", "-140 Hz", "-130 Hz", "-120 Hz", "-110 Hz", "-100 Hz", "-90 Hz", "-80 Hz", "-70 Hz", "-60 Hz", "-50 Hz", "-40 Hz", "-30 Hz", "-20 Hz", "-10 Hz", "0 Hz", "+10 Hz", "+20 Hz", "+30 Hz", "+40 Hz", "+50 Hz", "+60 Hz", "+70 Hz", "+80 Hz", "+90 Hz", "+100 Hz", "+110 Hz", "+120 Hz", "+130 Hz", "+140 Hz", "+150 Hz", "+160 Hz", "+170 Hz", "+180 Hz", "+190 Hz", "+200 Hz", "+210 Hz", "+220 Hz", "+230 Hz", "+240 Hz", "+250 Hz", "+260 Hz", "+270 Hz", "+280 Hz", "+290 Hz", "+300 Hz", "+310 Hz", "+320 Hz", "+330 Hz", "+340 Hz", "+350 Hz", "+360 Hz", "+370 Hz", "+380 Hz", "+390 Hz", "+400 Hz", "+410 Hz", "+420 Hz", "+430 Hz", "+440 Hz", "+450 Hz", "+460 Hz", "+470 Hz", "+480 Hz", "+490 Hz", "+500 Hz"]
values = [-128, -126, -123, -121, -118, -115, -113, -110, -108, -105, -103, -100, -97, -95, -92, -90, -87, -85, -82, -79, -77, -74, -72, -69, -67, -64, -62, -59, -56, -54, -51, -49, -46, -44, -41, -38, -36, -33, -31, -28, -26, -23, -21, -18, -15, -13, -10, -8, -5, -3, 0, 3, 5, 8, 10, 13, 15, 18, 21, 23, 26, 28, 31, 33, 36, 38, 41, 44, 46, 49, 51, 54, 56, 59, 62, 64, 67, 69, 72, 74, 77, 79, 82, 85, 87, 90, 92, 95, 97, 100, 103, 105, 108, 110, 113, 115, 118, 121, 123, 126, 127]
min = -128
max = 127
default = "0 Hz"

[[row]]
key = "Burst start"
reg = "av.bstart"
names = ["16", "18", "20", "22", "24", "26", "28", "30", "32", "36", "40"]
values = [16, 18, 20, 22, 24, 26, 28, 30, 32, 36, 40]
min = 0
max = 127
default = "28"

[[row]]
key = "Burst end"
reg = "av.bend"
names = ["90", "94", "96", "98", "99", "100", "102", "104", "106", "110"]
values = [90, 94, 96, 98, 99, 100, 102, 104, 106, 110]
min = 0
max = 1023
default = "99"

[[row]]
key = "Burst level"
reg = "av.bamp"
names = ["0 %", "50 %", "75 %", "100 %", "125 %", "150 %"]
values = [0, 16, 24, 32, 40, 48]
min = 0
max = 63
default = "100 %"

[[row]]
key = "Chroma gain"
reg = "av.gain"
names = ["0 %", "50 %", "75 %", "100 %", "125 %", "150 %", "190 %"]
values = [0, 8, 12, 16, 20, 24, 30]
min = 0
max = 31
default = "100 %"

[[row]]
key = "Sync level"
reg = "av.sync"
names = ["0", "8", "16", "24", "32"]
values = [0, 8, 16, 24, 32]
