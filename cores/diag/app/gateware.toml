  offset = 0x00
  width = 8
  dir = "rw"
  [[block.property]]
  name = "status"
  offset = 0x01
  width = 8
  dir = "r"
    [[block.property.field]]
    name = "running"
    shift = 0
    bits = 1
    [[block.property.field]]
    name = "waiting"
    shift = 1
    bits = 1
    [[block.property.field]]
    name = "done"
    shift = 2
    bits = 1
    [[block.property.field]]
    name = "overflow"
    shift = 3
    bits = 1
    [[block.property.field]]
    name = "step_err"
    shift = 4
    bits = 1
  [[block.property]]
  name = "ctrl"
  offset = 0x02
  width = 8
  dir = "w"
    [[block.property.field]]
    name = "run"
    shift = 0
    bits = 1
    [[block.property.field]]
    name = "abort"
    shift = 1
    bits = 1
    [[block.property.field]]
    name = "go"
    shift = 2
    bits = 1
    [[block.property.field]]
    name = "clear"
    shift = 3
    bits = 1
  [[block.property]]
  name = "irq_cause"
  offset = 0x04
  width = 8
  dir = "rw"
  [[block.property]]
  name = "pc"
  offset = 0x06
  width = 8
  dir = "r"
  [[block.property]]
  name = "step_data"
  offset = 0x10
  width = 32
  dir = "w"
  [[block.property]]
  name = "step_addr"
  offset = 0x14
  width = 8
  dir = "rw"
  [[block.property]]
  name = "fifo_data"
  offset = 0x20
  width = 32
  dir = "r"
  [[block.property]]
  name = "fifo_level"
  offset = 0x24
  width = 16
  dir = "r"

# 040-043: the pins as the engine sees them (KBJOY_1[4:0], KBJOY_2[4:0], PADDLE_CMP[3:0]) and the pins it drives low
[[block]]
name = "live"
module = "diag_regs"
owner = "core"
address = 0x101A0040
size = 0x04
  [[block.property]]
  name = "live"
  offset = 0x00
  width = 16
  dir = "r"
  [[block.property]]
  name = "drv"
  offset = 0x02
  width = 16
  dir = "r"

