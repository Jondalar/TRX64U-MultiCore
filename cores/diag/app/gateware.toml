# TOML A of the Port Diagnostics core (T260 P7): the gateware's registers as capabilities, written from what cores/diag/rtl/diag_regs.v decodes (tools/rtl_check.py proves it against the RTL,
# code to code; the case of tests/rtl_check, command in app/sdkpkg/api.md 6.14.19). The addresses are the host's: its decode hands 0x101A0000-0x101AFFFF to the core's cw_* ports, the
# register offset of the core's own app is the address minus 0x101A0000 (the block "ident" sits at the start of the window). Page 6 (0x101A6000) is forwarded to the host's pixel layer.
# desc.toml names a register of this file as "block.property" (tools/descrec.py, api.md 6.14.20), so the number stands once.
[io]
iobase = 0x10000000
u2p_io_base = 0x10100000

[identity]
id = "DIAG"
block = "ident"

# 000-00F: the ID "DIAG" (byte 0 first), the caps bytes, DCAPS (b0 the joystick pins are open-drain outputs, b1 PADDLE_DIS / PADDLE_ADJ are driven by the engine, b2 the A/V test encoder, b3 the pin bank v2: ROM and DRIVE by index, b4 capture), the build word, TICKS_US_X256 (00C-00F, engine clocks per microsecond x 256)
[[block]]
name = "ident"
module = "diag_regs"
owner = "base"
address = 0x101A0000
size = 0x10
  [[block.property]]
  name = "id"
  offset = 0x00
  width = 32
  dir = "r"
  [[block.property]]
  name = "caps"
  offset = 0x04
  width = 8
  dir = "r"
  [[block.property]]
  name = "caps2"
  offset = 0x05
  width = 8
  dir = "r"
  [[block.property]]
  name = "dcaps"
  offset = 0x06
  width = 8
  dir = "r"
    [[block.property.field]]
    name = "pins"
    shift = 0
    bits = 1
    [[block.property.field]]
    name = "padctl"
    shift = 1
    bits = 1
    [[block.property.field]]
    name = "av"
    shift = 2
    bits = 1
    [[block.property.field]]
    name = "bank"
    shift = 3
    bits = 1
    [[block.property.field]]
    name = "capture"
    shift = 4
    bits = 1
  [[block.property]]
  name = "build"
  offset = 0x08
  width = 32
  dir = "r"
  [[block.property]]
  name = "ticks_us_x256"
  offset = 0x0C
  width = 32
  dir = "r"

