# T260 P1/P2: the pin bank of the diag core - the ONE source of the pin table. tools/diag_pins_gen.py generates from it
#   cores/diag/rtl/diag_pintab.vh   (IX_<name> indexes, N_PINS, the class / guard functions the probe engine uses)
#   cores/diag/rtl/diag_pinrom.v    (the pin-table ROM the application reads through registers 0C0-0DF)
#   cores/diag/mono/diag_dgin.vh    (mono/top.v: the snapshot input dg_in[index] = the net the top reads for that pin)
# and `--check` (lint, sim diag_pins) finds the generated files current and the table equal to the top's connector ports (S3).
#
# index   position in the snapshot (register 040-04F) and in the ROM; fixed numbers, never reused. At most 15 characters in `name`.
# port    the port of mono/top.v; bit = the bit of a vector port.   src = the net the top reads for the snapshot when it is not the port itself.
# dir     in: the snapshot is the ball. out: the snapshot is what the FPGA drives (a released tri-state output reads 0). inout: the ball.
# class   none = not drivable (read only);  od = open drain, LOW only;  pull = output 1 pulls the line low, LOW only (the snapshot bit is the output: 1 = pulling);
#         push = push-pull LOW / HIGH, released = the idle value (`idle`, or the host's own function when `host`);  pz = LOW / HIGH, released = high-Z;
#         pzh = as pz plus HIZ, released = driven 1 (the transceiver is off then).
# guard   a cartridge-port pin: the gateware refuses a drive and releases it while SLOT_GAMEn or SLOT_EXROMn is low (T260 D4).
# inv     the snapshot bit is 1 while the line is LOW (the IEC pins, SLOT_RST_I/O).   buf  behind a transceiver (the test sets DIR / OEn to read or drive it).
# pwr     a power enable: never driven.   gen  owned by a generator block (diag_avout): read only, set through WRITE_REG.   host  the host's own function when released.
# idle    level when released: 0, 1; absent = high-Z / host-owned.
