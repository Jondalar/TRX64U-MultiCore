# TOML B of the ZX Spectrum's app (T239.3 D55, T239.5 D16): what its own app is linked from. The app is built from the SDK package alone (tools/sdk_core_app.sh, ci/trxapps.sh); nothing else is in
# its link: the base's archives, the sources the base compiles for the core, the libraries named below and the blocks its TOML A names (tools/libtab.py mapcheck proves it on the link map). The
# base's own tools read the same file: tools/app_build.py (the link), tools/libtab.py (the library table), tools/cor_pack.py --sizes (the heap figures) and tools/core_toml.py (the switch desc_record).
[app]
name = "zx"
# D25: the packers put desc.toml into the .cor as record 6 and the app takes the core's data from it (coreapp/src/bundle.cc)
desc_record = true
# the symbol of the core's descriptor (the library zx below defines it); the core table of this app holds this core only
desc = "zx_desc"
# TOML A: the core's own (gateware.toml, checked against the RTL by tools/rtl_check.py) and the blocks of the host's TOML A that the shared drivers (hw.cc) name: the host's mode register
# (cart_regs), the five ICAP blocks of the loader, the partition block and the host's master volume and tone (audio_master). The core has no drive, no cartridge, no ring and no DMA window block
# of its own, so board.cc runs no cartridge, ring, REU or command interface probe in this app.
toml_a = "gateware.toml"
base_toml_a = "host.toml"
base_blocks = ["cart_regs", "icap_id", "icap_data", "icap_enable", "icap_count", "partition", "audio_master"]
# coreapp/cores of the base that this app links: run.cc starts the diag core's runner (portdiag_attach) in every app
base_sources = ["portdiag.cc"]

# The core's own code: its descriptor and hooks (init, release, the ROM and snapshot handling, the tape slot, the register map), the snapshot reader, the default hotkeys and the tape deck with its
# pulse converter (copies of the files the CPC and PET apps still share, T239.5 D16). Its files are in cores/zx/app/lib.
# T239.5 D4: the tests of the library, by the step of the matrix (units of tests/coreapp/run.sh, built as this app: zxapp): unit = 2 unit tests, service = 8 mock bitstream -> service, ui = 9 service -> UI,
# api = 10 service -> API (the ZX Spectrum's cases of the shared tests, TEST_APP_ZX)
[[library]]
name = "zx"
sources = ["zx.cc", "zx_snap.cc", "tape_deck.cc", "tape_pulses.cc"]
headers = ["zx_regs.h", "zx_snap.h", "tape_deck.h", "tape_pulses.h", "hk_defaults.h"]
tests = { unit = ["zx", "zx_snap", "boot_zx", "tape_zx"], service = ["zx_descgen"], ui = ["zx_desc", "zx_hotkeys"], api = ["zx_memops"] }
