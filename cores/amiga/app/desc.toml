[mouse]
kind = "counters"
reg_dx = 0x1C0
reg_dy = 0x1C1
reg_btn = 0x1C2
clamp = 4000
step = 127
interval_ms = 2

[romset]
role = "Kickstart"
ext = ".rom"
sizes = [262144, 524288]
size_text = "256K or 512K"
example = "kick13.rom"
max = 8
choice_key = "Kickstart file (at reload)"
auto_label = "Auto (1.3 first)"
want = 0x22
version = true
pick = true
head_bytes = 16
window_off = 0x780000
mirror_size = 262144
mirror_stride = 0x40000
clear_below = 0x780000

[window_media]
prefix = "DF"
nslots = 4
base = 0x900000
stride = 0xE0000
max_image = 901120
mount_reg = 0x100
mount_step = 0x10
track_bytes = 5632
ntracks = 160
dlog_status = 0x1F0
dlog_track = 0x1F1
dlog_drive = 0x1F2
dlog_pop = 0x1F3
idle_flush_ms = 1000
max_dirty_ms = 5000

[sector_media]
prefix = "HD"
nunits = 2
mount_reg = 0x180
mount_step = 8
feat_reg = 0xC
feat_sectors = 0x1
mbox_status = 0x1A0
mbox_lba = 0x1A4
mbox_done = 0x1A8
stage_off = 0xC80000
idle_sync_ms = 1000
done_tag_mask = 0x0

# the pad of game port 2 (T225): one port fed by the first pad plugged, its map kept per pad
[pad]
output = "registers"
regs = [0x1D0, 0]
per_pad = true
buttons = ["Up", "Down", "Left", "Right", "Fire (Red)", "Button 2 (Blue)", "Green", "Yellow", "Play", "Reverse (L)", "Forward (R)"]
default = ["up", "down", "left", "right", "face_bottom", "face_right", "face_left", "face_top", "start", "l", "r"]
