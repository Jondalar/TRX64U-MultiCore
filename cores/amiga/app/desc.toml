state = "amiga.df1.image"
eject_op = "window.eject"
eject_bind = [ { arg = "slot", int = 1 } ]
exts = ".adf"
mount = "Mount DF1"
empty_tasks = "Create blank ADF"

[[media]]
name = "DF2"
