# ---- file types
[[filetype]]
ext = ".adf"
  [[filetype.action]]
  label = "Mount DF0"
  op = "window.mount"
  bind = [ { arg = "path", file = true }, { arg = "slot", int = 0 } ]
  [[filetype.action]]
  label = "Mount DF0 and reset"
  op = "amiga.mount_reset"
  bind = [ { arg = "path", file = true } ]
  closes_menu = true
  [[filetype.action]]
  label = "Mount DF1"
  op = "window.mount"
  bind = [ { arg = "path", file = true }, { arg = "slot", int = 1 } ]
  [[filetype.action]]
  label = "Mount DF2"
  op = "window.mount"
  bind = [ { arg = "path", file = true }, { arg = "slot", int = 2 } ]
  [[filetype.action]]
  label = "Mount DF3"
  op = "window.mount"
  bind = [ { arg = "path", file = true }, { arg = "slot", int = 3 } ]

[[filetype]]
ext = ".hdf"
  [[filetype.action]]
  label = "Mount HD0"
  op = "sectors.mount"
  bind = [ { arg = "path", file = true }, { arg = "unit", int = 0 } ]
  [[filetype.action]]
  label = "Mount HD1"
  op = "sectors.mount"
  bind = [ { arg = "path", file = true }, { arg = "unit", int = 1 } ]

