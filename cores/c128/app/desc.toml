# The C128's description record (T257 D6; tools/descrec.py, record version 6): data the generic core application reads from the .cor, no per-core code.
# What it holds: the registers the bug report (F8 -> Bug report, GET /v1/report) lists. The VDC's own registers R0-R37 are read through the core's register
# page E (coreapp/cores/c128_regs.h C128_PAGE 0xE000): offset 0x100 + n is Rn, 0x126 the status, 0x127 the selected register. A read of any of them changes
# nothing in the VDC (T257 D5).

[[report_reg]]
name = "VDC R0 horizontal total"
reg = 0xE100

[[report_reg]]
name = "VDC R1 horizontal displayed"
reg = 0xE101

[[report_reg]]
