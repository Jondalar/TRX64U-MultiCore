# TOML B of the C128's app (T239.3 D55, T239.5 D16): what its own app is linked from. The app is built from the SDK package alone (tools/sdk_core_app.sh, ci/trxapps.sh); nothing else is in
# its link: the base's archives, the sources the base compiles for the core, the libraries named below and the blocks its TOML A names (tools/libtab.py mapcheck proves it on the link map). The
# base's own tools read the same file: tools/app_build.py (the link), tools/libtab.py (the library table), tools/cor_pack.py --sizes (the heap figures) and tools/core_toml.py (the switch desc_record).
[app]
name = "c128"
# D25: the packers put desc.toml into the .cor as record 6 and the app takes the core's data from it (coreapp/src/bundle.cc)
desc_record = true
# the symbol of the core's descriptor (the library c128 below defines it); the core table of this app holds this core only
desc = "c128_desc"
# TOML A: the core's own (gateware.toml, checked against the RTL by tools/rtl_check.py) and the blocks of the host's TOML A that the shared drivers (hw.cc) name: the host's mode register
# (cart_regs), the five ICAP blocks of the loader, the partition block, the host's master volume and tone (audio_master) and the IEC block (iec_status: the board's IEC probe reads its version byte).
# The drive window is the core's own block drive_a (gateware.toml: the registers of its mm_drive, a 1541 or a 1581).
toml_a = "gateware.toml"
base_toml_a = "host.toml"
base_blocks = ["cart_regs", "icap_id", "icap_data", "icap_enable", "icap_count", "partition", "audio_master", "iec_status"]

# The core's own code: its descriptor and hooks (init, release, the ROM image and the character store, the operations of the PRG start and of the drive's ROM choice, the USB keyboard's extra keys, the register map),
# with its own copies of hk_defaults.h and drive_rom_pick.h (the originals stay for the cores that have not moved, T239.5 D16). Its files are in cores/c128/app/lib.
# T239.5 D4: the tests of the library, by the step of the matrix (units of tests/coreapp/run.sh, built as this app: c128app): unit = 2 unit tests, service = 8 mock bitstream -> service, ui = 9 service -> UI,
# api = 10 service -> API (the C128's cases of the shared tests, TEST_APP_C128). Its step 10 is c128_uicover (its declaration over the API); the shared memops never had a C128 row.
[[library]]
name = "c128"
sources = ["c128.cc"]
headers = ["c128_keys.h", "c128_prg.h", "c128_regs.h", "hk_defaults.h", "drive_rom_pick.h"]
needs = ["cbm1541", "cbmprg", "cbmrun", "newfile"]
tests = { unit = ["c128"], service = ["c128_descgen", "c128_mounts", "c128_romreq"], ui = ["c128pic", "c128_desc", "c128_hotkeys", "c128_ledcores", "c128_joyswap", "c128_keywalk"], api = ["c128_uicover"] }

[[library]]
name = "cbm1541"
sources = ["cbm1541.cc", "d1541_drive.cc", "d1541_gcr.cc", "d1541_wd.cc", "cbm1541_exports.cc"]
headers = ["cbm1541.h", "cbm1541_desc.h", "cbm1541_api.h", "d1541_drive.h", "d1541_gcr.h", "d1541_wd.h"]
bind = "cbm1541_bind"
exports = [{ name = "cbm1541", major = 1, table = "cbm1541_table" }]
register_ops = "cbm1541_register"
capability = "drive_a"
needs = ["newfile"]

[[library]]
name = "cbmprg"
sources = ["cbm_prg.cc", "cbmprg_exports.cc"]
headers = ["cbm_prg.h", "cbmprg_api.h"]
bind = "cbmprg_bind"
exports = [{ name = "cbmprg", major = 1, table = "cbmprg_table" }]

[[library]]
name = "cbmrun"
sources = ["cbm_run.cc", "c64_go.cc"]
headers = ["cbm_run.h", "c64_go.h"]
needs = ["cbmprg"]

[[library]]
name = "newfile"
sources = ["newfile.cc"]
headers = ["newfile.h"]

# Unzip (apps/unzip: the actions on a .zip in the File Browser) takes the zip library through its needs entry `miniz>=1.0`. Base 4.0 loads no library file (T239.3 D58), so this app
# links it as the shared app does (coreapp/libs/shared.toml, the same sources and entries); without it the app refuses unzip's need.
[[library]]
name = "miniz"
sources = ["miniz_lib.cc", "miniz.c", "miniz_tinfl.c", "miniz_zip.c"]
headers = ["zip_lib.h"]
exports = [{ name = "miniz", major = 1, table = "miniz_table" }]
