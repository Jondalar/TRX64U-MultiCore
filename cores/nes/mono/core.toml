# The NES core (T95): MiSTer-devel/NES_MiSTer (GPL v3, D12) in cores/nes/rtl, built from cores/nes/gen (tools/nes_gen.py), our glue in trx/
# (cartridge in the DDR2 behind line caches, frame writer, window, registers, the pad on the C64 joystick and keyboard), ten mapper
# modules. GPL v3 (cores/nes/rtl/NOTICE).
id           = "nes"
name         = "Nintendo Entertainment System"
version      = "0.0.1"
contract     = 2
app          = "blueprint"     # the generic core application; the NES's record is nes_desc: its own app cores/nes/app (T239.5 D15), not Gideon's application
order        = 8               # after the Atari 800 XL (4), C16 (7); core order of docs/todo/T79.md
delivery     = "cfw"           # a LARGE core since 2026-11-01 (T164 Q1 "Second cut": pb_l2 shrank to 13,200 LUT, the NES is 13,181 LUT and no longer fits; Alex 2026-10-27:
                               # "VC20 usw - was nicht mehr DFX sein kann wird large Core. Einfach bauen.", translated: "VC20 etc. - whatever can no longer be DFX becomes a
                               # large core. Just build."): this file is the only descriptor, no DFX lane; cores/nes/mono/build_mono.tcl, lane large-nes
experimental = true            # routed as a DFX core (T95 5.17), application built (T93), pad on the C64 joystick and keyboard (5.18); the flat build has not run yet
mono_env     = ["TRX_FEATURES=jtag", "TRX_DEFS=NO_NET NO_C64VIDEO"]   # host features as the DFX build's (jtag on, UCI and UDP streams off); T164: no Ethernet, no VIC path, no C64 text
sources      = ["cores/nes", ":(exclude)cores/nes/sim", ":(exclude)cores/nes/rtl"]
                               # rtl/ is the pristine upstream copy; what is built is gen/ (tracked), which tools/nes_gen.py makes
                               # from it and ci/lint.sh checks against it. So a bench edit and the copy itself stay out of the key.
