# TOML A of the Atari 800 XL core (T239.3 D55, T239.5 D15): the gateware's registers as capabilities, written from what cores/atari800/trx/a8_regs.vhd decodes (tools/rtl_check.py proves it
# against the RTL, code to code: tools/rtl_check.py check, command in app/sdkpkg/api.md 6.14.19; the first draft came from tools/rtl_check.py emit). The addresses are the host's: its decode
# hands 0x101A0000-0x101AFFFF to the core's cw_* ports (host/ultimate_sys.vhd, region r_cw), the register offset of the core's own app is the address minus 0x101A0000 (the block "ident"
# sits at the start of the window). Page 6 (0x101A6000-0x101A6FFF) is decoded by a8_regs and forwarded to the host's pixel layer (px_we, px_re, px_rdata); it is the host's block and stays
# outside this file. The core has no 1541, no IEC and no WD177x: its drives are SIO drives of the app (the block sio is the handler's indirect register port, not a drive window).
# desc.toml names a register of this file as "block.property" (tools/descrec.py, api.md 6.14.20), so the number stands once.
[io]
iobase = 0x10000000
u2p_io_base = 0x10100000

[identity]
id = "A8XL"
block = "ident"

# 000-00B: the ID "A8XL" (byte 0 first; a build with ID_TRX2 = 1 answers "TRX2", layer2_atari800.v sets 0), the caps bytes and the build word (USR_ACCESS)
[[block]]
name = "ident"
module = "a8_regs"
owner = "base"
address = 0x101A0000
size = 0x0C
  [[block.property]]
  name = "id"
  offset = 0x00
  width = 32
  dir = "r"
  [[block.property]]
  name = "caps"
  offset = 0x04
  width = 8
  dir = "r"
  [[block.property]]
  name = "caps2"
  offset = 0x05
  width = 8
  dir = "r"
  [[block.property]]
  name = "build"
  offset = 0x08
  width = 32
  dir = "r"

# 010 IRQ_EN, 014 IRQ_CAUSE (write 1 clears): b5 an Atari frame is complete, b6 the host's video frame start, b7 page flip done
[[block]]
name = "irq"
module = "a8_regs"
owner = "base"
address = 0x101A0010
size = 0x08
  [[block.property]]
  name = "irq_en"
  offset = 0x00
  width = 8
  dir = "rw"
  [[block.property]]
  name = "irq_cause"
  offset = 0x04
  width = 8
  dir = "rw"
    [[block.property.field]]
    name = "frame_done"
    shift = 5
    bits = 1
    [[block.property.field]]
    name = "vsync"
    shift = 6
    bits = 1
    [[block.property.field]]
    name = "flip"
    shift = 7
    bits = 1

# 020-027: the host's DDR2 calibration
[[block]]
name = "ddr_cal"
module = "a8_regs"
owner = "base"
address = 0x101A0020
size = 0x08
  [[block.property]]
  name = "ddr_cal0"
  offset = 0x00
  width = 32
  dir = "r"
  [[block.property]]
  name = "ddr_cal1"
  offset = 0x04
  width = 32
  dir = "r"

# 0A0-0B1: the machine. ctrl b0 reset hold (cold reset), b1 halt (Freeze), b2 keep the RAM through a reset, b3 flush the cache; ram_sel b2:0 RAM_SELECT (taken at the next reset); flags b0 swap the joystick
# ports, b1 PAL (taken at the next reset), b2 XEX loader mode; cart1/cart2 the emulated (stacked) cartridge type, 0 = none; throttle b5:0 THROTTLE_COUNT_6502 (1 = the machine's speed);
# rom_sel b1:0 the array behind the host's ROM aperture: 0 XL OS, 1 BASIC, 2 PBI/XEX loader ROM; status b0 in reset, b1 held (Freeze), b2 PAL, b3 a memory access is on its way to the DDR2;
# cpuaddr the bus address of the machine (a sample)
[[block]]
name = "machine"
module = "a8_regs"
owner = "core"
address = 0x101A00A0
size = 0x12
  [[block.property]]
  name = "ctrl"
  offset = 0x00
  width = 8
  dir = "rw"
    [[block.property.field]]
    name = "reset_hold"
    shift = 0
    bits = 1
    [[block.property.field]]
    name = "halt"
    shift = 1
    bits = 1
    [[block.property.field]]
    name = "keep_ram"
    shift = 2
    bits = 1
    [[block.property.field]]
    name = "flush_cache"
    shift = 3
    bits = 1
  [[block.property]]
  name = "ram_sel"
  offset = 0x01
  width = 8
  dir = "rw"
  [[block.property]]
  name = "flags"
  offset = 0x02
  width = 8
  dir = "rw"
    [[block.property.field]]
    name = "swap_joy"
    shift = 0
    bits = 1
    [[block.property.field]]
    name = "pal"
    shift = 1
    bits = 1
    [[block.property.field]]
    name = "xex_loader"
    shift = 2
    bits = 1
  [[block.property]]
  name = "cart1"
  offset = 0x03
  width = 8
  dir = "rw"
  [[block.property]]
  name = "cart2"
  offset = 0x04
  width = 8
  dir = "rw"
  [[block.property]]
  name = "throttle"
  offset = 0x05
  width = 8
  dir = "rw"
  [[block.property]]
  name = "rom_sel"
  offset = 0x06
  width = 8
  dir = "rw"
  [[block.property]]
  name = "status"
  offset = 0x08
  width = 8
  dir = "r"
    [[block.property.field]]
    name = "in_reset"
    shift = 0
    bits = 1
    [[block.property.field]]
    name = "held"
    shift = 1
    bits = 1
    [[block.property.field]]
    name = "pal"
    shift = 2
    bits = 1
    [[block.property.field]]
    name = "mem_busy"
    shift = 3
    bits = 1
  [[block.property]]
  name = "frames"
  offset = 0x0C
  width = 16
  dir = "r"
  [[block.property]]
  name = "cpuaddr"
  offset = 0x10
  width = 16
  dir = "r"

# 0C0-0CB: the picture's frame buffers. fb_base and fb_stride have the reset values of base_r and stride_r in a8_regs.vhd (the DDR2 window at 0x01000000 + 0xD00000, four buffers 1 MB apart)
[[block]]
name = "video"
module = "a8_regs"
owner = "core"
address = 0x101A00C0
size = 0x0C
  [[block.property]]
  name = "fb_latest"
  offset = 0x00
  width = 8
  dir = "r"
  [[block.property]]
  name = "frame_seq"
  offset = 0x01
  width = 8
  dir = "r"
  [[block.property]]
  name = "fb_overruns"
  offset = 0x02
  width = 16
  dir = "r"
  [[block.property]]
  name = "fb_base"
  offset = 0x04
  width = 32
  dir = "rw"
    [[block.property.state]]
    name = "reset"
    value = 0x01D00000
  [[block.property]]
  name = "fb_stride"
  offset = 0x08
  width = 32
  dir = "rw"
    [[block.property.state]]
    name = "reset"
    value = 0x00100000

# 0D0-0D5: the port of the SIO handler (sio_handler.vhdl): addr b4:0 selects its register (0 transmit, 1 tx status, 2 receive, 3 rx status, 4 divisor, 5 errors), go b0 reads it, b1 writes wdata into it;
# the result is in rdata when status b0 is 0 (the operation needs machine ticks: it does not finish while the machine is held)
[[block]]
name = "sio"
module = "a8_regs"
owner = "core"
address = 0x101A00D0
size = 0x06
  [[block.property]]
  name = "addr"
  offset = 0x00
  width = 8
  dir = "rw"
  [[block.property]]
  name = "wdata"
  offset = 0x01
  width = 8
  dir = "rw"
  [[block.property]]
  name = "go"
  offset = 0x02
  width = 8
  dir = "w"
  [[block.property]]
  name = "status"
  offset = 0x03
  width = 8
  dir = "r"
  [[block.property]]
  name = "rdata"
  offset = 0x04
  width = 16
  dir = "r"

# 0E0-0E3: the signed paddle positions 0 to 3 (default 0x80), the app's stand-in for the C64U paddle path
[[block]]
name = "paddle"
module = "a8_regs"
owner = "core"
address = 0x101A00E0
size = 0x04
  [[block.property]]
  name = "pos"
  offset = 0x00
  width = 8
  count = 4
  dir = "rw"

# 0F0-0FF: the DDR2 cache counters (32 bit each)
[[block]]
name = "cache"
module = "a8_regs"
owner = "core"
address = 0x101A00F0
size = 0x10
  [[block.property]]
  name = "hits"
  offset = 0x00
  width = 32
  dir = "r"
  [[block.property]]
  name = "misses"
  offset = 0x04
  width = 32
  dir = "r"
  [[block.property]]
  name = "writes"
  offset = 0x08
  width = 32
  dir = "r"
  [[block.property]]
  name = "stalls"
  offset = 0x0C
  width = 32
  dir = "r"
