# TOML B of the Atari 800 XL's app (T239.3 D55, T239.5 D15): what its own app is linked from. The app is built from the SDK package alone (tools/sdk_core_app.sh, ci/trxapps.sh); nothing else is in its
# link: the base's archives, the sources the base compiles for the core, the libraries named below and the blocks its TOML A names (tools/libtab.py mapcheck proves it on the link map). The base's own
# tools read the same file: tools/app_build.py (the link), tools/libtab.py (the library table), tools/cor_pack.py --sizes (the heap figures) and tools/core_toml.py (the switch desc_record).
[app]
name = "atari800"
# D25: the packers put desc.toml into the .cor as record 6 and the app takes the core's data from it (coreapp/src/bundle.cc)
desc_record = true
# the symbol of the core's descriptor (the library atari800 below defines it); the core table of this app holds this core only
desc = "atari800_desc"
# TOML A: the core's own (gateware.toml, checked against the RTL by tools/rtl_check.py) and the blocks of the host's TOML A (gateware/host.toml: the Atari 800 XL runs on the host bitstream) that the
# shared drivers (hw.cc) name: the host's mode register (cart_regs), the five ICAP blocks of the loader (a partial core: it can return to the host) and audio_master (the host's master volume and tone:
# the rows Volume and Tone, T239.3 D36). The core has no 1541 and no IEC bus (its drives are SIO drives of the library), so no block of the drive window or of iec_status is named, and no block of the cartridge
# page (c64cart), the ring (c64_debug), the DMA window (dma) or cmd_if, so board.cc runs no cartridge, ring, REU or command interface probe in this app.
toml_a = "gateware.toml"
base_toml_a = "host.toml"
base_blocks = ["cart_regs", "icap_id", "icap_data", "icap_enable", "icap_count", "partition", "audio_master"]
# coreapp/cores of the base that this app links: run.cc starts the diag core's runner (portdiag_attach) in every app
base_sources = ["portdiag.cc"]

# The core's own code: its descriptor and hooks (init, release, warm reset, the operations of register_ops, the SIO media write-back, the mount slots) and its formats (ATR/XFD disks on the SIO bus, XEX
# executables with the boot stub, cartridge images). Its files are in cores/atari800/app/lib; hk_defaults.h is a copy of the shared app's (the other cores still use the original).
[[library]]
name = "atari800"
sources = ["atari800.cc", "atari_atr.cc", "atari_cart.cc", "atari_media.cc", "atari_sio.cc", "atari_xex.cc"]
headers = ["atari800_regs.h", "atari_atr.h", "atari_cart.h", "atari_disk.h", "atari_media.h", "atari_sio.h", "atari_xex.h", "hk_defaults.h"]
# newdisk: atari800.cc calls newdisk_register (the task Create blank ATR)
needs = ["newfile", "newdisk"]
# T239.5 D4: the tests of the library, by the step of the matrix (units of tests/coreapp/run.sh, built as this app: a8app, the group atari800): unit = 2 unit tests (a8_xex the XEX loader, a8_sio the SIO
# bus against its handler model, a8_fs64 the ATR reader on a file of 4 GiB and more), service = 8 mock bitstream -> service (a8_media the media engine and the SIO write-back, a8_boot the core's start,
# the settings file, the video service, the library loader, the board profile, the media mounts, Create blank ATR, the pad service), ui = 9 service -> UI (a8_menuctl the menu on the core's record and the
# menu's cases that stood on its descriptor, a8_keywalk every key of its menu against its own goldens), api = 10 service -> API: its operations through the service call the REST and RPC transports make (svc_call; the Atari's cases of the shared test_memops; a8_uicover every row, value and operation of its declaration over the API).
# T239.5 D13: the Atari's cases of the shared tests run as these units, TEST_APP_ATARI800; the shared units no longer name it.
tests = { unit = ["a8_xex", "a8_sio", "a8_fs64"], service = ["a8_media", "a8_boot", "a8_descgen", "a8_romreq", "a8_settings", "a8_video", "a8_libscan", "a8_board", "a8_mounts", "a8_newdisk", "a8_pad", "a8_xinput"], ui = ["a8_menuctl", "a8_desc", "a8_joyswap", "a8_ledcores", "a8_hotkeys", "a8_baseset", "a8_f3", "a8_library_n", "a8_picture", "a8_pictfollow", "a8_scale", "a8_writeback_menu", "a8_prompt", "a8_createflow", "a8_cut", "a8_keywalk"], api = ["a8_memops", "a8_uicover"] }

# The shared rule of a new file's folder and name (T122 D2): newdisk makes the blank ATR's path with it. The same sources as the shared app's library, S12
[[library]]
name = "newfile"
sources = ["newfile.cc"]
headers = ["newfile.h"]

# "Create blank ATR" (the task of the descriptor, disk.create): the same sources as the shared app's library. The capability "sio" of the descriptor registers it too.
[[library]]
name = "newdisk"
sources = ["newdisk.cc"]
headers = ["newdisk.h"]
register_ops = "newdisk_register"
capability = ["floppy", "sio"]
needs = ["newfile"]

# Unzip (apps/unzip: the actions on a .zip in the File Browser) takes the zip library through its needs entry `miniz>=1.0`. Base 4.0 loads no library file (T239.3 D58), so this app
# links it as the shared app does (coreapp/libs/shared.toml, the same sources and entries); without it the app refuses unzip's need.
[[library]]
name = "miniz"
sources = ["miniz_lib.cc", "miniz.c", "miniz_tinfl.c", "miniz_zip.c"]
headers = ["zip_lib.h"]
exports = [{ name = "miniz", major = 1, table = "miniz_table" }]
