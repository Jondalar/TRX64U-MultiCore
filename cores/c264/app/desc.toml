# The Commodore 264's data description (T239.3 D17): what cores/c264/app/lib/c264.cc holds as tables and strings, as TOML. tools/descrec.py compiles it into the
# description record (record 6 of the .cor, section layout in coreapp/src/descrec.h); the generic application builds the descriptor from it. What the record
# cannot hold is code, and stays in the core's C++: init, release, the operations of register_ops, the media write-back and the three functions of the
# mount slots.
# The gateware's facts are in the core's TOML A, gateware.toml (cores/c264/rtl/trx/c264_regs.v checked by tools/rtl_check.py): a register is written as the name of its property, "block.property", a reset
# value as "block.property.state"; tools/descrec.py makes the numbers of them (api.md 6.14.20).
toml_a = "gateware.toml"
machine_info = "Model,RAM"

[restart]
clear_ram = 65536

[core]
id = "C264"
name = "Commodore 264 (C16, Plus/4)"
title = "Commodore 264"
short_title = "C264"
folder = "c16"
store = "C16 Settings"
min_contract = 1
reset_ms = 20
service_op = "c264.service"            # a PRG waits for READY while the machine runs, not while the menu holds it; the drive's poll rides on it
service_period_ms = 20
type_op = "c264.type_script"
run_op = "c264.run_prg"
caps = ["iec", "drive_a"]              # the 264 carries the 1541 (drive_l2) on the serial bus

# 384 x 288 shown 3 x 3 (1152 x 864, 4:3), centred on 1920 x 1080; the buffers are the core's reset values of FB_BASE / FB_STRIDE
[video]
w = 384
h = 288
scale = 3
x0 = 384
y0 = 108
fb_base = "c264_video.fb_base.reset"
fb_stride = "c264_video.fb_stride.reset"
nbuf = 4
reg_latest = "c264_video.fb_latest"
reg_seq = "c264_video.frame_seq"
reg_fb_base = "c264_video.fb_base"
reg_fb_stride = "c264_video.fb_stride"

[freeze]
reg_status = "c264_machine.status"
mask = 0x02
timeout_ms = 200

# ---- ROMs: the names the old application tried (the VICE names and the Commodore part numbers); PAL images only. The two function ROMs are the Plus/4's 3-plus-1
[[rom]]
role = "KERNAL"
names = ["kernal.bin", "kernal", "kernal-318004-05.bin", "kernal.318004-05.bin", "318004-05.bin"]
sizes = [16384]
required = true
put_op = "c264.put_kernal"

[[rom]]
role = "BASIC"
names = ["basic.bin", "basic", "basic-318006-01.bin", "basic.318006-01.bin", "318006-01.bin"]
sizes = [16384]
required = true
put_op = "c264.put_basic"

[[rom]]
role = "Function ROM low (Plus/4)"
names = ["3plus1lo.bin", "3plus1-317053-01.bin", "3-plus-1.317053-01.bin", "func-lo.bin", "317053-01.bin"]
sizes = [16384]
put_op = "c264.put_func_lo"

[[rom]]
role = "Function ROM high (Plus/4)"
names = ["3plus1hi.bin", "3plus1-317054-01.bin", "3-plus-1.317054-01.bin", "func-hi.bin", "317054-01.bin"]
sizes = [16384]
put_op = "c264.put_func_hi"

# a shared device ROM (the C64 side keeps it in <root>/roms too): the core's folder first, then <root>/roms
[[rom]]
role = "1541 drive"
names = ["1541.rom", "1541.bin", "1541-ii.bin", "1541-ii.rom", "1541ii.rom", "1541c.rom", "dos1541.rom", "dos1541-325302-01+901229-05.bin"]
sizes = [16384, 32768]
shared = true
put_op = "drive.put_rom"

# ---- settings. Model, RAM size and the joystick swap are register bits taken at the core's next reset
[[core_setting]]
key = "Model (at next reset)"
label = "Model"
values = ["C16 / C116", "Plus/4"]
default = 1
when = "reset"
reg_bind = { reg = "c264_machine.model", mask = 0x01 }

[[core_setting]]
key = "RAM (at next reset)"
label = "RAM"
values = ["16 KB (C16, C116)", "64 KB"]
default = 1
when = "reset"
reg_bind = { reg = "c264_machine.ram_size", mask = 0x01 }

[[core_setting]]
key = "Joystick ports (at next reset)"
label = "Joystick ports"
values = ["Joystick 1 = port 1", "Swapped"]
when = "reset"
reg_bind = { reg = "c264_machine.joy_swap", mask = 0x01 }

# T214: an external datasette on the C2N port (GitHub #26): TAPE_PIN b0 MOTOR driven, b4 READ / SENSE are the machine's inputs. b1 WRITE stays 0: on the TED
# machines the cassette WRITE shares the 7501's P1 with the serial CLK out, so IEC traffic would reach the pin. Off releases every pin.
[[core_setting]]
key = "Datasette port"
values = ["Off (file only)", "External datasette"]
reg_bind = { reg = "c264_media.tape_pin", mask = 0x11, bytes = [0x00, 0x11] }

# drive A (cbm1541_desc.h CBM1541_SETTINGS): the names and the defaults are Gideon's (c1541.cc:46-62): drive on, bus ID 8, no extra RAM, 100 ms swap delay
[[core_setting]]
key = "Drive"
values = ["Disabled", "Enabled"]
default = 1
apply = "drive.set_power"

[[core_setting]]
key = "Drive Bus ID"
values = ["8", "9", "10", "11"]
apply = "drive.set_bus_id"

[[core_setting]]
key = "Extra RAM"
values = ["Disabled", "Enabled"]
apply = "drive.set_ram"

[[core_setting]]
key = "Disk swap delay"
values = ["100 ms", "200 ms", "300 ms", "400 ms", "500 ms", "600 ms", "700 ms", "800 ms", "900 ms", "1000 ms"]
apply = "drive.set_swap_delay"

[[core_setting]]
key = "LED Load Indicator"
values = ["On", "Off"]
apply = "led.load"

# ---- tasks
[[task]]
label = "Reset"
op = "machine.cold_reset"
closes_menu = true

[[task]]
label = "Reload ROMs, reset"
op = "machine.reload_roms"
closes_menu = true

[[task]]
label = "Eject cartridge and reset"
op = "c264.cart_eject"
closes_menu = true

[[task]]
label = "Reset Drive"
op = "drive.reset"
bind = [ { arg = "slot", str = "iec:drive_a" } ]

[[task]]
label = "Create blank D64"
op = "drive.create"
bind = [ { arg = "path", text = true }, { arg = "format", str = "d64" }, { arg = "name", str = "" } ]
ask = "Name of the new D64"
ask_state = "drive.suggest.d64"
pick_dir = true

[[task]]
label = "Create blank G64"
op = "drive.create"
bind = [ { arg = "path", text = true }, { arg = "format", str = "g64" }, { arg = "name", str = "" } ]
ask = "Name of the new G64"
ask_state = "drive.suggest.g64"
pick_dir = true

[[task]]
label = "Save Disk as D64"
op = "drive.save"
bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", text = true }, { arg = "format", str = "d64" } ]
ask = "Save as D64, name"
ask_state = "drive.suggest.save_d64"

[[task]]
label = "Save Disk as G64"
op = "drive.save"
bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", text = true }, { arg = "format", str = "g64" } ]
ask = "Save as G64, name"
ask_state = "drive.suggest.save_g64"

# ---- media slots
[[media]]
name = "Program"
state = "c264.program"

# a 16 or 32 KB .bin: it only runs in the Plus/4 model, so loading one sets that model and resets
[[media]]
name = "Cartridge"
state = "c264.cartridge"
exts = ".bin"
mount = "Load as cartridge (Plus/4)"
mounted_tasks = "Eject cartridge and reset"

[[media]]
name = "Drive A:"
state = "drive.drive_a.image"
eject_op = "drive.eject"
eject_bind = [ { arg = "slot", str = "iec:drive_a" } ]
exts = ".d64,.g64"
mount = "Mount Disk"
empty_tasks = "Create blank D64,Create blank G64"
mounted_tasks = "Save Disk as D64,Save Disk as G64,Reset Drive"

# ---- file types
[[filetype]]
ext = ".prg"
  [[filetype.action]]
  label = "Run PRG"
  op = "c264.run_prg"
  bind = [ { arg = "path", file = true } ]
  closes_menu = true
  [[filetype.action]]
  label = "Load PRG (no reset, no start)"
  op = "c264.load_prg"
  bind = [ { arg = "path", file = true } ]

[[filetype]]
ext = ".p00"
  [[filetype.action]]
  label = "Run PRG"
  op = "c264.run_prg"
  bind = [ { arg = "path", file = true } ]
  closes_menu = true
  [[filetype.action]]
  label = "Load PRG (no reset, no start)"
  op = "c264.load_prg"
  bind = [ { arg = "path", file = true } ]

[[filetype]]
ext = ".bin"
  [[filetype.action]]
  label = "Load as cartridge (Plus/4)"
  op = "c264.cart_load"
  bind = [ { arg = "path", file = true } ]
  closes_menu = true

# a disk image is a folder for the browser: `inner` are the actions of the PRGs inside it
[[filetype]]
ext = ".d64"
inner_ext = ".prg"
  [[filetype.action]]
  label = "Mount Disk"
  op = "drive.mount"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "mode", str = "rw" } ]
  closes_menu = true
  [[filetype.action]]
  label = "Mount Disk Read Only"
  op = "drive.mount"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "mode", str = "ro" } ]
  closes_menu = true
  [[filetype.action]]
  label = "Mount Disk Unlinked"
  op = "drive.mount"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "mode", str = "unlinked" } ]
  closes_menu = true
  [[filetype.action]]
  label = "Run Disk"
  op = "drive.mount_run"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true } ]
  closes_menu = true
  [[filetype.action]]
  label = "Browse Disk"
  op = "menu.browse"
  bind = [ { arg = "path", file = true } ]
  [[filetype.inner]]
  label = "Mount & Run"
  op = "drive.mount_run_file"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "how", str = "dma" } ]
  closes_menu = true
  [[filetype.inner]]
  label = "Real Run"
  op = "drive.mount_run_file"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "how", str = "load" } ]
  closes_menu = true

[[filetype]]
ext = ".g64"
  [[filetype.action]]
  label = "Mount Disk"
  op = "drive.mount"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "mode", str = "rw" } ]
  closes_menu = true
  [[filetype.action]]
  label = "Mount Disk Read Only"
  op = "drive.mount"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "mode", str = "ro" } ]
  closes_menu = true
  [[filetype.action]]
  label = "Mount Disk Unlinked"
  op = "drive.mount"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "mode", str = "unlinked" } ]
  closes_menu = true
  [[filetype.action]]
  label = "Run Disk"
  op = "drive.mount_run"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true } ]
  closes_menu = true

# a ROM file picked in the browser: the drive takes it for this session (the operation checks 16 or 32 KB)
[[filetype]]
ext = ".rom"
  [[filetype.action]]
  label = "Set as 1541 ROM"
  op = "drive.set_rom"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true } ]

# ---- hotkeys (hk_defaults.h hk_c264, the copy in cores/c264/app/lib): CTRL + RESTORE menu, + R reset, + "+" / "-" volume, + J swap joystick ports, + P picture mode. Keys as hotkeys.h: 0-63 = col * 8 + row, 64 = RESTORE, 255 = none
[hotkeys]
mod = [58, 255]
actions = [64, 40, 43, 17, 34, 41, 255]
swap_key = "Joystick ports (at next reset)"             # the swap is a reset-time item on this machine
own_keys = [56, 59, 8, 11, 16, 19, 24, 27, 32, 35]      # the digit keys: CTRL + 1..8 are the colours and CTRL + 9 / 0 reverse on / off

# the slots of the core's own media engine; their three functions (spec, mount, eject) are code
[mount]
names = ["Drive A", "Cartridge"]
