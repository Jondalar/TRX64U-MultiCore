# The C64 with SuperCPU core of TRX64U-MultiCore as the core application sees it (the layout of c128.toml). Read by the emulator tests (T217 emulator pictures) and by step 12 of the matrix (tools/ue2emu_core.py profile, T239.5).
name = "c64scpu"
id = "SCPU"
board = "multicore"

[regs]
0x0A0 = 0x01                 # CTRL: b0 HOLD
0xE050 = 0x00                # SCPU_ROM_BASE 0x01C00000 (little endian)
0xE051 = 0x00
0xE052 = 0xC0
0xE053 = 0x01
0xE054 = 0x00                # SCPU_SROM_BASE 0x03080000
0xE055 = 0x00
0xE056 = 0x08
0xE057 = 0x03
0xE05C = 0x00                # SCPU_ROM_VALID, set by the app once the SuperCPU ROM is in

[ro]
0xE040 = 0x00                # SCPU_ROM_CTRL: the cache flush reads done
0xE080 = 0x00                # SCPU_COLD: the cold start reads done

[handover]
core = "C64 with SuperCPU"
id = "c64scpu"
path = "/Usb0/cores/c64scpu.cor"
video = "1080p"

[round]
ends = "rompage"             # the app waits on its ROM page: scpu_rom_fault (c64scpu.cc) refuses a reset vector below $8000, which the zero-filled stand-in has (step 12 ends there, tests/coreapp/emu/core_round.sh)
