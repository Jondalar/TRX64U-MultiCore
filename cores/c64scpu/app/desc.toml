# The C64 with SuperCPU's data description (T239.3 D17): what coreapp/cores/c64scpu.cc holds as tables and strings, as TOML. tools/descrec.py compiles it into the
# description record (record 6 of the .cor); the generic application builds the descriptor from it. What the record cannot hold is code, and stays in the core's
# C++: init, release, cold_start, the operations of register_ops and the drive's media functions. Register numbers are the page 0xE000 of
# coreapp/cores/c64scpu_regs.h (SCPU_REG(off) = 0xE000 + off).
machine_info = "SuperCPU speed"

[restart]
clear_ram = 65536                      # the RAM block the RAM window reaches (SRAM and SuperRAM are not cleared by the restart)

[core]
id = "SCPU"
name = "C64 with SuperCPU"
title = "C64 with SuperCPU"
short_title = "SCPU"
folder = "c64scpu"
store = "C64SCPU Settings"
min_contract = 1
reset_ms = 50
service_op = "c64scpu.service"
service_period_ms = 20
type_op = "c64scpu.type_script"        # Run Disk: reset, type LOAD"*",8,1 and RUN at READY
run_op = "c64scpu.run_prg"             # Mount & Run of a file inside a disk image
caps = ["iec", "drive_a"]

# the picture goes through the host's scaler (the VIC-II): no buffers, no registers; scale 0 with every other number 0 says so, and the freeze below stands alone
[video]
w = 0
h = 0
scale = 0
x0 = 0
y0 = 0
fb_base = 0
fb_stride = 0
nbuf = 0
reg_latest = 0
reg_seq = 0
reg_fb_base = 0
reg_fb_stride = 0

[freeze]
reg_status = 0xE030
mask = 0x08
timeout_ms = 200

# CTRL + RESTORE menu, + R reset, + "+" / "-" volume, + J swap joystick ports, + P picture mode. Keys as hotkeys.h: 0-63 = col * 8 + row, 64 = RESTORE, 255 = none
[hotkeys]
mod = [58, 255]
actions = [64, 40, 43, 17, 34, 41, 255]
own_keys = [56, 59, 8, 11, 16, 19, 24, 27, 32, 35]          # the digit keys: CTRL + 1..8 are the colours and CTRL + 9 / 0 reverse on / off

# the slot of the core's own media engine (the drive library); its three functions are code
[mount]
names = ["Drive A"]

# ---- ROMs. Without the SuperCPU ROM the core is not released (the 65816 stays in reset); its content is checked by the core's code
[[rom]]
role = "SuperCPU ROM"
names = ["scpu64.rom", "scpu.rom", "supercpu.rom", "scpu64-v2.04.rom"]
sizes = [131072, 65536, 262144]
required = true
check = true
put_op = "c64scpu.put_srom"

[[rom]]
role = "BASIC"
names = ["basic-901226-01.bin", "basic.bin", "basic.901226-01", "basic.901226-01.bin", "basic.rom"]
sizes = [8192]
required = true
put_op = "c64scpu.put_basic"

[[rom]]
role = "KERNAL"
names = ["kernal-901227-03.bin", "kernal.bin", "kernal.901227-03", "kernal.901227-03.bin", "kernal.rom"]
sizes = [8192]
required = true
put_op = "c64scpu.put_kernal"

[[rom]]
role = "CHAR"
names = ["chargen-901225-01.bin", "chars.bin", "characters.901225-01", "characters.901225-01.bin", "chargen.bin", "chars.rom"]
sizes = [4096]
required = true
put_op = "c64scpu.put_char"

[[rom]]
role = "1541 drive"
names = ["1541.rom", "1541.bin", "1541-ii.bin", "1541-ii.rom", "1541ii.rom", "1541c.rom", "dos1541.rom", "dos1541-325302-01+901229-05.bin"]
sizes = [16384, 32768]
shared = true
put_op = "c64scpu.put_drive_rom"

[[rom]]
role = "JiffyDOS 1541 ROM"
names = ["jiffydos-1541.bin", "jiffydos1541.bin", "jiffydos_1541.bin", "jiffydos-1541-ii.bin", "jiffydos1541-ii.bin", "jiffydos.bin"]
sizes = [16384, 32768]
put_op = "c64scpu.put_jiffy_rom"

[[rom]]
role = "1581 drive"
names = ["1581.rom", "1581.bin", "dos1581.rom"]
sizes = [32768]
put_op = "c64scpu.put_drive_rom1581"

[[rom]]
role = "JiffyDOS 1581 ROM"
names = ["jiffydos-1581.bin", "jiffydos1581.bin", "jiffydos_1581.bin", "jiffydos-1581.rom"]
sizes = [32768]
put_op = "c64scpu.put_jiffy_rom1581"

# ---- settings
[[core_setting]]
key = "SuperCPU speed"
values = ["20 MHz", "1 MHz"]
apply = "c64scpu.set_speed"

[[core_setting]]
key = "JiffyDOS"
values = ["Off", "On"]
apply = "c64scpu.set_jiffy"

[[core_setting]]
key = "Joystick ports"
values = ["Normal", "Swapped"]
apply = "c64scpu.set_joy"

[[core_setting]]
key = "System Mode"
values = ["PAL", "NTSC", "PAL-60", "NTSC-50"]
apply = "c64scpu.set_sysmode"

# drive A (cbm1541_desc.h CBM1541_SETTINGS): the names and the defaults are Gideon's (c1541.cc:46-62): drive on, bus ID 8, no extra RAM, 100 ms swap delay
[[core_setting]]
key = "Drive"
values = ["Disabled", "Enabled"]
default = 1
apply = "drive.set_power"

[[core_setting]]
key = "Drive Bus ID"
values = ["8", "9", "10", "11"]
apply = "drive.set_bus_id"

[[core_setting]]
key = "Extra RAM"
values = ["Disabled", "Enabled"]
apply = "drive.set_ram"

[[core_setting]]
key = "Disk swap delay"
values = ["100 ms", "200 ms", "300 ms", "400 ms", "500 ms", "600 ms", "700 ms", "800 ms", "900 ms", "1000 ms"]
apply = "drive.set_swap_delay"

[[core_setting]]
key = "LED Load Indicator"
values = ["On", "Off"]
apply = "led.load"

# ---- tasks
[[task]]
label = "Reset"
op = "machine.cold_reset"
closes_menu = true

[[task]]
label = "Reload ROMs, reset"
op = "machine.reload_roms"
closes_menu = true

[[task]]
label = "Reset Drive"
op = "drive.reset"
bind = [ { arg = "slot", str = "iec:drive_a" } ]

[[task]]
label = "Create blank D64"
op = "drive.create"
bind = [ { arg = "path", text = true }, { arg = "format", str = "d64" }, { arg = "name", str = "" } ]
ask = "Name of the new D64"
ask_state = "drive.suggest.d64"
pick_dir = true

[[task]]
label = "Create blank G64"
op = "drive.create"
bind = [ { arg = "path", text = true }, { arg = "format", str = "g64" }, { arg = "name", str = "" } ]
ask = "Name of the new G64"
ask_state = "drive.suggest.g64"
pick_dir = true

[[task]]
label = "Save Disk as D64"
op = "drive.save"
bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", text = true }, { arg = "format", str = "d64" } ]
ask = "Save as D64, name"
ask_state = "drive.suggest.save_d64"

[[task]]
label = "Save Disk as G64"
op = "drive.save"
bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", text = true }, { arg = "format", str = "g64" } ]
ask = "Save as G64, name"
ask_state = "drive.suggest.save_g64"

[[task]]
label = "Create blank D81"
op = "drive.create"
bind = [ { arg = "path", text = true }, { arg = "format", str = "d81" }, { arg = "name", str = "" } ]
ask = "Name of the new D81"
ask_state = "drive.suggest.d81"
pick_dir = true

# ---- media slots
[[media]]
name = "Drive A:"
state = "drive.drive_a.image"
eject_op = "drive.eject"
eject_bind = [ { arg = "slot", str = "iec:drive_a" } ]
exts = ".d64,.g64,.d81"
mount = "Mount Disk"
empty_tasks = "Create blank D64,Create blank G64,Create blank D81"
mounted_tasks = "Save Disk as D64,Save Disk as G64,Reset Drive"

# ---- file types
# the 1541 ROM of a file picked in the browser goes through the JiffyDOS choice (c64scpu.set_drive_rom), not the library's own set_rom
[[filetype]]
ext = ".rom"
  [[filetype.action]]
  label = "Set as 1541 ROM"
  op = "c64scpu.set_drive_rom"
  bind = [ { arg = "path", file = true } ]

[[filetype]]
ext = ".prg"
  [[filetype.action]]
  label = "Load"
  op = "c64scpu.load_prg"
  bind = [ { arg = "path", file = true } ]
  [[filetype.action]]
  label = "Load + run"
  op = "c64scpu.run_prg"
  bind = [ { arg = "path", file = true } ]
  closes_menu = true

[[filetype]]
ext = ".p00"
  [[filetype.action]]
  label = "Load"
  op = "c64scpu.load_prg"
  bind = [ { arg = "path", file = true } ]
  [[filetype.action]]
  label = "Load + run"
  op = "c64scpu.run_prg"
  bind = [ { arg = "path", file = true } ]
  closes_menu = true

# a disk image is a folder for the browser: `inner` are the actions of the PRGs inside it
[[filetype]]
ext = ".d64"
inner_ext = ".prg"
  [[filetype.action]]
  label = "Mount Disk"
  op = "drive.mount"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "mode", str = "rw" } ]
  closes_menu = true
  [[filetype.action]]
  label = "Mount Disk Read Only"
  op = "drive.mount"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "mode", str = "ro" } ]
  closes_menu = true
  [[filetype.action]]
  label = "Mount Disk Unlinked"
  op = "drive.mount"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "mode", str = "unlinked" } ]
  closes_menu = true
  [[filetype.action]]
  label = "Run Disk"
  op = "drive.mount_run"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true } ]
  closes_menu = true
  [[filetype.action]]
  label = "Browse Disk"
  op = "menu.browse"
  bind = [ { arg = "path", file = true } ]
  [[filetype.inner]]
  label = "Mount & Run"
  op = "drive.mount_run_file"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "how", str = "dma" } ]
  closes_menu = true
  [[filetype.inner]]
  label = "Real Run"
  op = "drive.mount_run_file"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "how", str = "load" } ]
  closes_menu = true

[[filetype]]
ext = ".g64"
  [[filetype.action]]
  label = "Mount Disk"
  op = "drive.mount"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "mode", str = "rw" } ]
  closes_menu = true
  [[filetype.action]]
  label = "Mount Disk Read Only"
  op = "drive.mount"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "mode", str = "ro" } ]
  closes_menu = true
  [[filetype.action]]
  label = "Mount Disk Unlinked"
  op = "drive.mount"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true }, { arg = "mode", str = "unlinked" } ]
  closes_menu = true
  [[filetype.action]]
  label = "Run Disk"
  op = "drive.mount_run"
  bind = [ { arg = "slot", str = "iec:drive_a" }, { arg = "path", file = true } ]
  closes_menu = true

# the 1581: .d81 mounts read-write or read only, no unlinked mount
[[filetype]]
ext = ".d81"
