# The VIC-20 core of TRX64U-MultiCore as the core application sees it (the layout of amiga1200.toml): the T205 emulator pictures and step 12 of the matrix.
name = "vc20"
id = "VC20"
board = "multicore"

[regs]
0x0A0 = 0x01                 # CTRL: b0 HOLD
0x0C6 = 0xD0                 # VC20_FB_BASE 0x01D00000 (its reset value)
0x0C7 = 0x01
0x0CA = 0x10                 # VC20_FB_STRIDE 0x00100000

[handover]
core = "VIC-20"
id = "vc20"
path = "/Usb0/cores/vc20.cor"
video = "1080p"
