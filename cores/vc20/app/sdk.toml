# TOML B of the VIC-20's app (T239.3 D28 point 3, D31, V-4): what its own app is linked from. The app is built from the SDK package alone (tools/sdk_core_app.sh, ci/trxapps.sh);
# nothing else is in its link: the base's archives, the sources the base compiles for the core, the libraries named below and the blocks its TOML A names (tools/libtab.py mapcheck proves it
# on the link map). The base's own tools read the same file: tools/app_build.py (the link), tools/libtab.py (the library table), tools/cor_pack.py --sizes (the heap figures, P4-1) and
# tools/core_toml.py (the switch desc_record).
[app]
name = "vc20"
# D25: the packers put desc.toml into the .cor as record 6 and the app takes the core's data from it (coreapp/src/bundle.cc)
desc_record = true
# the symbol of the core's descriptor (the library vc20 below defines it); the core table of this app holds this core only
desc = "vc20_desc"
# TOML A: the core's own (gateware.toml, checked against the RTL by tools/rtl_check.py) and the blocks of the host's TOML A (gateware/host.toml: the VIC-20 runs on the host bitstream,
# V-4b) that the shared drivers (hw.cc) name: the host's mode register (cart_regs), its drive window (drive_a, a block of the host that layer 2 serves: the VIC-20's own drive blocks
# come into gateware.toml with V-1c, until then it keeps this one), the five ICAP blocks of the loader (the VIC-20 is a partial core: it can return to the host) and the IEC block,
# whose version byte the board's IEC probe reads. No block of the cartridge page (c64cart), the ring (c64_debug), the DMA window (dma) or cmd_if is named, so board.cc runs no
# cartridge, ring, REU or command interface probe in this app.
toml_a = "gateware.toml"
base_toml_a = "host.toml"
base_blocks = ["cart_regs", "drive_a", "icap_id", "icap_data", "icap_enable", "icap_count", "icap_decouple", "iec_status"]
# coreapp/cores of the base that this app links: run.cc starts the diag core's runner (portdiag_attach) in every app
base_sources = ["portdiag.cc"]

# The core's own code: its descriptor and hooks (init, release, the operations of the ROM and PRG handling, the register map). Its files are in cores/vc20/app/lib.
[[library]]
name = "vc20"
sources = ["vc20.cc"]
headers = ["vc20_regs.h"]
needs = ["cbm1541", "cbmrun"]

# The 1541 drive A on the IEC bus (the VIC-20's drive_l2): the shared library, the same sources as trx64u's app links (S12)
[[library]]
name = "cbm1541"
sources = ["cbm1541.cc", "d1541_drive.cc", "d1541_gcr.cc", "d1541_wd.cc", "cbm1541_exports.cc"]
headers = ["cbm1541.h", "cbm1541_desc.h", "cbm1541_api.h", "d1541_drive.h", "d1541_gcr.h", "d1541_wd.h"]
bind = "cbm1541_bind"
register_ops = "cbm1541_register"
capability = "drive_a"

# Run PRG and Load PRG (cbm_run.cc) on the BASIC loader of the CBM family
[[library]]
name = "cbmrun"
sources = ["cbm_run.cc"]
headers = ["cbm_run.h"]
needs = ["cbmprg"]

[[library]]
name = "cbmprg"
sources = ["cbm_prg.cc", "cbmprg_exports.cc"]
headers = ["cbm_prg.h", "cbmprg_api.h"]
bind = "cbmprg_bind"
