# The SNK Neo Geo (MVS/AES) core (T143): MiSTer's NeoGeo core (furrtek's chip-level re-implementation; GPL v2 or later / v3, cores/neogeo/rtl/NOTICE) behind the host's
# layer-2 socket. TREX-internal. A LARGE core from the start (Alex, 2026-10-28, translated: "let 2 agents build the two cores for the SNES and the Neo Geo in parallel,
# for real, so that they go onto the large-core list"): host and core flat in ONE bitstream (cores/neogeo/mono/build_mono.tcl), started by the host as a .cfw (T115).
# This file is the only descriptor, there is no DFX lane; ci/plan.py, ci/lanes.py and ci/bitstream_mono.sh find the core by cores/neogeo/mono/core.toml, lane large-neogeo.
id           = "neogeo"
name         = "SNK Neo Geo"
version      = "0.0.1"
contract     = 2
app          = "blueprint"     # the T104 generic application with a Neo Geo descriptor (coreapp/cores/neogeo.cc)
delivery     = "cfw"           # no partial, no .cor: ci/bitstream_mono.sh builds the full bitstream, tools/pack_cfw_mc.sh makes neogeo.cfw
order        = 16              # after the C128 (14); 15 is the SNES core's
experimental = true            # built, benched, application written; no board test; the flag keeps the bench rows soft
# All of cores/neogeo (the flat build's own key, ci/lib.sh mono_key, leaves sim/ and mono/reports/ out again; mono/host/ is the core's copy of the host files) and the files the
# build reads in place. host/ is no part of the key (T164 3a Q1, "Copies instead.").
sources      = ["cores/neogeo", ":(exclude)cores/neogeo/sim", "cores/common"]
# The host's menu overlay (host/overlay.v, 3.5 block RAM tiles) is stubbed out (cores/neogeo/mono/stubs/overlay_stub.v), as the C128's is: the generic core application draws on the
# pixel layer and never writes the overlay's registers; the tiles are what the 75 of the XC7A50T leave the machine (cores/neogeo/mono/build_mono.tcl).
mono_env     = ["TRX_FEATURES=jtag", "TRX_STUB=overlay", "TRX_DEFS=NO_NET NO_C64VIDEO"]   # T164: no Ethernet, no VIC path, no C64 text
# The files the user supplies, names only (never in the repository, a release or a .cfw): the BIOS (one of sp-s2.sp1 for the MVS / AES, uni-bios.rom, neo-epo.sp1), the zoom table
# 000-lo.lo, the fix ROM sfix.sfix, in the core's folder (or the library); the games are ROM sets (a .neo file, a MAME-named folder or zip with a romsets.xml).
roms         = ["sp-s2.sp1", "uni-bios.rom", "000-lo.lo", "sfix.sfix"]
