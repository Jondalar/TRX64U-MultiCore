# TOML B of the Neo Geo's app (T239.3 D55, T239.5 D15): what its own app is linked from. The app is built from the SDK package alone (tools/sdk_core_app.sh, ci/trxapps.sh); nothing else is in its
# link: the base's archives, the sources the base compiles for the core, the libraries named below and the blocks its TOML A names (tools/libtab.py mapcheck proves it on the link map). The base's own
# tools read the same file: tools/app_build.py (the link), tools/libtab.py (the library table), tools/cor_pack.py --sizes (the heap figures) and tools/core_toml.py (the switch desc_record).
[app]
name = "neogeo"
# D25: the packers put desc.toml into the .cor as record 6 and the app takes the core's data from it (coreapp/src/bundle.cc)
desc_record = true
# the symbol of the core's descriptor (the library neogeo below defines it); the core table of this app holds this core only
desc = "neogeo_desc"
# TOML A: the core's own (gateware.toml, checked against the RTL by tools/rtl_check.py) and the blocks of the host's TOML A (gateware/host.toml: the Neo Geo is a large core on the host's pieces) that the
# shared drivers (hw.cc) name: the host's mode register (cart_regs), the five ICAP blocks of the loader and audio_master (the host's master volume; the core has no tone filter, desc.toml no_tone). The core
# has no 1541 and no IEC bus, so no block of the drive window or of iec_status is named, and no block of the cartridge page (c64cart), the ring (c64_debug), the DMA window (dma) or cmd_if, so board.cc runs
# no cartridge, ring, REU or command interface probe in this app.
toml_a = "gateware.toml"
base_toml_a = "host.toml"
base_blocks = ["cart_regs", "icap_id", "icap_data", "icap_enable", "icap_count", "partition", "audio_master"]
# coreapp/cores of the base that this app links: run.cc starts the diag core's runner (portdiag_attach) in every app
base_sources = ["portdiag.cc"]

# The core's own code: its descriptor and hooks (init, release, the operations of register_ops, the ROM set loader with the save of the backup RAM and the memory card, the service) and the ROM set / .neo file
# reader neoset (romsets.xml, the chip layouts, the DDR2 plan). Its files are in cores/neogeo/app/lib; hk_defaults.h is a copy of the shared app's (the other cores still use the original).
[[library]]
name = "neogeo"
sources = ["neogeo.cc", "neoset.cc"]
headers = ["neogeo_regs.h", "neoset.h", "hk_defaults.h"]
# pad: neogeo.cc declares the USB pads (the PadSpec of the descriptor, caps "pad")
needs = ["pad"]
# T239.5 D4: the tests of the library, by the step of the matrix (units of tests/coreapp/run.sh, built as this app: neogeoapp, the group neogeo): unit = 2 unit tests (neogeo the descriptor and neoset against a model of the
# register block: the ROM sets, the save, the mover), service = 8 mock bitstream -> service (neogeo_joyswap the "Joystick ports" setting down to the register, neogeo_descgen the record compiled from desc.toml against the
# descriptor, neogeo_romreq its rows of the host's ROM table, neogeo_mounts the cartridge slot kept in the .cfg and restored before the release, neogeo_pad the joystick word its service writes from a USB pad),
# ui = 9 service -> UI (neogeo_menuctl the menu on the core's record: the Library, a .neo file's sheet, the Run action; neogeo_desc the checks every descriptor passes and its menu's golden; neogeo_hotkeys
# its default hotkeys; neogeo_keywalk every key of its menu against its golden), api = 10 service -> API: its operations through the service call the REST and RPC transports make (neogeo_memops: svc_call;
# the Neo Geo's case of the shared test_memops, TEST_APP_NEOGEO), every row, setting value and operation of its declaration reachable over the API (neogeo_uicover).
# T239.5 D13: these are all the Neo Geo's cases; the shared units do not build it.
tests = { unit = ["neogeo"], service = ["neogeo_joyswap", "neogeo_descgen", "neogeo_romreq", "neogeo_mounts", "neogeo_pad"], ui = ["neogeo_menuctl", "neogeo_desc", "neogeo_hotkeys", "neogeo_keywalk"], api = ["neogeo_memops", "neogeo_uicover"] }

# The USB gamepads (the descriptor's pad spec, caps "pad"): the pad service with its maps and mapping wizard (the Input tab's Map buttons tasks), the HID descriptor reader and the XInput driver. The
# same sources as the shared app's library, S12 (its table "pad" is what engines.cc and ops_glue.cc call)
[[library]]
name = "pad"
sources = ["pad.cc", "hidpad.cc", "pad_ops.cc", "padwiz.cc", "xinput.cc", "usb_xinput.cc", "pad_exports.cc", "pad_board.cc"]
headers = ["pad.h", "hidpad.h", "xinput.h", "usb_xinput.h", "pad_api.h"]
exports = [{ name = "pad", major = 1, table = "pad_table" }]
init = "pad_lib_init"
core = "pad_lib_core"

# Unzip (apps/unzip: the actions on a .zip in the File Browser) takes the zip library through its needs entry `miniz>=1.0`. Base 4.0 loads no library file (T239.3 D58), so this app
# links it as the shared app does (coreapp/libs/shared.toml, the same sources and entries); without it the app refuses unzip's need.
[[library]]
name = "miniz"
sources = ["miniz_lib.cc", "miniz.c", "miniz_tinfl.c", "miniz_zip.c"]
headers = ["zip_lib.h"]
exports = [{ name = "miniz", major = 1, table = "miniz_table" }]
