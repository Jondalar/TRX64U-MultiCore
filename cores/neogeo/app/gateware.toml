# 0F0-0F3: the USB pads, 16 bit each, low byte first, the high byte commits: the machine's joystick word of player 1 and 2 (b0 right, 1 left, 2 down, 3 up, 4 A, 5 B, 6 C, 7 D, 8 Start, 9 Select, 10 Coin)
