# TOML A of the Neo Geo core (T239.3 D55, T239.5 D15): the gateware's registers as capabilities, written from what cores/neogeo/trx/neo_regs.v decodes (tools/rtl_check.py proves it against the RTL, code to
# code: tools/rtl_check.py check, command in app/sdkpkg/api.md 6.14.19; the first draft came from tools/rtl_check.py emit). The addresses are the host's: its decode hands 0x101A0000-0x101AFFFF to the
# core's cw_* ports (host/ultimate_sys.vhd, region r_cw), the register offset of the core's own app is the address minus 0x101A0000 (the block "ident" sits at the start of the window). Page 6
# (0x101A6000-0x101A6FFF) is decoded by neo_regs and forwarded to the host's pixel layer (px_we, px_re, px_rdata); it is the host's block and stays outside this file. The core has no drive and no
# IEC bus. desc.toml names a register of this file as "block.property" (tools/descrec.py, api.md 6.14.20), so the number stands once. The blocks of the core are named neo_* (except ident).
[io]
iobase = 0x10000000
u2p_io_base = 0x10100000

[identity]
id = "NEO_"
block = "ident"

# 000-00B: the ID "NEO_" (byte 0 first), the caps bytes (0xC0: page 6 and the RGB565 pixel layer, the host's; caps2 0x02: BUILD is there), the layer-2 contract the core was written for (2), and the build word (USR_ACCESS)
[[block]]
name = "ident"
module = "neo_regs"
owner = "base"
address = 0x101A0000
size = 0xC
  [[block.property]]
  name = "id"
  offset = 0x0
  width = 32
  dir = "r"
  [[block.property]]
  name = "caps"
  offset = 0x4
  width = 8
  dir = "r"
  [[block.property]]
  name = "caps2"
  offset = 0x5
  width = 8
  dir = "r"
  [[block.property]]
  name = "contract"
  offset = 0x6
  width = 8
  dir = "r"
  [[block.property]]
  name = "build"
  offset = 0x8
  width = 32
  dir = "r"

# 010 IRQ_EN, 014 IRQ_CAUSE (write 1 clears): b4 the mover finished a move, b5 a frame of the machine is complete, b6 the host's video frame start, b7 page flip done
[[block]]
name = "neo_irq"
module = "neo_regs"
owner = "base"
address = 0x101A0010
size = 0x8
  [[block.property]]
  name = "irq_en"
  offset = 0x0
  width = 8
  dir = "rw"
  [[block.property]]
  name = "irq_cause"
  offset = 0x4
  width = 8
  dir = "rw"
    [[block.property.field]]
    name = "mover"
    shift = 4
    bits = 1
    [[block.property.field]]
    name = "frame_done"
    shift = 5
    bits = 1
    [[block.property.field]]
    name = "vsync"
    shift = 6
    bits = 1
    [[block.property.field]]
    name = "flip"
    shift = 7
    bits = 1

# 020-027: the host's DDR2 calibration
[[block]]
name = "neo_ddr_cal"
module = "neo_regs"
owner = "base"
address = 0x101A0020
size = 0x8
  [[block.property]]
  name = "ddr_cal0"
  offset = 0x0
  width = 32
  dir = "r"
  [[block.property]]
  name = "ddr_cal1"
  offset = 0x4
  width = 32
  dir = "r"

# 0A0-0AB: the machine. ctrl b0 reset hold (power-on 1), b1 halt (Freeze); system b0 1 = MVS, 0 = AES, b1 PAL video, b2 memory card unplugged (set while the reset is held); dip b0 settings, b1 freeplay, b2 freeze; joy b0 swaps the host's two joystick ports (live); status b0 in reset, b1 held (Freeze), b2 machine running, b3 backup RAM / memory card changed, b4 mover busy, b5 PLL locked; save_ack any write clears status.dirty; cfg the romset's chip word (neogeo.sv cfg)
[[block]]
name = "neo_machine"
module = "neo_regs"
owner = "core"
address = 0x101A00A0
size = 0xC
  [[block.property]]
  name = "ctrl"
  offset = 0x0
  width = 8
  dir = "rw"
    [[block.property.field]]
    name = "reset_hold"
    shift = 0
    bits = 1
    [[block.property.field]]
    name = "halt"
    shift = 1
    bits = 1
  [[block.property]]
  name = "system"
  offset = 0x1
  width = 8
  dir = "rw"
    [[block.property.field]]
    name = "mvs"
    shift = 0
    bits = 1
    [[block.property.field]]
    name = "pal"
    shift = 1
    bits = 1
    [[block.property.field]]
    name = "nocard"
    shift = 2
    bits = 1
  [[block.property]]
  name = "dip"
  offset = 0x2
  width = 8
  dir = "rw"
  [[block.property]]
  name = "joy"
  offset = 0x3
  width = 8
  dir = "rw"
  [[block.property]]
  name = "status"
  offset = 0x4
  width = 8
  dir = "r"
    [[block.property.field]]
    name = "in_reset"
    shift = 0
    bits = 1
    [[block.property.field]]
    name = "held"
    shift = 1
    bits = 1
    [[block.property.field]]
    name = "running"
    shift = 2
    bits = 1
    [[block.property.field]]
    name = "dirty"
    shift = 3
    bits = 1
    [[block.property.field]]
    name = "moving"
    shift = 4
    bits = 1
    [[block.property.field]]
    name = "pll_locked"
    shift = 5
    bits = 1
  [[block.property]]
  name = "save_ack"
  offset = 0x5
  width = 8
  dir = "w"
  [[block.property]]
  name = "cfg"
  offset = 0x8
  width = 32
  dir = "rw"

# 0B0-0BF: counters of the machine's hold (clocks held, late sprite words, late fix words, 68k reads asked)
[[block]]
