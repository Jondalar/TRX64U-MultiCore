  offset = 0xC
  width = 32
  dir = "r"

# 0C0-0CB: the picture's frame buffers. fb_latest b7 valid, b1:0 the newest complete frame's buffer; fb_overruns lines that could not be handed to the DDR2 side in time; fb_base and fb_stride have the reset values of base_r and stride_r in neo_regs.v (the application sets its own, desc.toml); seen_cols and seen_lines (0CC-0CF) are the picture size the core has seen, 16 bit each
[[block]]
name = "neo_video"
module = "neo_regs"
owner = "core"
address = 0x101A00C0
size = 0x10
  [[block.property]]
  name = "fb_latest"
  offset = 0x0
  width = 8
  dir = "r"
  [[block.property]]
  name = "frame_seq"
  offset = 0x1
  width = 8
  dir = "r"
  [[block.property]]
  name = "fb_overruns"
  offset = 0x2
  width = 16
  dir = "r"
  [[block.property]]
  name = "fb_base"
  offset = 0x4
  width = 32
  dir = "rw"
    [[block.property.state]]
    name = "reset"
    value = 0x1D00000
  [[block.property]]
  name = "fb_stride"
  offset = 0x8
  width = 32
  dir = "rw"
    [[block.property.state]]
    name = "reset"
    value = 0x100000
  [[block.property]]
  name = "seen_cols"
  offset = 0xC
  width = 16
  dir = "r"
  [[block.property]]
  name = "seen_lines"
  offset = 0xE
  width = 16
  dir = "r"

