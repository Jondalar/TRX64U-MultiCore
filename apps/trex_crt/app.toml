ui = { sub = "EasyFlash 3 whole-cartridge operations", chip = "ERASE WHOLE EF3...", tone = "coral", hide = "@cart.not_ef3" }

[[node]]
anchor = "APP/flash/bar"
kind = "op"
label = "Scan"
op = "cart.scan"
bind = [ { arg = "tool", int = 2 } ]
order = 10
ui = { key = "F1" }

[[node]]
anchor = "APP/flash/bar"
kind = "op"
label = "Verify"
op = "cart.verify.start"
order = 20
ui = { key = "F5" }

[[node]]
anchor = "APP/flash/bar"
kind = "op"
label = "Slot / erase"
op = "cart.ef3.choose_target_or_erase"
bind = [ { arg = "tool", int = 2 } ]
order = 30
ui = { key = "F7", hide = "@cart.not_ef3", legend = "SLOT / ERASE" }

[[node]]
anchor = "APP/flash/bar"
kind = "op"
label = "Write cartridge"
op = "cart.write.confirm"
order = 40
ui = { key = "F3", primary = true, legend = "WRITE" }

# ---- the write confirmation -----------------------------------------------------------------------------------------------------------------------------
[[node]]
anchor = "APP/confirm"
