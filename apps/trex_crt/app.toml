# TREX CRT (T104.3 D0, D9.1): what the application adds to the core's menu and the screens it brings. Nothing here is code. The screens are the eight states of
# docs/lvgl_ui_project/TREX-CRT-UI.md: Home (the chooser), Dump, Flash, the write confirmation, the whole-EF3 erase confirmation, the progress, the result and
# the Inspector. Four of them are on the tab strip (1 .. 4); the other four are tabs that are not on it (`hidden`): the application shows them (`follow`) and
# RUN/STOP stays locked while a step cannot stop (`lock`). Every value is a state of glue.cc (cart.*), every button an operation of it.

# ---- the core's menu: Write to Cartridge on .crt (FW manifest.json filetypes) -----------------------------------------------------
[[file_action]]
ext = [".crt"]
label = "Write to Cartridge"
app = "trex_crt"
action = "write"

# T228 R21: the tasks of FW's manifest (apps/trex_crt/manifest.json: category "C64 Machine", "Dump Cartridge", "Cart Inspector", "Flash Cartridge"), shown as FW shows
# them: when trex_crt.u2a is in the apps folder. The apps' place of the core's menu is F7 (the tab "settings").
[[node]]
anchor = "F7/settings"
kind = "group"
label = "C64 Machine"
order = 10

[[node]]
anchor = "F7/settings"
kind = "op"
label = "Dump Cartridge"
order = 20
app = "trex_crt"
action = "dump"
ui = { sub = "Scan the cartridge in the port and save a CRT image", chip = "APP", tone = "violet" }

[[node]]
anchor = "F7/settings"
kind = "op"
label = "Cart Inspector"
order = 30
app = "trex_crt"
action = "inspect"
ui = { sub = "Browse the memory, the banks and the registers of the cartridge", chip = "APP", tone = "cyan" }

[[node]]
anchor = "F7/settings"
kind = "op"
label = "Flash Cartridge"
order = 40
app = "trex_crt"
action = "flash"
ui = { sub = "Write and verify a CRT image on a flash cartridge", chip = "APP", tone = "amber" }

# ---- the screens ----------------------------------------------------------------------------------------------------------------------------------------
[[area]]
key = "APP"
name = "TREX CRT"

  [[area.tab]]
  id = "home"
  name = "Home"
  widget = "nodes"
  n = 1
  layout = "app"
  ui = { crumb = "C64 / CARTRIDGE TOOLS", title = "TREX CRT", chip = "@cart.chip", side = "CURRENT TARGET", enter = "cart.enter_home", follow = "cart.screen", lock = "cart.lock", note = "Opening a .crt from the Library starts Flash with that file already selected. The app shows what it will read or change before it starts." }

  [[area.tab]]
  id = "dump"
  name = "Dump"
  widget = "nodes"
  n = 2
  layout = "app"
  ui = { crumb = "TREX CRT / DUMP", title = "Dump cartridge", chip = "@cart.chip", enter = "cart.enter_dump", lock = "cart.lock", back = "home", status = "cart.status", map1 = "ROML", map1_s = "cart.map_lo", map1_d = "cart.map_lo_d", map1_t = "cyan", map2 = "ROMH", map2_s = "cart.map_hi", map2_d = "cart.map_hi_d", map2_t = "violet" }

  [[area.tab]]
  id = "flash"
  name = "Flash"
  widget = "nodes"
  n = 3
  layout = "app"
  ui = { crumb = "TREX CRT / FLASH", title = "Flash cartridge", chip = "@cart.chip", enter = "cart.enter_flash", lock = "cart.lock", back = "home", status = "cart.status", map1 = "ROML", map1_s = "cart.map_lo", map1_d = "cart.map_lo_d", map1_t = "amber", map2 = "ROMH", map2_s = "cart.map_hi", map2_d = "cart.map_hi_d", map2_t = "amber" }

  [[area.tab]]
  id = "inspect"
  name = "Inspect"
  widget = "nodes"
  n = 4
  layout = "grid"
  ui = { crumb = "TREX CRT / INSPECT", title = "Cart Inspector", chip = "@cart.chip", enter = "cart.enter_inspect", lock = "cart.lock", back = "home", keys = "cart.inspect.key", grid = "cart.grid", lines = "17", side = "CARTRIDGE STATE", note = "UP/DOWN scrolls the memory, LEFT/RIGHT changes the bank." }

  [[area.tab]]
  id = "confirm"
  name = "Write"
  widget = "nodes"
  n = 91
  layout = "app"
  ui = { hidden = true, under = "flash", crumb = "TREX CRT / FLASH", title = "Write this cartridge?", chip = "ERASES FIRST", lock = "cart.lock", back = "flash", note = "cart.scope" }

  [[area.tab]]
  id = "erase"
  name = "Erase"
  widget = "nodes"
  n = 92
  layout = "app"
  ui = { hidden = true, under = "flash", crumb = "TREX CRT / FLASH / MAINTENANCE", title = "Erase the whole EasyFlash 3?", chip = "DESTROYS ALL", lock = "cart.lock", back = "flash", note = "A chip erase cannot be taken back. After it the cartridge does not start until a type 90 system image is written to it, which needs the whole-cartridge write of the Flash screen." }

  [[area.tab]]
  id = "progress"
  name = "Progress"
  widget = "nodes"
  n = 93
  layout = "app"
  ui = { hidden = true, crumb = "TREX CRT", title = "@cart.title", chip = "WORKING", lock = "cart.lock", status = "cart.status", pct = "cart.pct", pct_label = "cart.phase", pct_note = "cart.count", note = "cart.note", map1 = "ROML", map1_s = "cart.map_lo", map1_d = "cart.map_lo_d", map1_t = "amber", map2 = "ROMH", map2_s = "cart.map_hi", map2_d = "cart.map_hi_d", map2_t = "amber" }

  [[area.tab]]
  id = "result"
  name = "Result"
  widget = "nodes"
  n = 94
  layout = "app"
  ui = { hidden = true, crumb = "TREX CRT", title = "@cart.title", chip = "@cart.chip", lock = "cart.lock", back = "home", status = "cart.status", map1 = "ROML", map1_s = "cart.map_lo", map1_d = "cart.map_lo_d", map1_t = "cyan", map2 = "ROMH", map2_s = "cart.map_hi", map2_d = "cart.map_hi_d", map2_t = "violet" }

# ---- Home: the chooser and the current target -----------------------------------------------------------------------------------------------------------
[[node]]
anchor = "APP/home"
kind = "op"
label = "Inspect cartridge"
order = 10
ui = { sub = "Browse memory, banks, and cartridge registers", chip = "READ ONLY", tone = "cyan", goto = "APP/inspect" }

[[node]]
anchor = "APP/home"
kind = "op"
label = "Dump cartridge"
order = 20
ui = { sub = "Scan the cartridge and save a CRT image", chip = "SAVE FILE", tone = "violet", goto = "APP/dump" }

[[node]]
anchor = "APP/home"
kind = "op"
label = "Flash cartridge"
order = 30
ui = { sub = "Write and verify a selected CRT image", chip = "WRITES CART", tone = "amber", goto = "APP/flash" }

[[node]]
anchor = "APP/home/side"
kind = "state"
label = "Cartridge"
state = "cart.type"
order = 10

[[node]]
anchor = "APP/home/side"
kind = "state"
label = "Slot"
state = "cart.slot_short"
order = 20

[[node]]
anchor = "APP/home/side"
kind = "state"
label = "Port"
state = "cart.port"
order = 30

[[node]]
anchor = "APP/home/side"
kind = "state"
label = "Write gate"
state = "cart.gate"
order = 40

# ---- Dump -----------------------------------------------------------------------------------------------------------------------------------------------
[[node]]
anchor = "APP/dump"
kind = "state"
label = "Target"
order = 10
ui = { sub = "@cart.target", chip = "@cart.banks_chip", tone = "cyan" }

[[node]]
anchor = "APP/dump"
kind = "op"
label = "Save as"
op = "cart.dest.choose"
order = 20
ui = { sub = "@cart.dest", chip = "CHANGE", tone = "violet" }

[[node]]
anchor = "APP/dump/bar"
kind = "op"
label = "Scan"
op = "cart.scan"
bind = [ { arg = "tool", int = 1 } ]
order = 10
ui = { key = "F1" }

[[node]]
anchor = "APP/dump/bar"
kind = "op"
label = "Inspect"
order = 20
ui = { key = "F5", goto = "APP/inspect" }

[[node]]
anchor = "APP/dump/bar"
kind = "op"
label = "Slot"
op = "cart.ef3.choose_target_or_erase"
bind = [ { arg = "tool", int = 1 } ]
order = 30
ui = { key = "F7", hide = "@cart.not_ef3", legend = "SLOT" }

[[node]]
anchor = "APP/dump/bar"
kind = "op"
label = "Dump to file"
op = "cart.dump.start"
order = 40
ui = { key = "F3", primary = true, legend = "DUMP" }

# ---- Flash ----------------------------------------------------------------------------------------------------------------------------------------------
