name: Pipeline

# T239.5 D22 (Alex, 2026-11-26: "Away with the monolith."): this file is the trigger of the pipeline and nothing else - its one job calls the matrix
# (.github/workflows/matrix.yml), which holds every job: the dispatcher (plan, work order), the approval, lint, the key tests, the app tests, the lanes, the sims, the
# cor jobs, the package, the update files, the emulator tests and the pre-release (T239.5 §5 has the inventory). The file keeps its name because the builder serves the
# runs of this workflow (its SRC_WORKFLOW_PATH): it reads the work order of the run and releases the environment `bitstreams` (T239.1 D11, D21).
#
# T239.1 D51 (Alex, 2026-11-22): tests run on the way into integration; a push to main or a v* tag runs no test (input tests false): it only builds, packs and publishes.
# Pushes of this repository's branches run on `push`; a pull request from a fork runs on `pull_request` (a pull request from a branch of this repository is the push's
# run; the fork's run has no secrets and its own approval). A documentation-only push starts no run here; the public-tree check (public-tree.yml) has no paths-ignore and
# runs for it.
# D9: schedule and workflow_dispatch work only for workflows on the default branch, so the nightly and sims-long run from a push to a scratch branch
# (scratch/nightly/**, scratch/sims-long/**) whose head commit carries a marker; this pipeline ignores those branches.
on:
  push:
    branches: ['**', '!scratch/nightly/**', '!scratch/sims-long/**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  # D39: the extra parts of a dispatched run are one dropdown in GitHub's "Run workflow" panel; GitHub shows that panel only for workflows on the default
  # branch, so it appears with the switch. update = the .cfw/.ue2 update files (and with them the whole package); sims = the benches of the changed owners (always on
  # integration). A fork pull request cannot be dispatched; it keeps "[bundle]" in its head commit.
  workflow_dispatch:
    inputs:
      extra:
        description: 'Extra parts of this run: update = the .cfw/.ue2 update files and the whole package; sims = the benches of the changed owners'
        type: choice
        options:
          - none
          - update
          - sims
          - update and sims
        default: none

permissions:
  contents: read

# One run per ref at a time, in the order they started waiting (D9; replaces the queue script of T87). The group is the branch, or the pull request's head branch.
concurrency:
  group: pipeline-${{ github.head_ref || github.ref }}
  queue: max

jobs:
  matrix:
    # a pull request from a branch of this repository is the push's run; a fork's pull request runs here
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    uses: ./.github/workflows/matrix.yml
    with:
      tests: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    secrets: inherit    # T261: BUILDS_TOKEN is a secret of the environment `builds`; a called workflow's job that names the environment reads it only when the caller inherits
