name: Matrix
run-name: "matrix @${{ github.event.pull_request.head.sha || github.sha }}"

# T239.5 (D8-D10, the scenarios S1-S7 of docs/specs/T239.5-core-pipeline.md): the new pipeline as a matrix. The lanes from top to bottom: the tree checks
# and the dispatcher of every push, the SDK (A), the bitstreams of the host and of each core that moved to the SDK, the host menu, one lane per moved core
# (B); the same thirteen steps from left to right (1 lint, 2 unit tests, 3 what has changed, 4 comparison, 5 what must be in it, 6 build, 7 complete and
# fits, 8-10 tests mock bitstream -> service, service -> UI, service -> API, 11 package, 12 emulator tests, 13 deliver). A lane leaves a step empty when
# it does not have it. ci/lane.sh runs one step of one lane; ci/dispatch.py decides what this push has to do (D9).
# It runs instead of the old pipeline's jobs on the T239 branch (t239.3, t239.3-*, D3): pipeline.yml calls it there, so the builder, which serves the runs of
# pipeline.yml, builds the bitstreams this file's work order names as missing (T239.1 D11) and releases the environment `bitstreams` (D21).
# D11, D13: on every other push of a branch or v* tag (not t239.1, not a pull request) it runs beside the old pipeline's jobs (input beside): there the run's
# plan, work order, approval, lint and sims are the old jobs plan, approve, lint and sim (the artifacts `plan` and `work-order` exist once per run; the builder
# reads that work order), and where the old pipeline makes a package (scope full, or update asked) the package of record is this file's whole package (D14,
# the jobs collect and package): the old job package does not run, and the old jobs update, emu and prerelease take this file's artifact `package`. On a
# feature branch without a package only the lanes the push touched run (ci/dispatch.py); a documentation-only push runs no lane. Input tests (T239.1 D51):
# false on a push to main or a v* tag, where no test runs - the lanes build, pack and deliver; their test steps (2, 4, 7 of the SDK, 8-10) and the emulator
# jobs (12) are left out.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      beside:
        description: "true beside the old pipeline (every push but the T239 branch's): its plan, work order, approval, lint and sims serve the matrix too"
        type: boolean
        default: false
      tests:
        description: "false on a push to main or a v* tag (T239.1 D51: no test job there); the lanes then skip their test steps and the emulator jobs"
        type: boolean
        default: true

jobs:
  # Every push: what changed (ci/plan.sh), the lanes and steps of this push (ci/dispatch.py, the matrix in the summary), the work order of the builder
  dispatch:
    name: Dispatcher (what this push has to do)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jondalar/trx64u-build@sha256:706a976b56de400970d5af3bac9358d063c1d87defe6a3630d3ed26c5bae0c08
    timeout-minutes: 30
    env:
      CI_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
    outputs:
      cores: ${{ steps.dispatch.outputs.cores }}
      sdk: ${{ steps.dispatch.outputs.sdk }}
      host: ${{ steps.dispatch.outputs.host }}
      package: ${{ steps.dispatch.outputs.package }}
      host_emu_core: ${{ steps.dispatch.outputs.host_emu_core }}
      lint_groups: ${{ steps.dispatch.outputs.lint_groups }}
      sim_owners: ${{ steps.dispatch.outputs.sim_owners }}
      sims_tier: ${{ steps.dispatch.outputs.sims_tier }}
      missing: ${{ steps.order.outputs.missing }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Container paths and git
        # as in pipeline.yml: $RUNNER_TEMP and $GITHUB_WORKSPACE are the container's paths (env.CI_TEMP, env.CI_WS); git trusts the checkout
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          echo "CI_HANDOFF=$RUNNER_TEMP/handoff" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/handoff"
      - name: 3 What has changed (the plan)
        env:
          TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: pipeline.yml
        run: |
          set -eu
          ci/plan.sh --out "$CI_HANDOFF/plan.json"
          cat "$CI_HANDOFF/plan.json.files" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Dispatcher (the lanes and steps of this push)
        id: dispatch
        env:
          SIMS_INPUT: ${{ contains(github.event.inputs.extra, 'sims') }}
          UPDATE_FORCE: ${{ contains(github.event.inputs.extra, 'update') }}
          BESIDE: ${{ inputs.beside }}
        run: |
          set -eu
          tier="$(ci/select.sh sims-tier)"
          # as the old plan job: the update files are asked for (ci/select.sh update), so a package is made (ci/orchestrate.py: package = scope full or update)
          update="$(ci/select.sh update)"
          # the plan carries the tier of this run, as the old plan job stamps it: a sims leg (ci/child.sh sim) reads it from the plan artifact
          python3 ci/orchestrate.py stamp "$CI_HANDOFF/plan.json" --tier "$tier"
          b=""; [ "$BESIDE" != true ] || b=--beside
          # into a file first: a failing dispatcher fails this step (a pipe into tee would hide its exit code)
          python3 ci/dispatch.py "$CI_HANDOFF/plan.json" --tier "$tier" --update "$update" $b > "$CI_HANDOFF/dispatch.out"
          cat "$CI_HANDOFF/dispatch.out" >> "$GITHUB_OUTPUT"
          cat "$CI_HANDOFF/dispatch.out"
      # D14: the whole package needs every entry (ci/order.py: a package child needs them all); a documentation-only plan makes no package and starts no lane,
      # so its work order is empty. Beside the old pipeline (D11) its job plan has uploaded the run's plan and work order (the same plan; its work order names
      # every entry where a package is made, else the entries of the cor legs and of every core lane this dispatcher starts: ci/orchestrate.py order_targets,
      # matrix_lanes is the rule of both), so this job uploads neither: one of each per run
      - name: Work order (the bitstreams the builder builds)
        id: order
        if: ${{ !inputs.beside }}
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_JSON_FILE: ${{ env.CI_TEMP }}/handoff/plan.json
          WORK_ORDER_OUT: ${{ env.CI_TEMP }}/handoff/work-order.json
          CHILDREN: ${{ steps.dispatch.outputs.package == 'true' && '["cor","package"]' || '["cor"]' }}
          COR_TARGETS: ${{ steps.dispatch.outputs.cor_targets }}
        run: python3 ci/order.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        if: ${{ !inputs.beside }}
        with:
          name: plan
          path: ${{ env.CI_TEMP }}/handoff/plan.json
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        if: ${{ !inputs.beside }}
        with:
          name: work-order
          path: ${{ env.CI_TEMP }}/handoff/work-order.json
          retention-days: 3
          if-no-files-found: error

  # T239.1 D14: Alex's click for a commit the builder does not build by itself (as the job approve of pipeline.yml; beside the old pipeline that job holds it: no work order here, so no `missing`)
  approve:
    name: Approve the builder's work (environment vivado)
    needs: dispatch
    if: ${{ needs.dispatch.outputs.missing == 'true' && !(github.event_name == 'push' && github.actor_id == '682272' && github.triggering_actor == github.actor) }}
    runs-on: ubuntu-latest
    environment: vivado
    timeout-minutes: 5
    steps:
      - run: echo "approved; the builder builds the missing keys of this commit"

  # 1 Lint, one leg per lane (D7): tree = the tree checks of every push (every check no other lane owns), sdk, host, core:<id> (ci/lint.sh <group>); alone only - beside, the old job lint runs every group
  lint:
    name: "1 Lint (${{ matrix.group }})"
    needs: dispatch
    if: ${{ !cancelled() && needs.dispatch.result == 'success' && needs.dispatch.outputs.lint_groups != '[]' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jondalar/trx64u-sim@sha256:3e366a085f3ff5bfec33b5fa08359a625034038803b8b89f3406691683a625e0
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.dispatch.outputs.lint_groups) }}
    env:
      CI_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Container paths and git
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Lint
        run: ci/lint.sh "$GROUP"

  # A: the SDK lane - 2 unit tests, 6 build, 7 test, 11 package, 13 deploy (the artifact `sdk`; later the registry, T239.4)
  sdk:
    name: "SDK (A): unit tests, build, test, package, deploy"
    needs: [dispatch, lint]
    if: ${{ !cancelled() && needs.dispatch.result == 'success' && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && needs.dispatch.outputs.sdk == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jondalar/trx64u-build@sha256:706a976b56de400970d5af3bac9358d063c1d87defe6a3630d3ed26c5bae0c08
    timeout-minutes: 120
    env:
      CI_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Container paths and git
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          {
            echo "CI_HANDOFF=$RUNNER_TEMP/handoff"
            echo "CI_RUN_ID=$GITHUB_RUN_ID"
            echo "CI_APPTESTS_OK=$RUNNER_TEMP/ci-cache/apptests-ok"
            echo "CI_TRXAPPS_CACHE=$RUNNER_TEMP/ci-cache/trxapps"
            echo "CONTROLS_CACHE=$RUNNER_TEMP/ci-cache/controls-ok"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/handoff"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ env.CI_TEMP }}/ci-cache
          key: ci-cache-lane-sdk-${{ github.sha }}
          restore-keys: |
            ci-cache-lane-sdk-
            ci-cache-images-
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ env.CI_TEMP }}/ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-
      - name: 2 Unit tests (the base and the shared libraries)
        if: ${{ inputs.tests }}
        run: ci/lane.sh sdk unit
      - name: 6 Build (the base, the shared libraries, the sub-apps, the package)
        run: ci/lane.sh sdk build
      - name: 7 Test (the package checks itself)
        if: ${{ inputs.tests }}
        run: ci/lane.sh sdk test
      - name: 7 Test (the overlay test app, the artifact ovtest-app of ovtest-emu)
        if: ${{ inputs.tests }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: ovtest-app
          path: ${{ env.CI_TEMP }}/handoff/ovtest
          retention-days: 7
          if-no-files-found: error
      - name: 11 Package (what the lane deploys)
        run: ci/lane.sh sdk package
      - name: 13 Deploy (the artifact sdk the core lanes take)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: sdk
          path: ${{ env.CI_TEMP }}/handoff/sdk
          retention-days: 14
          if-no-files-found: error
      - name: 13 Deploy (the artifact shared-app, the shared image the whole package packs the cores that still run it with)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: shared-app
          path: ${{ env.CI_TEMP }}/handoff/shared-app
          retention-days: 14
          if-no-files-found: error

  # T261 P2, D4: the package of the SDK lane as the release sdk-<sdk_version>-<sha8> of the builds repository, when it differs from the last release of its version
  # (ci/publish_sdk.py). The environment `builds` lets only its allowed refs in; the job runs the commit's own scripts with that environment's token.
  sdk-release:
    name: SDK release (T261)
    needs: [sdk]
    if: ${{ !cancelled() && needs.sdk.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/t239.3') }}
    runs-on: ubuntu-latest
    environment: builds
    container:
      image: ghcr.io/jondalar/trx64u-build@sha256:706a976b56de400970d5af3bac9358d063c1d87defe6a3630d3ed26c5bae0c08
    timeout-minutes: 30
    env:
      CI_BRANCH: ${{ github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Container paths
        run: echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: sdk
          path: ${{ env.CI_TEMP }}/sdk-in
      - name: SDK release
        env:
          MC_BUILDS_REPO: Jondalar/trx64mc-builds
          BUILDS_TOKEN: ${{ secrets.BUILDS_TOKEN }}
        run: python3 -I ci/publish_sdk.py --dir "$CI_TEMP/sdk-in" --sha "$GITHUB_SHA"

  # the host menu lane - 2 unit tests, 6 build, 13 deliver (12, the emulator, is the job host-emu)
  host:
    name: "Host menu: unit tests, build, deliver"
    needs: [dispatch, lint]
    if: ${{ !cancelled() && needs.dispatch.result == 'success' && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && needs.dispatch.outputs.host == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jondalar/trx64u-build@sha256:706a976b56de400970d5af3bac9358d063c1d87defe6a3630d3ed26c5bae0c08
    timeout-minutes: 90
    env:
      CI_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Container paths and git
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          {
            echo "CI_HANDOFF=$RUNNER_TEMP/handoff"
            echo "CI_RUN_ID=$GITHUB_RUN_ID"
            echo "CI_APPTESTS_OK=$RUNNER_TEMP/ci-cache/apptests-ok"
            echo "CI_TRXAPPS_CACHE=$RUNNER_TEMP/ci-cache/trxapps"
            echo "CONTROLS_CACHE=$RUNNER_TEMP/ci-cache/controls-ok"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/handoff"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ env.CI_TEMP }}/ci-cache
          key: ci-cache-lane-host-${{ github.sha }}
          restore-keys: |
            ci-cache-lane-host-
            ci-cache-images-
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ env.CI_TEMP }}/ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-
      - name: 2 Unit tests (tests/hostapp)
        if: ${{ inputs.tests }}
        run: ci/lane.sh host unit
      - name: 6 Build (the host app and its emulator build)
        run: ci/lane.sh host build
      - name: 13 Deliver (the artifact host)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: host
          path: ${{ env.CI_TEMP }}/handoff/host
          retention-days: 14
          if-no-files-found: error

  # the bitstream lanes, step 2: the sims of the host and of the moved cores, on demand only ("[sims]" or the dispatch input), before Vivado
  sims:
    needs: dispatch
    if: ${{ !cancelled() && needs.dispatch.result == 'success' && needs.dispatch.outputs.sim_owners != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        owner: ${{ fromJSON(needs.dispatch.outputs.sim_owners) }}
    uses: ./.github/workflows/sim.yml
    with:
      target: ${{ matrix.owner }}
      tier: ${{ needs.dispatch.outputs.sims_tier }}

  # the bitstream lanes of the host and of each moved core - 3 key, 6 Vivado (the builder, while this job waits at the environment bitstreams),
  # 7 report, 11 keep (the entries restored from the builds repository), 13 to the lanes (the artifact bits-<id>)
  bits:
    name: "Bitstreams: the host and ${{ matrix.core }}"
    needs: [dispatch, approve, sims]
    if: ${{ !cancelled() && needs.dispatch.result == 'success' && needs.dispatch.outputs.cores != '[]' && needs.approve.result != 'failure' && needs.approve.result != 'cancelled' && needs.sims.result != 'failure' && needs.sims.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: bitstreams
    container:
      image: ghcr.io/jondalar/trx64u-build@sha256:706a976b56de400970d5af3bac9358d063c1d87defe6a3630d3ed26c5bae0c08
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(needs.dispatch.outputs.cores) }}
    env:
      CI_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
      CORE: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Container paths and git
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          {
            echo "CI_HANDOFF=$RUNNER_TEMP/handoff"
            echo "CI_RUN_ID=$GITHUB_RUN_ID"
            echo "CI_BIT_CACHE=$RUNNER_TEMP/bit"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/handoff" "$RUNNER_TEMP/bit"
      - name: 3 Key
        run: ci/lane.sh "bits:$CORE" key
      - name: 6 Vivado (the builder) and 11 keep (the entries from the builds repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/lane.sh "bits:$CORE" fetch
      - name: 7 Report
        run: ci/lane.sh "bits:$CORE" report
      - name: 13 To the lanes (the artifact bits-<core>)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: bits-${{ matrix.core }}
          path: ${{ env.CI_TEMP }}/bit
          retention-days: 3
          if-no-files-found: error

  # B: one lane per moved core - 2 unit tests, 3 what has changed, 4 comparison, 5 what must be in it, 6 build, 7 complete and fits, 8-10 the tests its
  # TOML B names (D4), 11 package, 13 deliver (the artifact deliver-<core>; 12 is the job emu: the core's app alone, D18)
  core:
    name: "${{ matrix.core }} (B): steps 2-11 and 13"
    needs: [dispatch, lint, sdk, bits]
    if: ${{ !cancelled() && needs.dispatch.result == 'success' && needs.dispatch.outputs.cores != '[]' && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && needs.sdk.result == 'success' && needs.bits.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jondalar/trx64u-build@sha256:706a976b56de400970d5af3bac9358d063c1d87defe6a3630d3ed26c5bae0c08
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(needs.dispatch.outputs.cores) }}
    env:
      CI_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
      CORE: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Container paths and git
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          {
            echo "CI_HANDOFF=$RUNNER_TEMP/handoff"
            echo "CI_RUN_ID=$GITHUB_RUN_ID"
            echo "CI_APPTESTS_OK=$RUNNER_TEMP/ci-cache/apptests-ok"
            echo "CI_TRXAPPS_CACHE=$RUNNER_TEMP/ci-cache/trxapps"
            echo "CONTROLS_CACHE=$RUNNER_TEMP/ci-cache/controls-ok"
            echo "CI_BIT_CACHE=$RUNNER_TEMP/bit"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/handoff" "$RUNNER_TEMP/bit"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ env.CI_TEMP }}/ci-cache
          key: ci-cache-lane-core-${{ matrix.core }}-${{ github.sha }}
          restore-keys: |
            ci-cache-lane-core-${{ matrix.core }}-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: plan
          path: ${{ env.CI_TEMP }}/handoff
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: sdk
          path: ${{ env.CI_TEMP }}/handoff/sdk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: bits-${{ matrix.core }}
          path: ${{ env.CI_TEMP }}/bit
      - name: 2 Unit tests (its own libraries)
        if: ${{ inputs.tests }}
        run: ci/lane.sh "core:$CORE" unit
      - name: 3 What has changed
        run: ci/lane.sh "core:$CORE" changed
      - name: 4 Comparison (the gateware, the TOML A against the RTL, the app)
        if: ${{ inputs.tests }}
        run: ci/lane.sh "core:$CORE" compare
      - name: 5 What must be in the app (TOML A and TOML B against the building blocks)
        run: ci/lane.sh "core:$CORE" needs
      - name: 6 Build (the app from the SDK)
        run: ci/lane.sh "core:$CORE" build
      - name: 7 Complete and fits (the link map, the application region and the heap, the shared libraries)
        run: ci/lane.sh "core:$CORE" fits
      - name: 8 Tests mock bitstream -> service
        if: ${{ inputs.tests }}
        run: ci/lane.sh "core:$CORE" service
      - name: 9 Tests service -> UI
        if: ${{ inputs.tests }}
        run: ci/lane.sh "core:$CORE" ui
      - name: 10 Tests service -> API
        if: ${{ inputs.tests }}
        run: ci/lane.sh "core:$CORE" api
      - name: 11 Package (the .cor with the bitstream)
        run: ci/lane.sh "core:$CORE" package
      - name: 13 Deliver (the .cor and the docs)
        run: ci/lane.sh "core:$CORE" deliver
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: deliver-${{ matrix.core }}
          path: ${{ env.CI_TEMP }}/handoff/deliver-${{ matrix.core }}
          retention-days: 14
          if-no-files-found: error

  # 12 Emulator tests of a core lane (D18): the core's own app alone in ue2emu, no host - started from the .cor and the ELF its lane delivered, it identifies
  # the core and then ends as its description says (tests/coreapp/emu/core_round.sh): a running core opens and closes its menu, a core that waits for a program
  # or a menu_first core has its menu open, a core whose profile says [round] ends = "rompage" waits on its ROM page; a refused identity fails every kind.
  # The kit is the emulator's ROM folder alone (ci/emu_kit.sh)
  emu:
    name: "12 Emulator tests: ${{ matrix.core }}"
    needs: [dispatch, core]
    if: ${{ !cancelled() && inputs.tests && needs.dispatch.result == 'success' && needs.dispatch.outputs.cores != '[]' && needs.core.result != 'skipped' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jondalar/trx64u-emu@sha256:250f08bb1a00e66fccec6c136e3e132ad542b430ab668cd98ccf87b541382281
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(needs.dispatch.outputs.cores) }}
    env:
      CI_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
      CORE: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Container paths and git
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          echo "CI_HANDOFF=$RUNNER_TEMP/handoff" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/handoff"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        id: dl
        continue-on-error: true   # D15: this lane's own deliver artifact only - a red lane has none, and only its own emu leg has nothing to run (the lane itself is red)
        with:
          name: deliver-${{ matrix.core }}
          path: ${{ env.CI_TEMP }}/handoff/deliver
      - name: The lane is green, so its deliver artifact has to be there
        if: steps.dl.outcome != 'success' && needs.core.result == 'success'
        run: |
          echo "LANE RED: $CORE emu: the deliver artifact did not download although the lane is green (a download failure, not a red lane)"
          exit 1
      - name: Gideon's pinned commit
        if: steps.dl.outcome == 'success'
        id: gideon
        run: echo "commit=$(sed -n 's/^GIDEON_COMMIT="\(.*\)"$/\1/p' ci/emu_kit.sh)" >> "$GITHUB_OUTPUT"
      - if: steps.dl.outcome == 'success'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ env.CI_TEMP }}/gideon-roms
          key: gideon-roms-${{ steps.gideon.outputs.commit }}
      - name: Kit (the emulator's ROM folder)
        if: steps.dl.outcome == 'success'
        shell: bash   # arrays: a container job runs run: under sh (dash) unless a step names bash
        run: |
          set -eu
          roms=()
          [ ! -d "$RUNNER_TEMP/gideon-roms" ] || roms=(--roms "$RUNNER_TEMP/gideon-roms")
          ci/emu_kit.sh "$RUNNER_TEMP/kit" ${roms[@]+"${roms[@]}"}
          [ -d "$RUNNER_TEMP/gideon-roms" ] || cp -R "$RUNNER_TEMP/kit/roms" "$RUNNER_TEMP/gideon-roms"
      - name: 12 Emulator tests (tests/coreapp/emu/core_round.sh - the core's app alone, identified, its menu opens and closes)
        if: steps.dl.outcome == 'success'
        shell: bash
        run: |
          set -eu
          rc=0; UE2EMU_ROMS="$RUNNER_TEMP/kit/roms" tests/coreapp/emu/core_round.sh "$CORE" "$CI_HANDOFF/deliver/$CORE.cor" "$CI_HANDOFF/deliver/$CORE.elf" "$RUNNER_TEMP/emu-out" || rc=$?
          [ "$rc" -eq 0 ] || { echo "LANE RED: $CORE emu: tests/coreapp/emu/core_round.sh exit $rc (77: nothing ran)"; exit 1; }
      - name: Emulator output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: emu-${{ matrix.core }}
          path: ${{ env.CI_TEMP }}/emu-out
          retention-days: 7
          if-no-files-found: ignore

  # 12 Emulator tests of the SDK lane (T239.5 D19): the overlay features (T256 S3, S5, S10) on the SDK example's app linked with the overlay test library (tests/ui/ovtest/build.sh, step 7 of the
  # SDK lane), on the machine of the emulator profile vc20 and a .cor that carries the test element: tests/ui/run.sh features_cores/overlay_vc20.feature. No core lane builds or runs ovtest.
  ovtest-emu:
    name: "12 Emulator tests: the overlay service (the SDK example with ovtest)"
    needs: [dispatch, sdk]
    if: ${{ !cancelled() && inputs.tests && needs.dispatch.result == 'success' && needs.sdk.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jondalar/trx64u-emu@sha256:250f08bb1a00e66fccec6c136e3e132ad542b430ab668cd98ccf87b541382281
    timeout-minutes: 30
    env:
      CI_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Container paths and git
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: ovtest-app
          path: ${{ env.CI_TEMP }}/handoff/ovtest
      - name: Gideon's pinned commit
        id: gideon
        run: echo "commit=$(sed -n 's/^GIDEON_COMMIT="\(.*\)"$/\1/p' ci/emu_kit.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ env.CI_TEMP }}/gideon-roms
          key: gideon-roms-${{ steps.gideon.outputs.commit }}
      - name: Kit (the emulator's ROM folder)
        shell: bash   # arrays: a container job runs run: under sh (dash) unless a step names bash
        run: |
          set -eu
          roms=()
          [ ! -d "$RUNNER_TEMP/gideon-roms" ] || roms=(--roms "$RUNNER_TEMP/gideon-roms")
          ci/emu_kit.sh "$RUNNER_TEMP/kit" ${roms[@]+"${roms[@]}"}
          [ -d "$RUNNER_TEMP/gideon-roms" ] || cp -R "$RUNNER_TEMP/kit/roms" "$RUNNER_TEMP/gideon-roms"
      - name: 12 Emulator tests (tests/ui/run.sh features_cores/overlay_vc20.feature - the overlay service on the SDK example's app)
        shell: bash
        run: |
          set -eu
          rc=0; OVTEST_APP="$RUNNER_TEMP/handoff/ovtest/example_ovtest.app" UE2EMU="$PWD/ci/ue2emu.sh" UE2EMU_ROMS="$RUNNER_TEMP/kit/roms" tests/ui/run.sh features_cores/overlay_vc20.feature || rc=$?
          [ "$rc" -eq 0 ] || { echo "LANE RED: ovtest emu: tests/ui/run.sh exit $rc"; exit 1; }
      - name: Emulator output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: emu-ovtest
          path: tests/ui/out
          retention-days: 7
          if-no-files-found: ignore

  # 12 Emulator tests of the host menu lane (S6, D18): the host app's real flow in ue2emu with the .cor the host lane core's lane delivered (ci/orchestrate.py HOST_EMU_CORE) - the round host -> its .cor
  # -> its menu -> host and the host menu's own flows (T187, T198, T211, T221, T223; tests/hostapp/emu_host.sh). It runs where the host lane is green and that core delivered (D15: no other lane matters).
  host-emu:
    name: "12 Emulator tests: the host menu (with the .cor of ${{ needs.dispatch.outputs.host_emu_core }})"
    needs: [dispatch, host, core]
    if: ${{ !cancelled() && inputs.tests && needs.dispatch.result == 'success' && contains(fromJSON(needs.dispatch.outputs.cores), needs.dispatch.outputs.host_emu_core) && needs.host.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jondalar/trx64u-emu@sha256:250f08bb1a00e66fccec6c136e3e132ad542b430ab668cd98ccf87b541382281
    timeout-minutes: 45
    env:
      CI_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
      HOST_EMU_CORE: ${{ needs.dispatch.outputs.host_emu_core }}   # ci/orchestrate.py HOST_EMU_CORE, printed by ci/dispatch.py: the one place the lane's core is named
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Container paths and git
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          echo "CI_HANDOFF=$RUNNER_TEMP/handoff" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/handoff"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: host
          path: ${{ env.CI_TEMP }}/handoff/host
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        id: dl
        continue-on-error: true   # D15: the host lane core's artifact alone; a red lane has none (the lane is red, this leg has nothing to run)
        with:
          name: deliver-${{ needs.dispatch.outputs.host_emu_core }}
          path: ${{ env.CI_TEMP }}/handoff/deliver
      - name: The lane is green, so its deliver artifact has to be there
        if: steps.dl.outcome != 'success' && needs.core.result == 'success'
        run: |
          echo "LANE RED: host emu: the deliver artifact did not download although the lane is green (a download failure, not a red lane)"
          exit 1
      - name: Gideon's pinned commit
        if: steps.dl.outcome == 'success'
        id: gideon
        run: echo "commit=$(sed -n 's/^GIDEON_COMMIT="\(.*\)"$/\1/p' ci/emu_kit.sh)" >> "$GITHUB_OUTPUT"
      - if: steps.dl.outcome == 'success'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ env.CI_TEMP }}/gideon-roms
          key: gideon-roms-${{ steps.gideon.outputs.commit }}
      - name: Kit (the host app's emulator build and the host lane core's .cor)
        if: steps.dl.outcome == 'success'
        shell: bash   # arrays: a container job runs run: under sh (dash) unless a step names bash
        run: |
          set -eu
          roms=()
          [ ! -d "$RUNNER_TEMP/gideon-roms" ] || roms=(--roms "$RUNNER_TEMP/gideon-roms")
          ci/emu_kit.sh "$RUNNER_TEMP/kit" --firmware "$CI_HANDOFF/host/hostapp_emu.elf" --cor "$CI_HANDOFF/deliver/$HOST_EMU_CORE.cor" --core "$HOST_EMU_CORE" ${roms[@]+"${roms[@]}"}
          [ -d "$RUNNER_TEMP/gideon-roms" ] || cp -R "$RUNNER_TEMP/kit/roms" "$RUNNER_TEMP/gideon-roms"
      - name: 12 Emulator tests (tests/hostapp/emu_host.sh - host -> the core's .cor -> menu -> host and the host menu's flows)
        if: steps.dl.outcome == 'success'
        shell: bash
        run: |
          set -eu
          img="$RUNNER_TEMP/emu-img"; mkdir -p "$img"
          cp "$CI_HANDOFF/host/hostapp_emu.elf" "$CI_HANDOFF/deliver/$HOST_EMU_CORE.elf" "$img/"
          rc=0; EMU_OWN_APP="$HOST_EMU_CORE" UE2EMU_KIT="$RUNNER_TEMP/kit" tests/hostapp/emu_host.sh "$img" "$RUNNER_TEMP/emu-out" || rc=$?
          [ "$rc" -eq 0 ] || { echo "LANE RED: host emu: tests/hostapp/emu_host.sh exit $rc (77: nothing ran)"; exit 1; }
      - name: Emulator output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: emu-host
          path: ${{ env.CI_TEMP }}/emu-out
          retention-days: 7
          if-no-files-found: ignore

  # D14: the whole package, 11 (first half): the bitstream entries of every lane and the imports, as the old pipeline's collect (T239.1 D40: kept in GitHub's
  # cache by the run's entry names; D41: only a job that fetches releases waits at the environment bitstreams). Alone on the T239 branch without the imports
  # (CI_IMPORTS=no, ci/lane.sh package names: the builder names their entries with integration's ci/imports.py, T261 review 3.3); beside, with them.
  collect:
    name: "Whole package: 11 collect (every lane's bitstreams)"
    needs: [dispatch, approve]
    if: ${{ !cancelled() && needs.dispatch.result == 'success' && needs.dispatch.outputs.package == 'true' && needs.approve.result != 'failure' && needs.approve.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: bitstreams
    container:
      image: ghcr.io/jondalar/trx64u-build@sha256:706a976b56de400970d5af3bac9358d063c1d87defe6a3630d3ed26c5bae0c08
    timeout-minutes: 60
    env:
      CI_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
      CI_IMPORTS: ${{ inputs.beside && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Container paths and git
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          {
            echo "CI_HANDOFF=$RUNNER_TEMP/handoff"
            echo "CI_RUN_ID=$GITHUB_RUN_ID"
            echo "CI_BIT_CACHE=$RUNNER_TEMP/bit"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/handoff"
      - name: 11 Entry names (every lane's; the imports beside the old pipeline only)
        id: bitnames
        run: |
          ci/lane.sh package names
          echo "key=bits-$(sha256sum "$CI_HANDOFF/entry-names.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ env.CI_TEMP }}/bit
          key: ${{ steps.bitnames.outputs.key }}
          restore-keys: |
            bits-
      - name: 11 Fetch (every entry from the builds repository; the builder built the missing ones on the work order)
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_KEYS: ${{ env.CI_TEMP }}/handoff/entry-names.txt
        run: ci/fetch_bits.sh
      - name: 11 Collect (the host, every partial core, every large core, the imports)
        run: ci/lane.sh package collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: whole-bits
          path: |
            ${{ env.CI_TEMP }}/handoff/bit-*
            ${{ env.CI_TEMP }}/handoff/large-*
          retention-days: 1
          if-no-files-found: error

  # D14: the whole package, 11 (second half) and 13: ci/package.sh over every lane's result - the bitstreams of collect, the SDK lane's shared image, sub-apps and
  # SDK package, the host menu, each core lane's .cor (D13: a core with an app of its own is delivered by its lane). The artifact `package` is the one the old
  # pipeline's update, emu and prerelease read. Beside it this job runs wherever the old pipeline makes a package (scope full: main, integration, integ-*,
  # release/*, v* tags; or a feature branch that asks for the update files), and the old job package does not run there (only on t239.1 and for a pull
  # request, where this file does not run), so the run has one.
  package:
    name: "Whole package: 11 package (every .cor), 13 deliver"
    needs: [dispatch, collect, sdk, host, core]
    if: ${{ !cancelled() && needs.dispatch.result == 'success' && needs.dispatch.outputs.package == 'true' && needs.collect.result == 'success' && needs.sdk.result == 'success' && needs.host.result == 'success' && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jondalar/trx64u-build@sha256:706a976b56de400970d5af3bac9358d063c1d87defe6a3630d3ed26c5bae0c08
    timeout-minutes: 30
    env:
      CI_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Container paths and git
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          {
            echo "CI_HANDOFF=$RUNNER_TEMP/handoff"
            echo "CI_RUN_ID=$GITHUB_RUN_ID"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/handoff"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: whole-bits
          path: ${{ env.CI_TEMP }}/handoff
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: sdk
          path: ${{ env.CI_TEMP }}/handoff/sdk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: shared-app
          path: ${{ env.CI_TEMP }}/handoff/shared-app
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          name: host
          path: ${{ env.CI_TEMP }}/handoff/host
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          pattern: deliver-*
          path: ${{ env.CI_TEMP }}/handoff/lanes
      - name: 11 Package (ci/package.sh over the lanes' results)
        run: ci/lane.sh package package
      - name: 13 Deliver (the artifact package)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: package
          path: ${{ env.CI_WS }}/out
          retention-days: 14
          if-no-files-found: error

  summary:
    name: Result (the matrix)
    needs: [dispatch, approve, lint, sdk, sdk-release, host, sims, bits, core, emu, host-emu, collect, package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Table
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          lines = ["| job | result |", "|---|---|"] + ["| %s | %s |" % (k, v.get("result")) for k, v in needs.items()]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          bad = [k for k, v in needs.items() if v.get("result") in ("failure", "cancelled")]
          if bad:
              sys.exit("red: " + ", ".join(bad))
          PY
