name: Apptests

# T239.1 S6, D12: a job of the matrix (ci/children.txt). Concern: the native tests of our applications, render and file benches when a fundamental file changed (ci/render.sh). Nightly calls it too.
# It checks out the run's commit (the head of a pull request, else github.sha), takes the plan and the hand-over of the jobs before it from their artifacts
# and runs ci/child.sh, which is red at once with its reason. The image is named by digest; the digest is filled from the ci-images run (step 16).
run-name: "apptests @${{ github.event.pull_request.head.sha || github.sha }}"

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  apptests:
    permissions:     # T239.5 D25: the stop step cancels the run
      contents: read
      actions: write
    name: Apptests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jondalar/trx64u-build@sha256:706a976b56de400970d5af3bac9358d063c1d87defe6a3630d3ed26c5bae0c08
    timeout-minutes: 120
    env:
      CI_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
      CI_REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Container paths and git
        # T239.1: in a container job the expressions runner.temp and github.workspace can name the host's paths (a runner feature flag
        # decides), while $RUNNER_TEMP and $GITHUB_WORKSPACE are the container's; every later step names them as env.CI_TEMP and env.CI_WS.
        # The runner's user owns the checkout and git runs as root here, so git refuses it ("dubious ownership") unless the system config
        # trusts it; the system config holds for every later git call, also one under env -i.
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          {
            echo "CI_HANDOFF=$RUNNER_TEMP/handoff"
            echo "CI_RUN_ID=$GITHUB_RUN_ID"
            echo "CI_APPTESTS_OK=$RUNNER_TEMP/ci-cache/apptests-ok"
            echo "CI_RENDER_OK=$RUNNER_TEMP/ci-cache/render-ok"
            echo "CI_TRXAPPS_CACHE=$RUNNER_TEMP/ci-cache/trxapps"
            echo "CONTROLS_CACHE=$RUNNER_TEMP/ci-cache/controls-ok"
            echo "CI_SIMS_OK=$RUNNER_TEMP/ci-cache/sims-ok"
            echo "ROMS_STORE=$RUNNER_TEMP/ci-cache/roms"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CI_BIT_CACHE=$RUNNER_TEMP/bit"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/handoff"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ env.CI_TEMP }}/ci-cache
          key: ci-cache-apptests-${{ github.sha }}
          restore-keys: |
            ci-cache-apptests-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        continue-on-error: true
        with:
          name: plan
          path: ${{ env.CI_TEMP }}/handoff
      - name: Tests
        run: ci/child.sh apptests
      - name: The first red job ends the run (T239.5 D25)
        if: ${{ failure() && github.workflow == 'Pipeline' }}     # the nightly and sims-long runs go on to the end
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel
        run: >-
          python3 -c "import os, urllib.request as u; r = u.Request(os.environ['RUN_URL'], method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'});
          print('cancel the run:', u.urlopen(r).status)" || echo "cancel the run: refused (a fork's token cannot)"
