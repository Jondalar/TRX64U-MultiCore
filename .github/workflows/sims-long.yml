name: Sims (long)

# The benches of tier 3 in ci/sims.txt: too long for the pipeline (the Atari disk benches, 46-65 min each on the Mac). On demand only - no push, no schedule
# (Alex, 2026-10-17, translated: out of the pipeline, on demand only). Start it before an Atari release. One leg per bench (a hosted job stops after 6 h); the
# per-bench PASS markers of the cache skip a bench whose sources did not change since the last PASS.
# D9: workflow_dispatch needs this file on the default branch, which has no workflows until the switch. Until then a push to a branch scratch/sims-long/<name>
# whose head commit says [sims-long] runs every tier-3 bench; the marker, the branch pattern and the push trigger go at the switch.
on:
  workflow_dispatch:
    inputs:
      benches:
        description: 'Bench names, space separated; empty = every tier-3 bench'
        type: string
        default: ''
      force:
        description: 'Run even where a PASS for the same sources exists'
        type: boolean
        default: false
  push:
    branches: ['scratch/sims-long/**']

permissions:
  contents: read

concurrency:
  group: sims-long-${{ github.ref }}
  cancel-in-progress: false

jobs:
  list:
    name: Tier-3 benches
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[sims-long]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      benches: ${{ steps.list.outputs.benches }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false
      - id: list
        env:
          BENCHES: ${{ github.event.inputs.benches }}
        run: |
          set -eu
          names="${BENCHES:-$(awk -F'|' '$1 == 3 { print $2 }' ci/sims.txt | tr '\n' ' ')}"
          [ -n "${names// }" ] || { echo "no tier-3 bench in ci/sims.txt"; exit 1; }
          echo "benches=$(python3 -I -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' "$names")" >> "$GITHUB_OUTPUT"
  bench:
    name: Bench ${{ matrix.bench }}
    needs: list
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        bench: ${{ fromJSON(needs.list.outputs.benches) }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jondalar/trx64u-sim@sha256:3e366a085f3ff5bfec33b5fa08359a625034038803b8b89f3406691683a625e0
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false
      - name: Container paths and git
        # T239.1: in a container job the expressions runner.temp and github.workspace can name the host's paths (a runner feature flag
        # decides), while $RUNNER_TEMP and $GITHUB_WORKSPACE are the container's; every later step names them as env.CI_TEMP and env.CI_WS.
        # The runner's user owns the checkout and git runs as root here, so git refuses it ("dubious ownership") unless the system config
        # trusts it; the system config holds for every later git call, also one under env -i.
        run: |
          git config --system --add safe.directory '*'
          echo "CI_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CI_WS=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Environment
        run: |
          {
            echo "CI_SIMS_OK=$RUNNER_TEMP/ci-cache/sims-ok"
            echo "ROMS_STORE=$RUNNER_TEMP/ci-cache/roms"
          } >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684   # v4.2.3
        with:
          path: ${{ env.CI_TEMP }}/ci-cache
          key: ci-cache-sim-${{ github.sha }}
          restore-keys: |
            ci-cache-sim-
      - name: Check the simulator
        # The Atari disk benches link C++ into the simulation (VHPIDIRECT, ghdl -m -Wl,...): that needs GHDL with the llvm or gcc code generator. An mcode
        # GHDL cannot link and would fail after the long import.
        run: |
          ghdl --version | head -3
          if ghdl --version | grep -qi mcode; then echo "GHDL here is mcode: it cannot link the benches' C++ (VHPIDIRECT)"; exit 1; fi
      - name: Run the bench
        env:
          BENCH: ${{ matrix.bench }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -eu
          ci/sims.sh -t 3 -j 1 $([ "$FORCE" = true ] && echo -f) "$BENCH"
