name: Feature request
description: Something the cores or the host should be able to do.
labels: ["enhancement"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - host - boot menu or host application
        - a core (name it below)
        - all cores
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What for
      description: What you want to do with it, in your words.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it should behave
      description: Keys, menus, what you see. A photo or a reference to another system helps.
    validations:
      required: true
