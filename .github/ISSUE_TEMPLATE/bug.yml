name: Bug report
description: Something does not work on the board. Every field marked required has to be filled in.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. A report we can reproduce gets fixed; a report without release, steps and photos usually
        cannot be checked. Never attach ROMs or disk images, only their names and where they came from.
  - type: input
    id: release
    attributes:
      label: Release
      description: The release or pre-release name from the GitHub release page.
      placeholder: trx64mc-main-922deb78
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: Board
      options:
        - C64 Ultimate (C64U)
        - Ultimate 64 Elite II
    validations:
      required: true
  - type: dropdown
    id: core
    attributes:
      label: Area
      description: >-
        Only the host, the official firmwares, the generic core application and TRX64 are supported (CONTRIBUTING.md).
        For other cores use Discussions.
      options:
        - host - boot menu, host application, update, core folders
        - firmware - an official firmware (.cfw) does not start from the host
        - coreapp - generic core application (menus, media, settings, saves)
        - trx64u - C64 with the TRX64 application (start from the host)
        - trx64g - C64 with the Ultimate application (start from the host)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: From switching on, what you did, one step per line (menus, keys, files).
      placeholder: |
        1. Switch on holding C=, the boot menu shows
        2. Choose trx64u, it starts
        3. ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: media
    attributes:
      label: Images used
      description: File names and where they came from (site, collection, version). Never the file itself.
      placeholder: Turrican.adf from the TOSEC set 2023-01, or "none"
    validations:
      required: true
  - type: textarea
    id: photos
    attributes:
      label: Photos or video of the screen
      description: Drag the photos or a short video in here. Show the fault and the menu settings.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report and configuration files
      description: |
        Attach the bug report file of the host application (F8, "Bug report": /SD/report/<date>.txt, or http://<board>/v1/report)
        once your release has it. Until then attach the core's configuration /SD/cores/<core>.cfg.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
