# The map of the cartridge page of trx_io (coreapp/cores/c64_regs.h C64_CART_*, used by coreapp/cores/c64_cart.cc): offsets are bytes from the block's address
# (the block of that register range, D34). The descriptor at +0x40 is a run of 43 byte registers (trx_io.v: off 0x040 .. 0x06A), the property "desc"; the block is at least 0x6B bytes.
