# The ICAP loader block of the host (host/ultimate_sys.vhd, region r_icap: 0x060600 .. 0x0606FF; the block is the bytes +0x00 .. +0x1B of it). Offsets are bytes from the block's address.
# id reads 0x7A. data takes the bitstream bytes while enable is 1 (four bytes make one word); count0 .. count3 are the word counter, little endian,
# cleared when enable rises. The partition's decouple and the expansion port's release are the block "partition" (partition.map.toml), not this one.
map = "icap"

[[property]]
name = "id"
offset = 0x00
width = 8
dir = "r"
  [[property.state]]
  name = "loader"
  value = 0x7A

[[property]]
name = "data"
offset = 0x10
width = 8
dir = "w"

[[property]]
name = "enable"
offset = 0x14
width = 8
dir = "rw"
  [[property.field]]
  name = "on"
  shift = 0
  bits = 1
    [[property.field.state]]
    name = "off"
    value = 0
    [[property.field.state]]
    name = "on"
    value = 1

[[property]]
name = "count0"
offset = 0x18
width = 8
dir = "r"

[[property]]
name = "count1"
offset = 0x19
width = 8
dir = "r"

[[property]]
name = "count2"
offset = 0x1A
width = 8
dir = "r"

[[property]]
name = "count3"
offset = 0x1B
width = 8
dir = "r"
