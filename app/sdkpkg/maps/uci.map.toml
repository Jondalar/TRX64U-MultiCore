# The command interface block (trx64u_ops.cc CMD_IF_SLOT_BASE_REG, CMD_IF_SLOT_ENABLE_REG: CMD_IF_BASE + 0 and + 1). Offsets are bytes from the block's address.
map = "uci"

[[property]]
name = "slot_base"
offset = 0x00
width = 8
dir = "w"

[[property]]
name = "slot_enable"
offset = 0x01
width = 8
dir = "w"
  [[property.state]]
  name = "off"
  value = 0
  [[property.state]]
  name = "on"
  value = 1
