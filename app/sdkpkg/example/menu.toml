# The menu record of the example library: a tab with one button, and an action on files that end in .txt.
# The operation names are the ones example.cc declares.
[[tab]]
area = "F5"
id = "example"
name = "Example"
widget = "nodes"

[[node]]
anchor = "F5/example"
kind = "op"
label = "Greet"
op = "example.greet"
bind = [ { arg = "name", str = "world" } ]
order = 1

[[node]]
anchor = "F5/example"
kind = "state"
label = "Version"
state = "example.version"
order = 2

[[file_action]]
ext = [".txt"]
label = "Greet by file"
op = "example.greet"
bind = [ { arg = "name", str = "file" } ]
