# TOML B of the example core's app (T239.3 D31, S17): what its app is linked with, and how large its registry, contributions, report and record may be. Its TOML A is
# ../gateware/example.toml (the core's own block example_ctl and the base's blocks), its description record is desc.toml beside this file. `python3 tools/app_build.py build --sdk . --toml-a
# example/gateware/example.toml --maps example/gateware --toml-b example/app/toml_b.toml --out OUT --src example/app --record OUT/desc.bin` links it (tools/sdk_check.sh does this with the compiler
# of the build image).
#
# The core is described by its record (D17): no descriptor symbol is named in [app], the table of cores of the image is empty and the start makes the descriptor from the record of the
# bundle. The core's code is its library: `hooks = "example"` of desc.toml names the library of this file (`[[library]] example` below: ../example.cc, linked into the app) that exports the core hooks.
# `base_sources` names files of the base's coreapp/cores/ that the image links (none here: the base's run.cc names no core's code).
[app]
name = "example"

# Every key is optional (python3 tools/app_build.py table lists them with the defaults). A small core is sized small: the report buffer is a static array of this size in its image.
[sizes]
ops = 200
states = 160
report_bytes = 16384
contrib_filetypes = 40
rec_ftypes = 8

# The shared libraries the app is linked with (the package's libs/shared.toml is the catalog; a library of a core's own is listed here with its own sources). A core that
# needs no program loader links none of them: an app linked without a library has none of its code.
[[library]]
name = "cbmprg"
sources = ["cbm_prg.cc", "cbmprg_exports.cc"]
headers = ["cbm_prg.h", "cbmprg_api.h"]
bind = "cbmprg_bind"
exports = [{ name = "cbmprg", major = 1, table = "cbmprg_table" }]

# The core's own code (T239.3 D58, base 4.0: the base loads no library file, so the code of a core is linked into its app). A register library: the base calls example_register(const LibApi *,
# LibRecord *) at start and takes the operations, the states and the export corehooks from the record, as it took them from a loaded file; `menu` is its menu record. The sources are in ../, found
# through `--src .` of the makefile.
[[library]]
name = "example"
sources = ["example.cc", "greet.cc"]
headers = ["greet.h"]
register = "example_register"
menu = "../menu.toml"
exports = [{ name = "corehooks", major = 1 }]
heap_keep = 0
heap_peak = 0
