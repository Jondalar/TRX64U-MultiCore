# The description of the example core (T239.3 D32, P3-2): its identity and its menu, one file. `bin/menusim --desc app/desc.toml` shows the menu at once and shows it again when
# the file changes (Cmd+R); `tools/cor_pack.py pack ... --desc app/desc.toml` puts the compiled record into the .cor. The tab, the group and the order of a row are its place in this file.
[core]
id = "EXMP"
name = "Example"
title = "Example core"
short_title = "EXMP"
folder = "example"
store = "Example Settings"
min_contract = 1
reset_ms = 20

[[area]]
key = "F1"
name = "Example"
  [[area.tab]]
  id = "example"
  name = "Example"
  widget = "info"
  n = 1
