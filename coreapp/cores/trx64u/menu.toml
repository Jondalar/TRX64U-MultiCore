# The menu of TRX64U (T104.2 D10, T228): the areas, tabs and everything in them. C++ supplies only the operations, the state values and the settings store the names
# below refer to. tools/descrec.py compiles this file (and checks every name and binding against what the application exports,
# tests/coreapp/golden/ops_trx64u.txt); the packer puts the result into the .cor as record 6, and coreapp/cores/trx64u/menu_rec.inc carries the same bytes
# for a start without a .cor (JTAG, ue2emu). Regenerate it with `tools/gen_menu_rec.py`; the lint stage compares.
#
# T228 (Restart 2026-11-17): the structure is the generic core menu of T212 alone (F1 Home, F3 Library, F5 machine, F7 APP, F8 System); no F2 and no F4
# area (R1). R2: no "Reboot, clear memory" (F8's generic "Restart core"), no "Pause / resume"; R3: no "Save C64 memory" and no "Save REU memory". R9: F5 has
# the core's tabs C64, TRX and Expansion with headings, then Video, Audio (R5: "SID sockets" and "Emulated SIDs" are two rows under the heading reDIP:SID at its
# end, each opens a page), Input. F7 is one tab of sections (T212 D12) with the apps last under their heading "Apps" (a group node); Softboot is hidden
# under the MultiCore host (DC1: `hide`, read by a flat list when the menu is built). R6: F8 is the one generic System tab; under its Network heading
# three rows open the pages Network settings, Streams and FTP hosts. R7: the Ultimate's device settings (power, wake on Wi-Fi, LEDs, colour scheme) are
# in no tab (group "hidden": the stored values still apply); R8: no diagnostics rows (the generic Bug report).
# Drive A and the cartridge port are media slots whose rows open the drive list (T212 D5); the generic items (Persist mounts, Enter home, Menu opens at, Home
# directory, hotkeys, Picture, Scale; no Tone: the core sets no_tone) are the application's own and not declared here. A settings tab with `ui = { sections = true }` shows each of its groups under a heading made of the
# group's id ('_' is a space; not drawn when it repeats the tab's title). Nothing is saved to flash: every setting is written to the core's .cfg at once (D9-D11).

# the machine line of F1 (T212 D13/D15): the values of these settings
machine_info = "System Mode,REU Size"

[[area]]
key = "F1"
name = "Home"
  [[area.tab]]
  id = "home"
  name = "Home"
  widget = "info"
  n = 1
  # R1: the two overlays over the machine are pages of Home (no number, not on the strip): the rows "Timewarp..." and "Monitor..." under the reset rows and
  # their hotkeys (F7 > Hotkeys) open them (the tasks below, menu.screen). Both screens are drawn and keyed as before (layouts timeline and terminal).
  [[area.tab]]
  id = "timewarp"
  name = "Timewarp"
  widget = "nodes"
  layout = "timeline"
  ui = { page = "home", pos = "@tw.pos", info = "@tw.info", glyph = "@tw.glyph", track = "@tw.track", hint = "RETURN jump  <- cancel" }
  [[area.tab]]
  id = "monitor"
  name = "Monitor"
  widget = "nodes"
  layout = "terminal"
  ui = { page = "home" }

[[area]]
key = "F3"
name = "Library"
  [[area.tab]]
  id = "browse"
  name = "Browse"
  widget = "browser"
  layout = "library"
  ui = { title = "Library", sheet = "Drive A|@drive.drive_a.mode", sheetx = ".crt|Port|@c64.cartridge|No cartridge", marks = "A=drive.drive_a.path,C=c64.cartridge_path,P=c64.program_path" }
  n = 1
  [[area.tab]]
  id = "search"
  name = "Search"
  widget = "browser"
  layout = "library"
  ui = { title = "Search" }
  n = 2
  [[area.tab]]
  id = "online"
  name = "Online"
  widget = "nodes"
  layout = "split"
  ui = { title = "Assembly64 and CommoServe", side = "Search" }
  n = 3

[[area]]
key = "F5"                       # the core's short title ("C64") names it
  [[area.tab]]                    # R9: the core's tabs C64, TRX and Expansion (T205 D1 had one), then Video, Audio, Input as every core
  id = "machine"
  name = "C64"
  widget = "settings"
  groups = ["Machine", "Drive_A", "Drive_extras", "Hardware"]
  ui = { sections = true }
  n = 1
  [[area.tab]]                    # Recording stands last: a node lands at the end of its tab, so Save frame and Save the ring stay in their section
  id = "trx"
  name = "TRX"
  widget = "settings"
  groups = ["TRX64", "Recording"]
  ui = { sections = true }
  n = 2
  [[area.tab]]
  id = "expansion"
  name = "Expansion"
  widget = "settings"
  groups = ["Cartridge", "REU", "Ultimate"]
  ui = { sections = true }
  n = 3
  [[area.tab]]                    # D14: section Picture = System mode, then the generic Picture/Scale rows (routed rows follow the first block), section Output
  id = "video"
  name = "Video"
  widget = "settings"
  groups = ["Picture", "Output"]
  ui = { sections = true }
  n = 4
  [[area.tab]]                    # no generic volume (the core has its own mixer, own_volume); R5: the SID sockets and the emulated SIDs are two rows under a heading of their own
  id = "audio"
  name = "Audio"
  widget = "settings"
  groups = ["Volumes", "Pan", "Speaker", "SID_player_behavior", "SID_sockets", "Emulated_SIDs", "Socket_1_FPGASID","Socket_1_SwinSID","Socket_1_ARMSID","Socket_1_PDsid","Socket_1_SidKick","Socket_2_FPGASID","Socket_2_SwinSID","Socket_2_ARMSID","Socket_2_PDsid","Socket_2_SidKick"]
  ui = { sections = true, pages = "SID_sockets,Emulated_SIDs,Socket_1_FPGASID,Socket_1_SwinSID,Socket_1_ARMSID,Socket_1_PDsid,Socket_1_SidKick,Socket_2_FPGASID,Socket_2_SwinSID,Socket_2_ARMSID,Socket_2_PDsid,Socket_2_SidKick", pages_head = "reDIP:SID" }
  n = 5
  [[area.tab]]
  id = "input"
  name = "Input"
  widget = "settings"
  groups = ["input"]
  n = 6

[[area]]
key = "F7"
name = "APP"
  [[area.tab]]                    # T212 D12: one tab, its sections shown directly; the apps (nodes) stand last, under no heading of their own
  id = "settings"
  name = "Settings"
  widget = "settings"
  groups = ["app", "Application"]
  ui = { sections = true }
  n = 1

[[area]]
key = "F8"
name = "System"
  [[area.tab]]                    # the generic System tab (R6: the only one); its groups are pages, their rows stand under its Network heading after WiFi
  id = "expert"
  name = "System"
  widget = "system"
  groups = ["Ethernet", "WiFi", "Services", "Time_synchronization", "Streams", "FTP_hosts"]
  ui = { pages = "Network_settings=Ethernet+WiFi+Services+Time_synchronization,Streams,FTP_hosts" }
  n = 1

