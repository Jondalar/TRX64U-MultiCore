# T228 R10 (Alex 2026-11-17): a USB pad or controller as a joystick in port 1 or 2, through the generic pad service (coreapp/src/pad.h) as the Amiga's port 2
# (T225): one port, fed by the first pad plugged, its button map kept per pad (VID:PID) in the .cfg. The pad's lines are the host's own (C64_JOY1/2_SWOUT),
# OR-ed with the physical ports, so the joysticks keep working. R20: no "Joystick input" row and no J hotkey - the bitstream has only the normal port mapping (no swap, no WASD). [pad] and [poll] declare it; the task opens the dialog
# (a task of a settings tab stands after its settings: this setting is the group's last, so that the two rows stay together).
[[core_setting]]
group = "input"
key = "USB Controller Port"
label = "USB controller as joystick"
values = ["Port 1", "Port 2"]
default = 1
when = "live"
apply = "pad.port"

[[core_setting]]
group = "Application"
key = "Overlay Transparency"
label = "Overlay transparency"
list = "alpha"
default = 1
when = "live"
apply = "ui.fx"

