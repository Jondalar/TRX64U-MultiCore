[[task]]
group = "top"
label = "Reset"
op = "machine.cold_reset"
closes_menu = true


[[task]]
group = "top"
label = "Reload ROMs, reset"
op = "machine.reload_roms"
closes_menu = true


# R1: the rows under the reset rows that open the two overlays (the pages of Home above), and their hotkeys: the modifier + T, the modifier + O (as the
# trx64g build's C= O opens the monitor); F7 > Hotkeys changes them.
[[task]]
group = "top"
label = "Timewarp..."
op = "menu.screen"
bind = [ { arg = "screen", str = "F1/timewarp" }, { arg = "unless", str = "ring.reu_off" } ]
hotkey = "T"


[[task]]
group = "top"
label = "Monitor..."
op = "menu.screen"
bind = [ { arg = "screen", str = "F1/monitor" }, { arg = "unless", str = "" } ]
hotkey = "O"


# R21 #13 (FW apps/c64re/manifest.json, category "C64 Machine"): the machine as it stands as a .c64re, no ring needed
[[task]]
group = "top"
label = "Save .C64RE dump"
op = "machine.save_c64re"
bind = [ { arg = "name", text = true } ]
ask = "Name of the dump"
ask_state = "machine.suggest.c64re"

# T228 R21 (#4): "Save MP3 Drv A-D" - FW c64_subsys.cc:425-455 (category "C64 Machine"): the GEOS RAM drives in the REU as a file; a row is there only while a drive of that letter is in the REU
[[task]]
group = "top"
label = "Save MP3 drv A"
op = "machine.save_mp3"
bind = [ { arg = "drive", int = 0 }, { arg = "name", text = true } ]
ask = "Name of the RAM disk image"
show_state = "reu.mp3.a"

[[task]]
group = "top"
label = "Save MP3 drv B"
op = "machine.save_mp3"
bind = [ { arg = "drive", int = 1 }, { arg = "name", text = true } ]
ask = "Name of the RAM disk image"
show_state = "reu.mp3.b"

[[task]]
group = "top"
label = "Save MP3 drv C"
op = "machine.save_mp3"
bind = [ { arg = "drive", int = 2 }, { arg = "name", text = true } ]
ask = "Name of the RAM disk image"
show_state = "reu.mp3.c"

[[task]]
group = "top"
label = "Save MP3 drv D"
op = "machine.save_mp3"
bind = [ { arg = "drive", int = 3 }, { arg = "name", text = true } ]
ask = "Name of the RAM disk image"
show_state = "reu.mp3.d"

