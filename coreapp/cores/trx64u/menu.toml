# ---- file types --------------------------------------------------------------------------------------------------------------------------------------
[[filetype]]
ext = ".prg"
  [[filetype.action]]
  label = "Run PRG"
  key = "R"
  op = "c64.run_prg"
  bind = [ { arg = "path", file = true } ]
  closes_menu = true
  [[filetype.action]]
  label = "Load PRG and start from"
  key = "L"
  op = "c64.load_prg"
  bind = [ { arg = "path", file = true }, { arg = "start", ask = true } ]
  closes_menu = true
  ask = "Start address"
  [[filetype.action]]
  label = "DMA (load, do not run)"
  key = "A"
  op = "c64.dma_prg"
  bind = [ { arg = "path", file = true } ]

[[filetype]]
ext = ".p00"
  [[filetype.action]]
  label = "Run PRG"
  key = "R"
  op = "c64.run_prg"
  bind = [ { arg = "path", file = true } ]
  closes_menu = true
  [[filetype.action]]
  label = "Load PRG and start from"
  key = "L"
  op = "c64.load_prg"
  bind = [ { arg = "path", file = true }, { arg = "start", ask = true } ]
  closes_menu = true
  ask = "Start address"
  ask_off = 26                   # the 0x1A bytes of a .P00 header come before the load address
  [[filetype.action]]
  label = "DMA (load, do not run)"
  key = "A"
  op = "c64.dma_prg"
  bind = [ { arg = "path", file = true } ]

