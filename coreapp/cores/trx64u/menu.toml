ext = ".c64re"
  [[filetype.action]]
  label = "Load Timewarp state"
  key = "L"
  op = "tw.load"
  bind = [ { arg = "path", file = true } ]
  closes_menu = true

# ---- settings ----------------------------------------------------------------------------------------------------------------------------------------
# GATE_CTRL b0 (trx_sys.v): with it the app's C64_STOP pauses the whole machine - the picture stands still under our menu - without it only the CPU.
[[core_setting]]
group = "trx64"
key = "Freeze mode"
values = ["Whole machine", "CPU only"]
default = 0
when = "reset"
apply = "c64.set_freeze_mode"

# The names and the defaults of the drive are Gideon's (c1541.cc): drive on, bus ID 8, no extra RAM, 100 ms swap delay.
[[core_setting]]
group = "drives"
key = "Drive"
label = "Drive enable"
values = ["Disabled", "Enabled"]
default = 1
apply = "drive.set_power"

[[core_setting]]
group = "drives"
key = "Drive Bus ID"
label = "Drive bus ID"
values = ["8", "9", "10", "11"]
default = 0
apply = "drive.set_bus_id"

[[core_setting]]
group = "drives"
key = "Disk swap delay"
values = ["100 ms", "200 ms", "300 ms", "400 ms", "500 ms", "600 ms", "700 ms", "800 ms", "900 ms", "1000 ms"]
default = 0
apply = "drive.set_swap_delay"

# T180 D2: "Persist medium mounts" (coreapp/src/mediamounts.cc): the disk in Drive A and the cartridge in the port are mounted again at the next start. The Drive A page (F5) lists the group (T187 D7).
[[core_setting]]
group = "drives"
key = "Persist medium mounts"
list = "yes_no"
default = 0
when = "live"
apply = "media.persist_apply"

