[pad]                              # T228 R10: the USB controller as a joystick (the setting "USB Controller Port" picks port 1 or 2, pad.port)
output = "joystick"
per_pad = true
buttons = ["Up", "Down", "Left", "Right", "Fire"]
default = ["up", "down", "left", "right", "face_bottom"]

[restart]                          # T228 R17: F8 "Restart core" starts the C64 with its 64 KiB cleared, as Gideon's "Reboot (Clr Mem)" did; memory-only, so
clear_ram = 65536                  # $D000-$DFFF is RAM and not the chips
ram_only = true

[poll]                             # the pad's lines every 16 ms (no poll while the menu holds the machine)
op = "pad.poll"
period_ms = 16

