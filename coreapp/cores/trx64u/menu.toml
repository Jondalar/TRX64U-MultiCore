# The menu of TRX64U (T104.2 D10): areas, tabs and everything in them. C++ supplies only the operations, the state values and the settings store the names
# below refer to. tools/descrec.py compiles this file (and checks every name and binding against what the application exports,
# tests/coreapp/golden/ops_trx64u.txt); the packer puts the result into the .cor as record 6, and coreapp/cores/trx64u/menu_rec.inc carries the same bytes
# for a start without a .cor (JTAG, ue2emu). Regenerate it with `tools/gen_menu_rec.py`; the lint stage compares.
#
# The structure is the UX concept's (TRX64-Ultimate docs/lvgl_ui_project: NAVIGATION.md, components/app_shell.xml) as T104.2 section 5 decides it (P4): F1 Home,
# F3 Library, F5 C64, F7 Actions and F2 Timewarp, F4 Tools, F6 Settings, F8 System. The tab numbers of an area are consecutive, 1 .. n in the order written here (they
# replace the concept's published numbers: no gaps, no number a tab does not carry). A tab whose function does not exist is not listed, so it is not shown; an area
# without a tab is not on the rail.

# How a tab is drawn (T104.2 D10, the UX concept's screens): `layout` = desk | split | settings | status | library | timeline | terminal, `ui` its parameters (crumb, title, side, chip);
# the nodes put into a tab name their place by the group of their anchor ("F1/home/head"), and `ui` says how one is shown (coreapp/src/screens.h).
# A function that does not exist here is not drawn (hidden); one that cannot work now is drawn greyed with its reason (`off`).

[[area]]
key = "F1"
name = "Home"
  [[area.tab]]
  id = "home"
  name = "Home"
  widget = "nodes"
  layout = "desk"
  n = 1

[[area]]
key = "F2"
name = "Timewarp"
shifted = true
  [[area.tab]]
  id = "timeline"
  name = "Timeline"
  widget = "nodes"
  layout = "timeline"
  ui = { pos = "@tw.pos", info = "@tw.info", glyph = "@tw.glyph", track = "@tw.track", hint = "RETURN jump  <- cancel" }
  n = 1

[[area]]
key = "F3"
name = "Library"
  [[area.tab]]
  id = "browse"
  name = "Browse"
  widget = "browser"
  layout = "library"
  ui = { title = "Library", sheet = "Drive A|@drive.drive_a.mode", sheetx = ".crt|Port|@c64.cartridge|No cartridge", marks = "A=drive.drive_a.path,C=c64.cartridge_path,P=c64.program_path" }
  n = 1
  [[area.tab]]
  id = "search"
  name = "Search"
  widget = "browser"
  layout = "library"
  ui = { title = "Search" }
  n = 2
  [[area.tab]]
  id = "online"
  name = "Online"
  widget = "nodes"
  layout = "split"
  ui = { title = "Assembly64 and CommoServe", side = "Search" }
  n = 3

[[area]]
key = "F4"
name = "Tools"
shifted = true
  [[area.tab]]
  id = "monitor"
  name = "Monitor"
  widget = "nodes"
  layout = "terminal"
  n = 1
  [[area.tab]]
  id = "diagnostics"
  name = "Diagnostics"
  widget = "nodes"
  layout = "split"
  ui = { title = "Diagnostics", side = "Now" }
  n = 2

[[area]]
key = "F5"                       # the core's short title ("C64") names it
  [[area.tab]]
  id = "drives"
  name = "Drive A"
  widget = "settings"
  groups = ["drives", "more"]
  layout = "split"
  ui = { title = "Drive A", side = "Disk in drive A" }
  n = 1
  [[area.tab]]
  id = "machine"
  name = "Machine"
  widget = "settings"
  groups = ["machine"]
  layout = "split"
  ui = { title = "Machine", side = "Machine now" }
  n = 2
  [[area.tab]]
  id = "io"
  name = "I/O"
  widget = "settings"
  groups = ["io"]
  layout = "split"
  ui = { title = "Memory and I/O", side = "Expansion port" }
  n = 3
  # T180 D5: the media sets (Save media set..., Load media set...): the rows the media tab of every other core has; the C64's media are Drive A and the cartridge port
  [[area.tab]]
  id = "mediasets"
  name = "Media sets"
  widget = "media"
  layout = "settings"
  ui = { title = "Media sets" }
  n = 4

[[area]]
key = "F7"
name = "Actions"
  [[area.tab]]
  id = "quick"
  name = "Quick"
  widget = "nodes"
  layout = "split"
  ui = { title = "Do the next thing" }
  n = 1
  [[area.tab]]
  id = "more"
  name = "More"
  widget = "tasks"
  groups = ["c64", "files"]
  layout = "split"
  ui = { title = "More actions", nodes_first = true }
  n = 2

[[area]]
key = "F6"
name = "Settings"
shifted = true
  [[area.tab]]
  id = "trx64"
  name = "TRX64"
  widget = "settings"
  groups = ["trx64"]
  layout = "settings"
  ui = { title = "TRX64 behavior" }
  n = 1
  [[area.tab]]
  id = "video"
  name = "Video"
  widget = "settings"
  groups = ["video", "video_hardware"]
  layout = "settings"
  ui = { title = "Video" }
  n = 2
  [[area.tab]]
  id = "audio"
  name = "Audio"
  widget = "settings"
  groups = ["mixer", "sid_sockets", "ultisid"]
  layout = "settings"
  ui = { title = "Audio and SID" }
  n = 3
  [[area.tab]]
  id = "input"
  name = "Input"
  widget = "settings"
  groups = ["input"]
  layout = "settings"
  ui = { title = "Controllers" }
  n = 4
  [[area.tab]]
  id = "network"
  name = "Network"
  widget = "settings"
  groups = ["ethernet", "network", "time", "streams", "ftp"]
  layout = "settings"
  ui = { title = "Network" }
  n = 5

[[area]]
key = "F8"
name = "System"
shifted = true
  [[area.tab]]
  id = "status"
  name = "Status"
  widget = "nodes"
  layout = "split"
  ui = { title = "System" }
  n = 1
  [[area.tab]]
  id = "expert"
  name = "Expert"
  widget = "settings"
  groups = ["expert", "system"]
  layout = "settings"
  ui = { title = "Expert settings" }
  n = 2

