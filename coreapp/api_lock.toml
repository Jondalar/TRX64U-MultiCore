# The lock of the base API (T239.3 S5, tools/sdk_api.py): for every version of the base API (U2A_ABI_MAJOR.U2A_BASE_MINOR in coreapp/src/libfmt.h),
# the hash of the public headers the SDK ships, comments and white space taken out. The lint is red when the version has no lock, and, for a released
# version, when the headers differ from its lock. A new version appends one entry (python3 tools/sdk_api.py lock) and never edits a released one.
#
# One base minor per SDK release, not one per change (coordinator, 2026-11-22): `released = true` says an SDK release carries this version, and its hash is
# fixed from then on. `released = false` is the version the next release will carry: what is added before it stays under it, and `python3 tools/sdk_api.py update`
# brings its hash along. Only the newest entry can be unreleased. Release: update once, set released = true, and the next addition raises the minor.
#
#   minor: an addition a library built before it can ignore: a new call table at the end of LibApi, a new function at the end of a call table
#          (every table carries its size), a new value of an enum, a new member at the end of LibRecord that is zero in a library built before it
#   major: anything else, a change of LibRecord, of a Lib*Decl or of the file format included: libload.cc compares the size of the record and the
#          ABI major of the file, and refuses a library built against another one
#
# 3.1 (T197): api->lib, the call tables libraries export
[[lock]]
version = "3.1"
released = true
headers = "48d9d26a0b188a1b438ce10612a4eaaf0ffff1f4bb4aca87b796648ea3856db9"
