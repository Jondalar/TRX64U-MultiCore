# The lock of the base API (T239.3 S5, tools/sdk_api.py): for every version of the base API (U2A_ABI_MAJOR.U2A_BASE_MINOR in coreapp/src/libfmt.h),
# the hash of the public headers the SDK ships, comments and white space taken out. The lint is red when the headers differ from the newest lock
# under the same version, and when the version has no lock. A new version appends one entry (python3 tools/sdk_api.py lock) and never edits an old one.
#
#   minor: an addition a library built before it can ignore: a new call table at the end of LibApi, a new function at the end of a call table
#          (every table carries its size), a new value of an enum
#   major: anything else, a change of LibRecord, of a Lib*Decl or of the file format included: libload.cc compares the size of the record and the
#          ABI major of the file, and refuses a library built against another one
#
# 3.1 (T197): api->lib, the call tables libraries export
[[lock]]
version = "3.1"
headers = "48d9d26a0b188a1b438ce10612a4eaaf0ffff1f4bb4aca87b796648ea3856db9"
#
# 3.2 (T239.3 S3): the base serves the poll of a library that loads after the core has started (the headers differ in U2A_BASE_MINOR and comments only)
[[lock]]
version = "3.2"
headers = "1127a2f68032d18a2aec750a817a95df46574485f0966d6ab96a98291ff57df4"
#
# 3.3 (T239.3 S13, S14): the budget record of a file (libfmt.h U2a3Budget with a permanent and a peak heap figure, U2A3_FLAG_BUDGET, U2A3_BUDGET_NONE), refusals with LIB_BUDGET,
# and the account of an image that includes what its operations take from api->mem (the registry runs a handler under OpScope, per task). 3.3 is on this branch only: its
# entry follows the headers until the version is released, which an entry of a released version never does.
[[lock]]
version = "3.3"
headers = "b9c7baf668cf3090d18f48119133125f3714465b47e992d001d00ad65d58e112"
