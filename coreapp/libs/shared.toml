# TOML B of the shared app (T239.3 D31, P3-1): the libraries the app is linked with. A library is a set of sources, the headers that name its functions, and the entries it hands the
# generic application; tools/libtab.py turns this file into the library table (libtab_table.cc), the export slots (g_libslot, libslots.h) and the list of sources the build compiles, and
# checks that no generic source names a library. An app linked without a library has none of its code. Entries (each a function, see libtab.h):
#   bind          the library's context, once, when the loader is made            register_ops   its operation groups, for a core described by its record (capability: a name or a list of names, only for a core that names one of them)
#   init          once the board is known                                         start          once the network settings are pushed
#   freeze_request  the library asks for the menu (read by the service loop)      core   the core's description is known (the library takes what it needs from it)
#   register      a library from outside this repository: `int fn(const LibApi *, LibRecord *)`, called at start (base 4.0, libload.h LibLoader::link); menu: its menu record
# `exports` (base 4.0, libslot.h) lists the tables a library exports, { name, major, table }: `table` is the library's `const void *fn(void)`; linked code takes a table with
# lib_slot(LIBSLOT_<name>), a sub-app with its needs entry, the generic code by name (libtab_export). `needs` names the libraries this one calls; the build refuses a library whose need
# is not in the file, and a source that takes the slot of a library its needs do not list. `sources` and `headers` are file names, found in coreapp/src, coreapp/cores, app/loaders,
# app/lib/cbm1541, apps/miniz or apps/miniz/src.

[app]
name = "shared"

[[library]]
name = "c64cart"
sources = ["c64_cart.cc", "c64cart_exports.cc"]
headers = ["c64_cart.h", "c64_cart_desc.h", "c64cart_api.h"]
bind = "c64cart_bind"
core = "c64cart_lib_core"
exports = [{ name = "c64cart", major = 1, table = "c64cart_table" }]

[[library]]
name = "cbm1541"
sources = ["cbm1541.cc", "d1541_drive.cc", "d1541_gcr.cc", "d1541_wd.cc", "cbm1541_exports.cc"]
headers = ["cbm1541.h", "cbm1541_desc.h", "cbm1541_api.h", "d1541_drive.h", "d1541_gcr.h", "d1541_wd.h"]
bind = "cbm1541_bind"
exports = [{ name = "cbm1541", major = 1, table = "cbm1541_table" }]
register_ops = "cbm1541_register"
capability = "drive_a"
needs = ["newfile"]

[[library]]
name = "sid"
sources = ["sidfile.cc", "resid8.cc", "sid_exports.cc"]
headers = ["sidfile.h", "resid8.h", "sid_api.h"]
exports = [{ name = "sid", major = 1, table = "sid_table" }]

[[library]]
name = "tempdisk"
sources = ["tempdisk.cc", "tempdisk_exports.cc"]
headers = ["tempdisk.h", "tempdisk_api.h"]
exports = [{ name = "tempdisk", major = 1, table = "tempdisk_table" }]
init = "tempdisk_lib_init"

[[library]]
name = "cbmprg"
sources = ["cbm_prg.cc", "cbmprg_exports.cc"]
headers = ["cbm_prg.h", "cbmprg_api.h"]
bind = "cbmprg_bind"
exports = [{ name = "cbmprg", major = 1, table = "cbmprg_table" }]

# The program loader of the CBM family and the C64's go-to-address (c64_go.cc, P1-8: it stays here as part of this library).
[[library]]
name = "cbmrun"
sources = ["cbm_run.cc", "c64_go.cc"]
headers = ["cbm_run.h", "c64_go.h"]
needs = ["cbmprg"]

[[library]]
name = "dma"
sources = ["dmasvc.cc"]
headers = ["dmasvc.h"]
start = "dmasvc_start"

[[library]]
name = "t64"
sources = ["t64.cc", "t64_vlist.cc"]
headers = ["t64.h"]
bind = "t64_bind"

# Where a new file goes and under what name (T122): used by the 1541's Create and Save and by newdisk. The two string helpers generic code needs (nf_base, nf_copy) are in textcopy.h, not here.
[[library]]
name = "newfile"
sources = ["newfile.cc"]
headers = ["newfile.h"]

# "Create blank ..." for the cores with a floppy that is not the 1541 (T122). A core that is compiled registers it itself (newdisk_register, last in its register_ops); a core described by its record gets it by the capability "floppy" (a drive on the floppy interface) or "sio" (the Atari's serial bus, so that a record-described atari800 keeps "New disk image").
[[library]]
name = "newdisk"
sources = ["newdisk.cc"]
headers = ["newdisk.h"]
register_ops = "newdisk_register"
capability = ["floppy", "sio"]
needs = ["newfile"]

# A folder of a medium as an Amiga hard disk (T128). The sector engine (sectors.cc, generic: the base's media engine, its users are engines.cc, mediamounts.cc and the descriptors) mounts it through the table of folderhd_api.h.
[[library]]
name = "folderhd"
sources = ["folderhd.cc", "folderhd_fold.cc", "amiga_ffs.cc", "folderhd_exports.cc"]
headers = ["folderhd.h", "folderhd_impl.h", "amiga_ffs.h", "folderhd_api.h"]
bind = "folderhd_bind"

# The cluster link map of an open FatFs file (T104 5.16). The file manager's CoreFs (fm_fs.cc) uses it through the table of fastseek_api.h.
[[library]]
name = "fastseek"
sources = ["fastseek.cc", "fastseek_exports.cc"]
headers = ["fastseek.h", "fastseek_api.h"]
bind = "fastseek_bind"

# The FTP medium's client and what the Library's FTP folder needs of it (T104.2). netfs.cc (generic: the file system of the application, with the online results) uses it through the table of ftp_api.h.
[[library]]
name = "ftp"
sources = ["ftp_client.cc", "ftp_exports.cc"]
headers = ["ftp_client.h", "ftp_api.h"]
bind = "ftp_bind"

# The USB mouse (T104.1 5.6, Alex's placement: mouse lib). its export "mouse" is its call table (mouse_api.h: engines.cc and baseset.cc call it, nothing else of the library); `init` registers the USB hook, the
# critical section and the 1351's pots (mouse_board.cc). The types a core's description names (MouseSinkSpec) are in mouse_api.h.
[[library]]
name = "mouse"
sources = ["mousesink.cc", "mouse_exports.cc", "mouse_board.cc"]
headers = ["mousesink.h", "mouse_api.h"]
exports = [{ name = "mouse", major = 1, table = "mouse_table" }]
init = "mouse_lib_init"

# The USB gamepads (T156, T196, Alex's placement: gamepad lib): the pad service with its maps and mapping wizard, the HID descriptor reader, the XInput protocol and its USB driver. Its export "pad" is its call
# table (pad_api.h, which also holds PadSpec); `register_ops` is not used: the pad operations are the base's own and go to every core through the table. `init` registers the USB hook and the critical
# section, `core` the XInput claim (pad_board.cc).
[[library]]
name = "pad"
sources = ["pad.cc", "hidpad.cc", "pad_ops.cc", "padwiz.cc", "xinput.cc", "usb_xinput.cc", "pad_exports.cc", "pad_board.cc"]
headers = ["pad.h", "hidpad.h", "xinput.h", "usb_xinput.h", "pad_api.h"]
exports = [{ name = "pad", major = 1, table = "pad_table" }]
init = "pad_lib_init"
core = "pad_lib_core"

# Pad and joystick as keys (T216 P4, T232, Alex's placement: padkeys): the key lists a core's rows name (padkeys.h) and the pad-key row test and key learning (padkeys.cc), through its export "padkeys" (its call table).
[[library]]
name = "padkeys"
sources = ["padkeys.cc", "padkeys_exports.cc"]
headers = ["padkeys.h", "padkeys_api.h"]
exports = [{ name = "padkeys", major = 1, table = "padkeys_table" }]

# The C64U's audio resampling (T228): the filter coefficients and their programming into the resampler (u64_resample.cc, u64_resample.inc). Nothing of this repository calls it since
# base 4.0 (u64cfg.cc went to TRX64-Ultimate, D12); TRX64-Ultimate's library calls it directly, linked through its TOML B.
[[library]]
name = "resample"
sources = ["u64_resample.cc"]
headers = ["u64_resample.h"]

# The zip reader and inflate of miniz (T197; base 4.0: no .u2a, D58): the call table of zip_lib.h, which the sub-app unzip takes through its needs entry `miniz>=1.0` (api->lib->need).
# Unzip is offered where this library is linked (an app without it refuses unzip's need).
[[library]]
name = "miniz"
sources = ["miniz_lib.cc", "miniz.c", "miniz_tinfl.c", "miniz_zip.c"]
headers = ["zip_lib.h"]
exports = [{ name = "miniz", major = 1, table = "miniz_table" }]
