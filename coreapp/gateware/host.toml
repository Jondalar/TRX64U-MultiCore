# TOML A of the host bitstream (T239.3 V-1, D30, D34, D35): the capabilities the host's own gateware decodes at the I/O bus, one block per
# register range with its own driver. Checked against the RTL of host/ by
#   python3 -I tools/rtl_check.py check --design host --list build.tcl --list gideon_vhdl.tcl --toml-a coreapp/gateware/host.toml --maps app/sdkpkg/maps
# (host/ is the design: ultimate_sys.vhd, top.v and the modules they instantiate, with the release's defines: none.)
# owner = "base": the block is decoded in host/, and every property's dir is what the RTL does at its bytes. owner = "core": the host decodes the
# window and hands it to layer 2 (the cw_*, dma_*, drv_*, gcr_io_* and sidcv_* ports of ultimate_sys); rtl_check proves that every byte of it
# reaches a core port, and its properties (a map) are the core's contract, checked in the core's own design, not here.
# The address of a base block is iobase + its offset in ultimate_sys.vhd's decode process; the page registers (0x10040000, 0x10100300,
# 0x10100400, 0x10180000, 0x10181800) are bytes of the page RAM: every byte writes and reads back, the dir here is what the registers do.
# Not in this record (see T239.3 section 5, V-1): the ITU, UART, SD, flash, USB, Ethernet and WiFi windows (Gideon's blocks), the video windows
# (overlay 0x10140000, palette 0x10180800), the IEC window and the UDP window.
# There is no [identity] yet: the standard block (ID, build) is trx_io at 0x101A0000, which lives in layer 2, so it is the core's block here
# (core_trx_io) and `descrec.py compile` (it wants a base-owned identity block) does not take this file until that is decided.
[io]
iobase = 0x10000000
u2p_io_base = 0x10100000

[[block]]
name = "cart_regs"
module = "ultimate_sys"
owner = "base"
address = 0x10040000
size = 0x100
