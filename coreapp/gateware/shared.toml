# TOML A of the shared application (T239.3 P2-3, D31, D34): the blocks its drivers use, at the addresses the shared app has today (iobase and u2p_io_base are the
# build's -DIOBASE and -DU2P_IO_BASE in host-app/target/u64ii/riscv/coreapp/Makefile). The driver table (drvtab.h, drvtab.c) is generated from it by
# `tools/descrec.py drivers` at build time and linked; a driver names a register only through that table. An app linked for c64_basic takes TRX64-Ultimate's TOML A
# in its place (P3-3). The module names are the gateware modules; one module that serves several drivers is one block per register range (D34).
# The identity is the one block every record names; the shared app is built for no single bitstream, so it compares nothing at start (P1-4 is the check for the app of one core).
[io]
iobase = 0x10000000
u2p_io_base = 0x10100000

[identity]
id = "TRX2"
block = "ident"

[[block]]
name = "ident"
module = "trx_io"
owner = "base"
address = 0x101A0000
size = 0x10
  [[block.property]]
  name = "id"
  offset = 0x00
  width = 32
  dir = "r"
  [[block.property]]
  name = "caps"
  offset = 0x04
  width = 8
  dir = "r"
  [[block.property]]
  name = "build"
  offset = 0x08
  width = 32
  dir = "r"

[[block]]
name = "resid8"
module = "trx_io"
owner = "base"
address = 0x101A0040
size = 0xE
map = "sid"

[[block]]
name = "cart_regs"
module = "c64_io"
owner = "base"
address = 0x10040000
size = 0x100
map = "c64cart_regs"

[[block]]
name = "drive_a"
module = "c1541"
owner = "base"
address = 0x10020000
size = 0x4000
map = "cbm1541"

[[block]]
name = "cmd_if"
module = "uci"
owner = "base"
address = 0x10044000
size = 0x10
map = "uci"

[[block]]
name = "gcr_coder"
module = "gcr_coder"
owner = "base"
address = 0x10060500
size = 0x10
map = "gcr_coder"

[[block]]
name = "icap"
module = "icap"
owner = "base"
address = 0x10060600
size = 0x1C
map = "icap"

[[block]]
name = "partition"
module = "icap"
owner = "base"
address = 0x10060620
size = 2
map = "partition"

[[block]]
name = "audio_master"
module = "audio_mixer"
owner = "base"
address = 0x10100550
size = 2
map = "audio_master"

[[block]]
name = "c64_debug"
module = "c64_io"
owner = "base"
address = 0x10181800
size = 0x10
  [[block.property]]
  name = "debug"
  offset = 0x00
  width = 8
  dir = "rw"
