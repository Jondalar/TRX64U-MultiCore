# TOML A of c64_basic with the two blocks the V-1b proof asks for: uci (the shipped map uci) and the drive (the shipped map cbm1541). The check does not follow
# either yet (Gideon's io_bus_bridge2 and io_bus_splitter: the request is decoded behind a clock-domain bridge and an array of request records), so it stops with the
# pattern it does not know; tests/rtl_check/test_rtl_check.py runs it to keep that stop in place until the model of those two exists.
[io]
iobase = 0x10000000
u2p_io_base = 0x10100000

[[block]]
name = "uci"
module = "uci"
owner = "base"
address = 0x10044000
size = 0x2
map = "uci"

[[block]]
name = "drive_a"
module = "cbm1541"
owner = "base"
address = 0x10020000
size = 0x4000
map = "cbm1541"
