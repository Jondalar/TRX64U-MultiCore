# TOML A of c64_basic as rtl_check reads it (fixture, T239.3 P1-3). The blocks are written from what the RTL decodes
# (designs/c64_basic/ultimate_sys.vhd, trx_io.v) and nothing else: a dir is what the code does at the byte, not what a driver header says.
# P1-7 writes the real one. Not here: the C64-clock pages of trx_io (page 1, 2, 3, 5, 7 and page 0 from 0x100: forwarded to trx_sys.v),
# the sampler window (clean room), and the modules that are only reached through a strobe the fixture does not use (uci, drive).
[io]
iobase = 0x10000000
u2p_io_base = 0x10100000

[[block]]
name = "trx_id"
module = "trx_io"
owner = "base"
address = 0x101A0000
size = 0x10

