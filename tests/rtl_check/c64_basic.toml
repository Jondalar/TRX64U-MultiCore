# TOML A of c64_basic as rtl_check reads it (fixture, T239.3 P1-3). The blocks are written from what the RTL decodes
# (designs/c64_basic/ultimate_sys.vhd, trx_io.v) and nothing else: a dir is what the code does at the byte, not what a driver header says.
# P1-7 writes the real one. The blocks resid8, c64cart, cart_regs and dma are the shipped maps (--maps app/sdkpkg/maps); the bytes of the dma block
# are decoded in dma_win.v behind a toggle handshake (stage 2 of the check; its map is the shipped map "dma", a run of 65536 byte registers). Not here, because the check does not follow them yet
# (T239.3 P1-3, not_done): the C64-clock pages of trx_io (page 1, 2, 3, 5, 7 and page 0 from 0x100: trx_sys.v), uci (io_bus_bridge2),
# the drive (drive_unit); the sampler window is clean room.
[io]
iobase = 0x10000000
u2p_io_base = 0x10100000

[[block]]
name = "trx_id"
module = "trx_io"
owner = "base"
address = 0x101A0000
size = 0x10

  [[block.property]]
  name = "id"
  offset = 0x0
  width = 32
  dir = "r"

  [[block.property]]
  name = "caps"
  offset = 0x4
  width = 8
  dir = "r"

  [[block.property]]
  name = "caps2"
  offset = 0x5
  width = 8
  dir = "r"

  [[block.property]]
  name = "caps3"
  offset = 0x6
  width = 8
  dir = "r"

  [[block.property]]
  name = "build"
  offset = 0x8
  width = 32
  dir = "r"

[[block]]
name = "trx_irq"
module = "trx_io"
owner = "base"
address = 0x101A0010
size = 0x8

  [[block.property]]
  name = "irq_en"
  offset = 0x0
  width = 8
  dir = "rw"

  [[block.property]]
  name = "irq_cause"
  offset = 0x4
  width = 8
  dir = "rw"

[[block]]
name = "trx_ddr_cal"
module = "trx_io"
owner = "base"
address = 0x101A0020
size = 0x8

  [[block.property]]
  name = "ddr_cal0"
  offset = 0x0
  width = 32
  dir = "r"

  [[block.property]]
  name = "ddr_cal1"
  offset = 0x4
  width = 32
  dir = "r"

[[block]]
name = "resid8"
module = "trx_io"
owner = "base"
address = 0x101A0040
size = 0xE
map = "sid"

[[block]]
name = "c64cart"
module = "trx_io"
owner = "base"
address = 0x101A4000
size = 0x6B
map = "c64cart"

[[block]]
name = "cart_regs"
module = "cart_regs"
owner = "base"
address = 0x10040000
size = 0x10
map = "c64cart_regs"

[[block]]
name = "audio_mixer"
module = "audio_mixer"
owner = "base"
address = 0x10100500
size = 0xC

  [[block.property]]
  name = "main_r_sid1"
  offset = 0x0
  width = 8
  dir = "w"

  [[block.property]]
  name = "main_l_sid1"
  offset = 0x1
  width = 8
  dir = "w"

  [[block.property]]
  name = "sid2_r"
  offset = 0x2
  width = 8
  dir = "w"

  [[block.property]]
  name = "sid2_l"
  offset = 0x3
  width = 8
  dir = "w"

  [[block.property]]
  name = "sock1_r"
  offset = 0x4
  width = 8
  dir = "w"

  [[block.property]]
  name = "sock1_l"
  offset = 0x5
  width = 8
  dir = "w"

  [[block.property]]
  name = "sock2_r"
  offset = 0x6
  width = 8
  dir = "w"

  [[block.property]]
  name = "sock2_l"
  offset = 0x7
  width = 8
  dir = "w"

  [[block.property]]
  name = "smp_r"
  offset = 0x8
  width = 8
  dir = "w"

  [[block.property]]
