# TOML A of c64_basic as rtl_check reads it (fixture, T239.3 P1-3). The blocks are written from what the RTL decodes
# (designs/c64_basic/ultimate_sys.vhd, trx_io.v) and nothing else: a dir is what the code does at the byte, not what a driver header says.
# P1-7 writes the real one. The blocks c64cart and cart_regs are the shipped maps (--maps app/sdkpkg/maps); the bytes of the dma block
# are decoded in dma_win.v behind a toggle handshake (stage 2 of the check). Not here, because the check does not follow them yet
# (T239.3 P1-3, not_done): the C64-clock pages of trx_io (page 1, 2, 3, 5, 7 and page 0 from 0x100: trx_sys.v), uci (io_bus_bridge2),
# the drive (drive_unit); the sampler window is clean room.
[io]
iobase = 0x10000000
u2p_io_base = 0x10100000

[[block]]
name = "trx_id"
module = "trx_io"
owner = "base"
address = 0x101A0000
size = 0x10

