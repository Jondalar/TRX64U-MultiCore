# A fixture TOML A for tests/rtl_check/mini7, top top7var (T239.3, apple2's a2_regs.vhd): r is written and read; k is read only, although the write branch assigns
# the address to a process variable for every byte.
[io]
iobase = 0x10000000
u2p_io_base = 0x10100000

[[block]]
name = "var"
module = "m7var"
owner = "base"
address = 0x10000030
size = 0x2

  [[block.property]]
  name = "r"
  offset = 0x0
  width = 8
  dir = "rw"

  [[block.property]]
  name = "k"
  offset = 0x1
  width = 8
  dir = "r"
