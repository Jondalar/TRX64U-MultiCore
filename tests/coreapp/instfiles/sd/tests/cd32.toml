# Amiga CD32 pad in port 2, version 2: does any PADDLE_DIS / PADDLE_ADJ setting let the pad shift its buttons out?
# Protocol (cores/amiga/rtl/src/minimig-aga/userio.v:153,202-207,164-169): pin 5 low = shift mode, a rising edge on pin 6 shifts, the
# data is on pin 9. Read order of that model: read 0 (no clock yet) blue, read 1 red, then yellow, green, forward, reverse, play, read 7 = 1,
# then 0. Pins 5 and 9 are pot lines; the only levers are DIS and ADJ, so every setting is tried, once with nothing held, once with red held.
# The reads are PADDLE_CMP bits: cmp2 = pin 5, cmp3 = pin 9 of port 2 (cmp3 measured with a stick, cmp2 is a hypothesis).
# Waits: 5 ms after a lever change and 2 ms after every clock edge (the paddle test's discharge time), so the pot capacitors settle.
kind = "test"

[test]
name = "CD32 pad read, port 2 (v2)"
id = "cd32"
version = 3
menu_input = "keyboard"
needs = ["CD32 pad"]
requires = ["pins.drivable"]

[[prompt]]
id = "none"
text = "Plug the CD32 pad into port 2 and touch NO button. Keep it untouched until the next question. Then press RETURN."
timeout_s = 300

[[prompt]]
id = "red"
text = "HOLD the red button down and keep holding it, also while you press RETURN. Do not let go until the next question."
timeout_s = 300

[[prompt]]
id = "off"
text = "Let go of the red button and touch nothing. Then press RETURN."
timeout_s = 300


[[step]]
op = "wait_user"
prompt = "none"

[[step]]
op = "wait"
us = 5000

[[step]]
op = "sample"
into = "n0_rel"

[[step]]
op = "loop"
count = 9
body = 5

[[step]]
op = "drive"
pins = ["p2_fire"]
level = "low"

[[step]]
op = "wait"
us = 2000

