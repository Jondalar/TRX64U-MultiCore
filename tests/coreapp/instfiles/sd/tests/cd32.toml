[[eval]]
id = "d0_pin5"
value = "n0_d0.cmp"
mask = 4
eq = 0
verdict = "d0 (DIS low, ADJ released): pin 5 (cmp2) reads low"
fail = "d0 (DIS low, ADJ released): pin 5 (cmp2) is not pulled low"

[[eval]]
id = "d0_idle"
value = "n_d0.cmp"
mask = 8
eq = 8
verdict = "d0: pin 9 reads high with no button (read 1)"
fail = "d0: pin 9 reads low with no button (line held low, or no pad)"

[[eval]]
id = "d0_reads"
value = "r_d0.cmp"
mask = 8
differs = "n_d0"
verdict = "d0: red held changes the data (read 1)"
fail = "d0: red held does not change the data (read 1)"

[[eval]]
id = "d0_ok"
all = ["d0_idle", "d0_reads"]
verdict = "WORKS: d0 (DIS low, ADJ released) reads the CD32 pad"
fail = "no pad read with d0 (DIS low, ADJ released)"

[[eval]]
id = "d0_id"
value = "n_d0.cmp"
index = 7
mask = 8
eq = 0
verdict = "d0: data low on read 8 after the ID bit, as the Minimig model shifts"
fail = "d0: data not low on read 8 (the ID check only means something where the data moved)"


