# The Neo Geo core as the core application sees it (T226 pictures; the layout of nes.toml). Registers from cores/neogeo/app/lib/neogeo_regs.h (named in cores/neogeo/app/gateware.toml).
name = "neogeo"
id = "NEO_"                  # neogeo.cc: the gateware's ID word
board = "multicore"          # the ICAP loader answers 0x7A: the multicore profile, "Return to host menu"

[regs]
0x0A0 = 0x01                 # NEO_CTRL: b0 HOLD, the machine in reset after power-up

[handover]
core = "SNK Neo Geo"         # the manifest's name
id = "neogeo"                # core.toml id
path = "/Usb0/cores/neogeo.cor"
video = "1080p"
