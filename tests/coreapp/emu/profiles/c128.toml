# The Commodore 128 core of TRX64U-MultiCore as the core application sees it (the layout of amiga1200.toml). Tests only (T205 emulator pictures).
name = "c128"
id = "C128"
board = "multicore"

[regs]
0x0A0 = 0x01                 # CTRL: b0 HOLD
0xE050 = 0x00                 # C128_ROM_BASE 0x01C00000 (the ROM image's DDR2 address, little endian)
0xE051 = 0x00
0xE052 = 0xC0
0xE053 = 0x01

[ro]
0xE040 = 0x00                 # C128_ROM_CTRL: b0 walker busy reads 0

[handover]
core = "Commodore 128"
id = "c128"
path = "/Usb0/cores/c128.cor"
video = "1080p"
