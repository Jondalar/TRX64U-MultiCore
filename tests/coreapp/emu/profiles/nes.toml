# The NES core of TRX64U-MultiCore as the core application sees it (the layout of amiga1200.toml, S44 of the u64-emulator repository).
# Registers from cores/nes/app/gateware.toml.
name = "nes"
id = "NES_"                  # cores/nes/app/lib/nes.cc: the gateware's ID word
board = "multicore"          # the ICAP loader answers 0x7A: the multicore profile, "Return to host menu"

[regs]
0x0A0 = 0x01                 # NES_CTRL: b0 HOLD, the machine in reset after power-up

[handover]
core = "Nintendo Entertainment System"   # the manifest's name
id = "nes"                               # core.toml id
path = "/Usb0/cores/nes.cor"             # the core folder is next to it: give --usb-dir
video = "1080p"
