# A core's own menu tables (T239.3 P1-8, in place of the compiled menu of trx64u that these tests read before; that menu is TRX64-Ultimate's now): the record of a
# made-up core with its own tasks, media, 20 file types (the merge cuts at CONTRIB_FILETYPES_MAX 40, it was cut at 16 once), settings, a restart and a pad.
# tests/coreapp/gen_bundle.py compiles it to desc_own.bin; test_descrec.cc (the reader and its refusals), test_bundle.cc (the built-in record serves a start
# without a .cor) and test_pad.cc (a record's pad) read it. Names are the test core's (test_core.h) and the base's; tools/descrec.py checks none of them here.

machine_info = "Sound,Speed"

[restart]
clear_ram = 65536
ram_only = true

[[task]]
group = "top"
label = "Reset"
op = "machine.cold_reset"
closes_menu = true

[[task]]
group = "top"
label = "Reload ROMs, reset"
op = "machine.reload_roms"
closes_menu = true

[[task]]
