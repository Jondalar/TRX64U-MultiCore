op = "test.task"
bind = [ { arg = "name", text = true } ]
ask = "Name of the copy"
ask_state = "test.slot"

[[task]]
group = "c64"
label = "Task 15"
op = "test.task"
closes_menu = true

[[task]]
group = "c64"
label = "Make a blank"
op = "test.task"
bind = [ { arg = "path", text = true } ]
ask = "Name of the blank"
ask_state = "test.slot"
pick_dir = true

[[media]]
name = "Slot"
state = "test.slot"
eject_op = "test.eject"
eject_bind = [ { arg = "slot", str = "a" } ]
exts = ".t00,.t01"
mount = "Mount"
mounted_tasks = "Do it,Task 3"

[[media]]
name = "Cartridge port"
state = "test.slot"
eject_op = "test.eject"
exts = ".t02"
mount = "Run"
eject_closes = true

[[media]]
name = "Program"
state = "test.slot"

