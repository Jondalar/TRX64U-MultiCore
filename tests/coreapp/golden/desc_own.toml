[[core_setting]]
group = "Machine"
key = "Freeze mode"
values = ["Whole machine", "CPU only"]
default = 0
when = "reset"
apply = "test.set_b"

[[core_setting]]
group = "Machine"
key = "Sound"
values = ["Off", "On"]
default = 1
apply = "test.set_a"

[[core_setting]]
group = "Drive_A"
key = "Drive"
label = "Drive enable"
values = ["Disabled", "Enabled"]
default = 1
apply = "test.set_a"

[[core_setting]]
group = "Drive_A"
key = "Disk swap delay"
values = ["0 ms", "100 ms", "200 ms", "300 ms", "400 ms", "500 ms", "600 ms", "700 ms", "800 ms", "1000 ms"]
default = 0
apply = "test.set_b"

[pad]
output = "joystick"
per_pad = true
buttons = ["Up", "Down", "Left", "Right", "Fire"]
default = ["up", "down", "left", "right", "face_bottom"]
