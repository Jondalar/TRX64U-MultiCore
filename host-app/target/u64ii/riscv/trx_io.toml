# The fixed fragment of TOML A that the shared core application and the host application link until step 2 of T239.3 (P1-2): the two base addresses of the
# I/O space and the ICAP block, with today's values (host/ultimate_sys.vhd). It has no [identity], so it is no record; tools/descrec.py ldfrag turns it into
# trx_io.ld, which the Makefiles of coreapp and hostapp link. A core's app links the ldfrag of its own TOML A in place of it (IOFRAG).
[io]
iobase = 0x10000000
u2p_io_base = 0x10100000

[[block]]
name = "icap"
module = "icap"
owner = "base"
address = 0x10060600
size = 0x100
map = "icap"
